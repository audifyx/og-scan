<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OrbitX Tools</title>
<!--
  OrbitX ChatGPT Mini App — Tools directory (24 categories, 1,714 MCP tools)
  resourceUri: ui://widget/orbitx-tools.html
  Bridge: window.OrbitX.callTool(name, args) when hosted, else window.openai.callTool,
          else standalone fallback POSTs to https://www.orbitx.world/api/mcp
  Data source: tool-categories.json — live tools/list from https://www.orbitx.world/api/mcp
  (1714 tools total; 48 screener families collapsed into 24 categories).
  status=available: a real ui:// widget is wired to the category's flagship tool.
  status=coming_soon: the MCP tool exists but no mini-app widget is wired yet — never fake availability.
-->
<style>
:root{
  --bg:#07080e; --panel:#0b0e16; --panel2:#0e1220; --line:#161b28;
  --txt:#e8eaf2; --muted:#9aa0b8; --faint:#5c6178;
  --neon:#17ff4d; --neon-dim:rgba(23,255,77,.14);
  --gold:#fbbf24; --danger:#f87171; --r:18px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  min-height:100vh}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(600px 300px at 15% -5%, rgba(23,255,77,.07), transparent 60%),
   radial-gradient(700px 380px at 90% 10%, rgba(23,255,77,.04), transparent 60%),
   radial-gradient(500px 500px at 50% 110%, rgba(23,255,77,.05), transparent 60%);}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
/* ---------- header ---------- */
.header{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.logo img.oxlogo{width:38px;height:38px;border-radius:10px;filter:drop-shadow(0 0 10px rgba(23,255,77,.7))}
.brand{font-weight:800;letter-spacing:2px;font-size:19px;line-height:1.1}
.brand small{display:block;font-size:10px;letter-spacing:4px;color:var(--neon);font-weight:700;margin-top:3px}
.countpill{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);
  border-radius:20px;padding:8px 13px;background:var(--panel);white-space:nowrap}
.countpill b{color:var(--neon)}
/* ---------- search + chips ---------- */
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.55}
#q{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--txt);
  padding:17px 16px 17px 46px;font-size:15px;outline:none;font-family:inherit;min-height:56px}
#q:focus{border-color:var(--neon);box-shadow:0 0 0 2px rgba(23,255,77,.18)}
#q::placeholder{color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:999px;padding:0 18px;min-height:54px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.chip.on{color:var(--neon);border-color:var(--neon);background:var(--neon-dim)}
/* ---------- cards ---------- */
#cards{display:flex;flex-direction:column}
.tcard{display:flex;gap:14px;padding:20px 0;border-bottom:1px solid #141824}
.tcard:first-child{border-top:1px solid #141824}
.thumb{flex:0 0 118px;width:118px;height:150px;border-radius:16px;overflow:hidden;
  background:var(--panel);border:1px solid var(--line)}
.thumb svg{display:block;width:100%;height:100%}
.tmain{flex:1;min-width:0;display:flex;flex-direction:column}
.ttitle{font-weight:800;font-size:21px;letter-spacing:.2px;margin:0 0 8px}
.pill{display:inline-block;align-self:flex-start;font-size:12.5px;font-weight:800;border-radius:999px;
  padding:7px 14px;margin-bottom:10px}
.pill.avail{color:var(--neon);background:rgba(23,255,77,.13);border:1px solid rgba(23,255,77,.35)}
.pill.soon{color:var(--muted);background:#141824;border:1px solid var(--line)}
.tdesc{color:var(--txt);font-size:15px;line-height:1.55;margin:0 0 10px}
.ttool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tlabel{color:var(--muted);font-size:13.5px}
.tchip{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12.5px;background:#12151f;border:1px solid #1e2433;border-radius:8px;
  padding:7px 10px;color:#c9cede;word-break:break-all}
.openbtn{background:#fff;color:#000;border:0;border-radius:20px;min-height:56px;
  font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;width:100%}
.openbtn:active{transform:scale(.98)}
.openbtn.busy{opacity:.6;cursor:wait}
.soonbtn{background:#141824;color:var(--faint);border:1px solid var(--line);border-radius:20px;
  min-height:56px;font-size:16px;font-weight:700;font-family:inherit;width:100%;cursor:not-allowed}
/* inline tool result */
.result{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;font-size:13px}
.result .rpre{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
  line-height:1.5;color:#c9cede;white-space:pre-wrap;word-break:break-word;margin:0;max-height:260px;overflow:auto}
.result .rmut{color:var(--faint);font-size:11px;margin-top:8px}
.result .rerr{color:#ffb9c0;font-size:13px;line-height:1.5}
.skel{position:relative;overflow:hidden;background:#10141d;border-radius:10px;min-height:16px;margin-bottom:8px}
.skel::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(23,255,77,.10),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
/* ---------- states ---------- */
.empty{text-align:center;padding:44px 18px;color:var(--muted);font-size:14px;line-height:1.6}
.empty .big{font-size:44px;margin-bottom:10px}
.mut{color:var(--muted);font-size:12px}
input,textarea{autocomplete:off}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* UI polish: smooth transitions, press feedback, fade-in */
.card,.tcard,.toolrow,.qbtn,.stat{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:hover,.tcard:hover{border-color:rgba(23,255,77,.25)}
button{transition:transform .12s ease,opacity .12s ease,border-color .15s ease}
button:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card,.tcard{animation:fadeUp .32s ease both}
@media (prefers-reduced-motion:reduce){.card,.tcard{animation:none}}
</style>
</head>

   (window.openai / window.OrbitX) return the raw envelope
   {content:[...], structuredContent} — callers expect the data itself. */
function unwrapToolResult(r){
  if(!r || typeof r!=="object") return r;
  if(r.isError){
    const t=Array.isArray(r.content)?r.content.find(c=>c&&c.type==="text"&&typeof c.text==="string"):null;
    throw new Error((t&&t.text)||"tool error");
  }
  if(r.structuredContent && typeof r.structuredContent==="object") return r.structuredContent;
  if(Array.isArray(r.content) && r.content.length && r.content[0] && (r.content[0].type==="text"||r.content[0].type==="resource")){
    const t=r.content.find(c=>c&&c.type==="text"&&typeof c.text==="string");
    if(t){ try{ return JSON.parse(t.text); }catch(e){ return t.text; } }
    return r.content;
  }
  return r;
}

  async callTool(name, args){

      return unwrapToolResult(await window.openai.callTool(name, args));

      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json, text/event-stream"},
      body: JSON.stringify({jsonrpc:"2.0", id:"w"+Date.now()+Math.floor(Math.random()*999), method:"tools/call",

      const lines = raw.split(/\r?\n/).filter(l=>l.indexOf("data:")===0);

function groupOf(num){ for(const g in GROUPS){ if(GROUPS[g].includes(num)) return g; } return "markets"; }
function filtered(){
  const q = S.q.trim().toLowerCase();
  return CATS.filter(c=>{
    if(S.chip!=="all" && groupOf(c.num)!==S.chip) return false;
    if(!q) return true;
    return (c.name+" "+c.tool+" "+c.description).toLowerCase().includes(q);
  });
}
function cardHTML(c){
  const avail = c.status==="available";
  const openLabel = "Open "+c.name.toLowerCase();
  const btn = avail
    ? '<button class="openbtn" data-tool="'+esc(c.tool)+'">'+esc(openLabel)+'</button>'
    : '<button class="soonbtn" disabled>Soon</button>';
  return '<article class="tcard" data-num="'+c.num+'">'
    +'<div class="thumb">'+thumb(c.thumbnail)+'</div>'
    +'<div class="tmain">'
    +'<h2 class="ttitle">'+c.num+'. '+esc(c.name)+'</h2>'
    +'<span class="pill '+(avail?"avail":"soon")+'">'+(avail?"Available now":"Coming soon")+'</span>'
    +'<p class="tdesc">'+esc(c.description)+'</p>'
    +'<div class="ttool"><span class="tlabel">MCP tool:</span><code class="tchip">'+esc(c.tool)+'</code></div>'
    +btn
    +'<div class="result" id="res-'+c.num+'" hidden></div>'
    +'</div></article>';
}
function render(){
  const list = filtered();
  const cards = document.getElementById("cards");
  cards.innerHTML = list.map(cardHTML).join("");
  document.getElementById("empty").hidden = list.length>0;
  cards.querySelectorAll(".openbtn").forEach(b=> b.addEventListener("click", ()=>openCategory(b)));
}
function renderChips(){
  const el = document.getElementById("chips");
  el.innerHTML = CHIP_DEFS.map(d=>'<button class="chip'+(S.chip===d[0]?" on":"")+'" data-g="'+d[0]+'" role="tab">'+esc(d[1])+'</button>').join("");
  el.querySelectorAll(".chip").forEach(b=> b.addEventListener("click", ()=>{ S.chip=b.dataset.g; renderChips(); render(); }));
}

/* ================= Tool launch ================= */
function renderResult(out){
  if(out==null) return '<div class="rmut">Tool returned no data.</div>';
  if(typeof out==="string") return '<pre class="rpre">'+esc(out.slice(0,3000))+'</pre>';
  if(typeof out.text==="string" && !out.structuredContent)
    return '<pre class="rpre">'+esc(out.text.slice(0,3000))+'</pre>';
  const txt = JSON.stringify(out,null,2).slice(0,3000);
  return '<pre class="rpre">'+esc(txt)+'</pre>'
    +'<div class="rmut">Live tool result, truncated to 3KB. The target widget renders in ChatGPT via the tool&rsquo;s _meta binding.</div>';
}
async function openCategory(btn){
  const name = btn.dataset.tool;
  const box = document.getElementById("res-"+btn.closest(".tcard").dataset.num);
  btn.disabled = true; btn.classList.add("busy"); btn.textContent = "Opening\u2026";
  box.hidden = false;
  box.innerHTML = '<div class="skel" style="height:16px"></div><div class="skel" style="height:16px;width:80%"></div><div class="skel" style="height:16px;width:60%"></div>';
  try{
    const args = {};
    const a = getAuth(); if(a) args.authCode = a;
    const out = await Bridge.callTool(name, args);
    box.innerHTML = renderResult(out);
    btn.textContent = "Open again";
  }catch(e){
    const msg = String((e&&e.message)||e||"unknown error");
    if(AUTH_ERR_RE.test(msg)) window.dispatchEvent(new CustomEvent("orbitx-auth-error",{detail:{message:msg}}));
    box.innerHTML = '<div class="rerr">Couldn&rsquo;t run <b>'+esc(name)+'</b>: '+esc(msg)+'</div>';
    btn.textContent = "Retry";
  }finally{
    btn.disabled = false; btn.classList.remove("busy");
  }
}

/* ================= Boot ================= */
document.getElementById("q").addEventListener("input", e=>{ S.q=e.target.value; render(); });
document.getElementById("ccount").textContent = CATS.length;
document.getElementById("app").insertAdjacentHTML("afterbegin", standaloneNote());
renderChips();
render();
</script>
</body>
