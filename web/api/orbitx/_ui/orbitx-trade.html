<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OrbitX Trade Ticket</title>
<!--
  OrbitX ChatGPT Mini App — Trade Ticket
  resourceUri: ui://widget/orbitx-trade.html
  Bridge: window.OrbitX.callTool(name, args) when hosted in the OrbitX bridge,
  standalone fallback: POST JSON-RPC tools/call -> https://www.orbitx.world/api/mcp
  Trading law: NOTHING executes without explicit user confirmation on the CONFIRM screen.
-->
<style>
:root{
  --neon:#17ff4d; --neon-dim:#00cc6a; --bg:#05080a; --card:#0b1116;
  --card2:#0e151b; --line:#1b2a33; --txt:#eafff2; --mut:#8fa3ad;
  --red:#ff5470; --amber:#ffb02e;
  --r:18px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;overscroll-behavior:none}
body{padding:var(--sat) 0 var(--sab) 0;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:calc(100vh - var(--sat) - var(--sab));
  position:relative;overflow:hidden;padding:18px 16px 28px}
/* ambient background */
#bgfx{position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(600px 300px at 50% -80px, rgba(23,255,77,.10), transparent 70%),
    radial-gradient(400px 240px at 90% 110%, rgba(23,255,77,.05), transparent 70%);}
#bgfx::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(23,255,77,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(23,255,77,.05) 1px,transparent 1px);
  background-size:36px 36px;
  mask-image:radial-gradient(500px 500px at 50% 0%, #000 30%, transparent 80%);}
.screen{position:relative;z-index:1;animation:rise .35s cubic-bezier(.2,.9,.25,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,#062b1a,#03120b);border:1px solid rgba(23,255,77,.35);
  box-shadow:0 0 22px rgba(23,255,77,.25), inset 0 0 12px rgba(23,255,77,.12)}
.logo img.oxlogo{width:38px;height:38px;border-radius:12px}
.brand{font-weight:800;letter-spacing:.14em;font-size:15px}
.brand small{display:block;font-weight:500;letter-spacing:.32em;font-size:9px;color:var(--mut)}
.back{margin-left:auto;background:var(--card2);border:1px solid var(--line);color:var(--mut);
  border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
.card{background:linear-gradient(180deg,rgba(17,26,32,.92),rgba(10,16,20,.96));
  border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.45)}
.card.neon{border-color:rgba(23,255,77,.35);box-shadow:0 0 0 1px rgba(23,255,77,.08),0 14px 40px rgba(0,0,0,.5),0 0 34px rgba(23,255,77,.08)}
h2{margin:0 0 4px;font-size:20px;font-weight:800}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px;line-height:1.5}
input[type=text],input[type=number]{width:100%;background:#060b0e;border:1px solid var(--line);
  color:var(--txt);border-radius:14px;padding:14px;font-size:16px;outline:none;transition:.2s}
input:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(23,255,77,.12)}
.btn{display:block;width:100%;border:none;cursor:pointer;border-radius:16px;padding:16px;
  font-size:16px;font-weight:800;letter-spacing:.02em;transition:transform .12s, box-shadow .2s, opacity .2s}
.btn:active{transform:scale(.98)}
.btn-neon{background:linear-gradient(180deg,#17ff4d,#17ff4d);color:#03130b;
  box-shadow:0 8px 28px rgba(23,255,77,.35)}
.btn-neon:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn-ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn-danger{background:rgba(255,84,112,.1);color:var(--red);border:1px solid rgba(255,84,112,.4)}
.row{display:flex;gap:10px}.row .btn{padding:14px}
.mut{color:var(--mut)}.tiny{font-size:11px}.center{text-align:center}
/* search results */
.tok{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;
  border:1px solid transparent;cursor:pointer;transition:.15s}
.tok:hover,.tok:active{background:rgba(23,255,77,.05);border-color:rgba(23,255,77,.25)}
.tok .avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-weight:800;font-size:15px;color:#03130b;background:linear-gradient(135deg,#17ff4d,#00b4ff)}
.tok .meta{flex:1;min-width:0}.tok .sym{font-weight:800;font-size:15px}
.tok .name{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok .num{text-align:right;font-size:13px}.tok .num b{display:block;font-size:14px}
.tok .num span{color:var(--mut);font-size:11px}
.verified{font-size:10px;color:var(--neon);border:1px solid rgba(23,255,77,.4);
  border-radius:6px;padding:1px 5px;margin-left:6px}
/* side toggle */
.side-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#060b0e;
  border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:12px}
.side-toggle button{border:none;background:transparent;color:var(--mut);font-weight:800;
  font-size:15px;padding:12px;border-radius:12px;cursor:pointer;transition:.2s}
.side-toggle button.on-buy{background:linear-gradient(180deg,#17ff4d,#17ff4d);color:#03130b;
  box-shadow:0 4px 18px rgba(23,255,77,.35)}
.side-toggle button.on-sell{background:linear-gradient(180deg,#ff6b8a,#e83a5f);color:#fff;
  box-shadow:0 4px 18px rgba(255,84,112,.35)}
/* amount */
.amtwrap{display:flex;gap:8px;margin-bottom:12px}
.amtwrap input{flex:1;font-size:22px;font-weight:800;text-align:right}
.curtog{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;flex:none}
.curtog button{background:#060b0e;border:none;color:var(--mut);padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer}
.curtog button.on{background:rgba(23,255,77,.14);color:var(--neon)}
/* slippage */
.slips{display:flex;gap:8px;flex-wrap:wrap}
.slip{border:1px solid var(--line);background:#060b0e;color:var(--mut);border-radius:12px;
  padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.slip.on{border-color:var(--neon);color:var(--neon);background:rgba(23,255,77,.08);
  box-shadow:0 0 14px rgba(23,255,77,.15)}
/* quote rows */
.qrow{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;
  border-bottom:1px dashed rgba(27,42,51,.8);font-size:14px}
.qrow:last-child{border-bottom:none}
.qrow .k{color:var(--mut)}.qrow .v{font-weight:700;font-variant-numeric:tabular-nums}
.big-out{text-align:center;padding:14px 0 6px}
.big-out .amt{font-size:34px;font-weight:900;letter-spacing:-.02em}
.big-out .lbl{font-size:12px;color:var(--mut);letter-spacing:.2em;margin-top:4px}
/* confirm */
.confirm-box{border:1px solid rgba(255,176,46,.4);background:rgba(255,176,46,.05);
  border-radius:var(--r);padding:16px;margin-bottom:12px}
.warn{display:flex;gap:10px;align-items:flex-start;background:rgba(255,84,112,.08);
  border:1px solid rgba(255,84,112,.35);border-radius:14px;padding:12px;font-size:13px;
  color:#ffb3c2;margin-bottom:12px;line-height:1.5}
/* status */
.status-hero{text-align:center;padding:26px 0 10px}
.spinner{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;
  border:3px solid rgba(23,255,77,.15);border-top-color:var(--neon);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.checkmark{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;
  background:rgba(23,255,77,.12);border:2px solid var(--neon);box-shadow:0 0 30px rgba(23,255,77,.4);
  animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.xmark{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,84,112,.1);border:2px solid var(--red)}
.sig{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;
  background:#060b0e;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;color:var(--neon)}
/* skeleton */
.skel{border-radius:12px;background:linear-gradient(90deg,#0c141a 25%,#14202a 50%,#0c141a 75%);
  background-size:200% 100%;animation:shim 1.2s infinite}
@keyframes shim{to{background-position:-200% 0}}
.err{background:rgba(255,84,112,.08);border:1px solid rgba(255,84,112,.35);color:#ffb3c2;
  border-radius:14px;padding:13px;font-size:13.5px;line-height:1.5;margin-bottom:12px}
.countdown{font-variant-numeric:tabular-nums;font-weight:800;color:var(--amber)}
.link{color:var(--neon);text-decoration:none;font-weight:700}
.divider{height:1px;background:var(--line);margin:14px 0}
.chip{display:inline-block;background:rgba(23,255,77,.1);border:1px solid rgba(23,255,77,.3);
  color:var(--neon);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.hidden{display:none!important}
/* ===== dashboards #14/#15/#16/#23 ===== */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:1px solid var(--line);background:var(--card2);color:var(--mut);
  border-radius:12px;padding:11px 10px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;text-align:center}
.tab.on{border-color:var(--neon);color:var(--neon);background:rgba(23,255,77,.08);
  box-shadow:0 0 14px rgba(23,255,77,.12)}
select{width:100%;background:#060b0e;border:1px solid var(--line);color:var(--txt);
  border-radius:14px;padding:14px;font-size:16px;outline:none;appearance:none}
select:focus{border-color:var(--neon)}
.flabel{display:block;margin:0 0 8px;letter-spacing:.18em;font-size:11px;color:var(--mut);font-weight:700}
.field{margin-bottom:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#060b0e;border:1px solid var(--line);
  border-radius:16px;padding:6px;margin-bottom:12px}
.seg button{border:none;background:transparent;color:var(--mut);font-weight:800;font-size:14px;
  padding:12px;border-radius:12px;cursor:pointer;transition:.2s}
.seg button.on{background:rgba(23,255,77,.14);color:var(--neon);box-shadow:0 0 14px rgba(23,255,77,.12)}
.ocard{background:#0a1116;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.ocard .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ocard .ttl{font-weight:800;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip2{display:inline-block;border:1px solid;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800}
.pbar{height:8px;background:#0a1216;border-radius:99px;overflow:hidden;border:1px solid var(--line);margin:8px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#17ff4d,#00cc6a);border-radius:99px;transition:width .4s}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv .cell{background:#060b0e;border:1px solid var(--line);border-radius:12px;padding:10px}
.kv .k{font-size:10px;letter-spacing:.14em;color:var(--mut);margin-bottom:4px}
.kv .v{font-weight:800;font-size:15px}
.pos{color:var(--neon)}.neg{color:var(--red)}
.inline-confirm{display:flex;gap:8px;margin-top:10px}
.inline-confirm .btn{padding:10px;font-size:13px}
pre.raw{background:#060b0e;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:11px;
  color:var(--mut);white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto}

/* UI polish: smooth transitions, press feedback, fade-in */
.card,.tcard,.toolrow,.qbtn,.stat{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:hover,.tcard:hover{border-color:rgba(23,255,77,.25)}
button{transition:transform .12s ease,opacity .12s ease,border-color .15s ease}
button:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card,.tcard{animation:fadeUp .32s ease both}
@media (prefers-reduced-motion:reduce){.card,.tcard{animation:none}}
</style>

<body>
<div id="bgfx"></div>
<div id="app"></div>
<script>
"use strict";
/* ================= Bridge ================= */
const MCP_URL = "https://www.orbitx.world/api/mcp";
const Bridge = {
  async callTool(name, args){
    let out;
    if (window.OrbitX && typeof window.OrbitX.callTool === "function"){
      out = await window.OrbitX.callTool(name, args); // hosted bridge (CONTRACT.md)
    } else {
    // standalone fallback: POST MCP JSON-RPC directly (no bridge).
    // Sends Accept for both plain JSON and SSE; parses either.
    const res = await fetch(MCP_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json, text/event-stream"},
      body: JSON.stringify({jsonrpc:"2.0", id:"t"+Date.now()+Math.floor(Math.random()*999), method:"tools/call",
        params:{name, arguments:args||{}}})
    });
    if(!res.ok) throw new Error("MCP HTTP "+res.status);
    const raw = await res.text();
    let j;
    try{
      const lines = raw.split(/\r?\n/).filter(l=>l.indexOf("data:")===0);
      j = JSON.parse((lines.length?lines[lines.length-1].slice(5):raw).trim());
    }catch(e){ throw new Error("bad MCP response"); }
    if(j.error) throw new Error(j.error.message||"tool error");
    const content = j.result && j.result.content;
    if(Array.isArray(content)){
      const t = content.find(c=>c.type==="text");
      if(t){ try{ out=JSON.parse(t.text); }catch(e){ out=t.text; } }
      else out=content;
    }
    else out=j.result;
    }
    // widgetAction hook (e.g. DCA schedule import from orbitx_dca_create, agent auto-start)
    try{
      const wa=out&&typeof out==="object"?(out.widgetAction||(out.structuredContent&&out.structuredContent.widgetAction)):null;
      if(wa){
        if(typeof dcaHandleWidgetAction==="function") dcaHandleWidgetAction(wa);
        if(typeof asnipeHandleWidgetAction==="function") asnipeHandleWidgetAction(wa);
      }
    }catch(e){}
    return out;
  }
};
const AUTH_KEY = "orbitx_auth_code";
const AUTH_KEYS_T = ["orbitx.authCode","orbitx_auth_code"];
const getAuth = ()=>{ try{ for(const k of AUTH_KEYS_T){ const v=localStorage.getItem(k); if(v) return v; } }catch(e){} return ""; };
const setAuth = (c)=>{ try{ localStorage.setItem("orbitx.authCode",c); }catch(e){} try{ localStorage.setItem(AUTH_KEY,c); }catch(e){} };
function openUrl(href){ if(!href) return;
  try{
    if(window.openai&&typeof window.openai.openExternal==="function"){ window.openai.openExternal({href}); return; }
    if(window.OrbitX&&typeof window.OrbitX.openUrl==="function"){ window.OrbitX.openUrl(href); return; }
  }catch(e){}
  window.open(href,"_blank","noopener"); }

/* ---------- Standalone auth: link → wallet sign-in → paste code ---------- */
const SA = { link:"", busy:false };
function saIsStandalone(){
  return !((window.openai&&typeof window.openai.callTool==="function")
    || (window.OrbitX&&typeof window.OrbitX.callTool==="function"));
}
async function saGetLink(){
  if(SA.busy) return; SA.busy=true; render();
  try{
    const r = await Bridge.callTool("orbitx_auth_link", {});
    const u = r && (r.url||r.authUrl||r.auth_url||r.authLink||r.link);
    if(!u) throw new Error("no auth URL returned");
    SA.link = u; openUrl(u);
  }catch(e){ SA.link=""; }
  SA.busy=false; render();
}
function saSaveTrade(){
  const el=document.getElementById("authin");
  const v=el && el.value ? el.value.trim() : "";
  if(!v) return; setAuth(v); S.authCode=v; SA.link=""; S.screen="search"; render();
}

/* ================= State ================= */
const S = {
  screen:"boot", authCode:getAuth(),
  query:"", tokens:[], token:null,
  side:"buy", amount:"", currency:"SOL", slip:1, customSlip:"",
  quote:null, quoteExpires:0, timer:null, error:"", execSig:"", execStatus:""
};

/* ================= Helpers ================= */
const app = document.getElementById("app");
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n,d)=>{ if(n==null||n===""||isNaN(Number(n))) return "—";
  const x=Number(n); return x>=1e9?(x/1e9).toFixed(2)+"B":x>=1e6?(x/1e6).toFixed(2)+"M":
  x>=1e3?(x/1e3).toFixed(2)+"K":x.toFixed(d!=null?d:(x<1?6:2)); };
const fmtUSD = n=>{ if(n==null||isNaN(Number(n))) return "—"; const x=Number(n);
  return x<0.01&&x>0 ? "$"+x.toExponential(2) : "$"+fmt(x); };
const shortMint = m=>m&&m.length>10?m.slice(0,4)+"…"+m.slice(-4):esc(m||"");

function goBack(){ /* wired per-screen via window handlers below */ }
function clearTimer(){ if(S.timer){clearInterval(S.timer); S.timer=null;} }

/* ================= Screens ================= */
function render(){ app.innerHTML = ""; const d=document.createElement("div"); d.className="screen";
  ({boot:scrBoot, auth:scrAuth, search:scrSearch, ticket:scrTicket, quote:scrQuote,
    confirm:scrConfirm, exec:scrExec, done:scrDone,
    ...(typeof DASH_SCREENS!=="undefined"?DASH_SCREENS:{})}[S.screen]||scrBoot)(d); app.appendChild(d); }

function scrBoot(el){
  el.innerHTML = header(false)+`<div class="card"><div class="skel" style="height:22px;margin-bottom:10px"></div>
    <div class="skel" style="height:14px;width:70%;margin-bottom:14px"></div>
    <div class="skel" style="height:52px"></div></div>`;
  setTimeout(()=>{ S.screen = S.authCode ? "search" : "auth"; render(); }, 500);
}

/* ---- not authed ---- */
function scrAuth(el){
  el.innerHTML = header(false)+`
  <div class="card neon center">
    <h2>Connect OrbitX</h2>
    <p class="sub">Trading runs on your connected OrbitX wallet.<br>Connect once — your session key stays on this device.</p>
    ${saIsStandalone()
      ? (SA.link
        ? `<p class="tiny mut">Sign-in link opened — complete wallet sign-in there, then paste your code:</p>`
        : `<button class="btn btn-neon" onclick="saGetLink()">${SA.busy?"…":"Get sign-in link"}</button>
           <div class="divider"></div>`)
      : `<button class="btn btn-neon" onclick="location.href='https://www.orbitx.world'">Connect on orbitx.world</button>
         <div class="divider"></div>`}
    <p class="tiny mut">Already have a session code? Paste it:</p>
    <input type="text" id="authin" placeholder="paste authCode" style="margin-bottom:10px" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn btn-ghost" onclick="saSaveTrade()">Save session</button>
    ${saIsStandalone()&&SA.link?`<p class="tiny mut" style="margin-top:8px"><a href="#" onclick="openUrl(SA.link);return false;">re-open sign-in link</a></p>`:""}
  </div>`;
}

/* ---- token search ---- */
function scrSearch(el){
  el.innerHTML = header(false)+tabBar("trade")+`
  <div class="card">
    <h2>Pick a token</h2>
    <p class="sub">Search by name, symbol, or paste a mint address.</p>
    <div class="row" style="margin-bottom:10px">
      <input type="text" id="q" placeholder="e.g. BONK or So111…pump" value="${esc(S.query)}" style="flex:1"
        onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn btn-neon" style="width:auto;padding:14px 20px" onclick="doSearch()">Search</button>
    </div>
    <div id="results"></div>
    ${S.error?`<div class="err">${esc(S.error)}</div>`:""}
  </div>
  <p class="tiny mut center">Prices & safety data from <b>orbitx_crypto_scan</b> — every number on this ticket is live.</p>`;
}
async function doSearch(){
  const q=document.getElementById("q").value.trim(); if(!q) return;
  S.query=q; S.error=""; const box=document.getElementById("results");
  box.innerHTML=`<div class="skel" style="height:66px;margin-bottom:8px"></div><div class="skel" style="height:66px"></div>`;
  try{
    const r = await Bridge.callTool("orbitx_crypto_scan",{query:q, mint:q, authCode:S.authCode});
    const list = normTokens(r);
    S.tokens=list;

<script>

function scrConfirm(el){

    <div class="qrow"><span class="k">Expires in</span><span class="v countdown" id="cd">—</span></div>
  </div>
  <div class="warn">⛓ <span>This signs a <b>real on-chain transaction</b> from your connected OrbitX wallet. Review every number above — it cannot be reversed.</span></div>
  <div class="row">
    <button class="btn btn-ghost" onclick="cancelConfirm()">Cancel</button>
    <button class="btn btn-neon" id="confirmBtn" onclick="executeTrade()">✓ Confirm ${sideT}</button>
  </div>
  ${S.error?`<div class="err" style="margin-top:12px">${esc(S.error)}</div>`:""}`;
  goBack=()=>cancelConfirm();
  S.timer=setInterval(()=>{const c=document.getElementById("cd");
    if(c)c.textContent=Math.max(0,Math.ceil((S.quoteExpires-Date.now())/1000))+"s";
    if(Date.now()>S.quoteExpires){clearTimer();S.error="Quote expired before confirmation — get a fresh quote.";S.quote=null;S.screen="ticket";render();}},500);
}
function cancelConfirm(){ clearTimer(); S.screen="quote"; render(); }

/* ---- execution ---- */
async function executeTrade(){
  const btn=document.getElementById("confirmBtn");
  if(btn){btn.disabled=true;btn.textContent="Signing…";}
  clearTimer();
  S.screen="exec"; S.error=""; S.execStatus="pending"; S.execSig=""; render();
  const t=S.token, q=S.quote||{};
  const args={mint:t.mint, side:S.side, amount:parseFloat(S.amount), amountCurrency:S.currency,
    slippagePct:S.slip, slippageBps:Math.round(S.slip*100), authCode:S.authCode};
  if(q.quoteId) args.quoteId=q.quoteId;
  if(q.raw) args.quote=q.raw;
  const tool = S.side==="buy"?"orbitx_app_buy":"orbitx_app_sell";
  try{
    const r = await Bridge.callTool(tool,args);
    const sig = extractSig(r);
    if(!sig) throw new Error("No transaction signature returned — treated as failed, nothing was verified on-chain.");
    S.execSig=sig; S.execStatus="confirming"; render();
    // verify: poll for confirmation; never trust "ok" alone
    await confirmOnChain(sig);
  }catch(e){
    S.error=mapErr(e); S.execStatus="failed"; render();
  }
}
function extractSig(r){
  if(!r) return "";
  if(typeof r==="string" && /^[1-9A-HJ-NP-Za-km-z]{80,90}$/.test(r)) return r;
  const cands=[r.signature,r.txSignature,r.tx,r.txid,r.txId,r.hash,
    r.result&&r.result.signature,r.data&&r.data.signature];
  for(const c of cands) if(typeof c==="string"&&c.length>60) return c;
  return "";
}
async function confirmOnChain(sig){
  // best-effort on-chain verification via a scan/status tool if available
  const t0=Date.now();
  while(Date.now()-t0<45000){
    try{
      const st=await Bridge.callTool("orbitx_crypto_scan",{tx:sig,signature:sig,authCode:S.authCode});
      const s=JSON.stringify(st).toLowerCase();
      if(s.includes("confirmed")||s.includes("finalized")||s.includes("success")){ S.execStatus="confirmed"; render(); return; }
    }catch(e){/* tool may not support tx lookup — fall through */}
    await new Promise(r=>setTimeout(r,3000));
  }
  // timed out waiting — signature exists on-chain; user can verify via Solscan
  S.execStatus="submitted"; render();
}
function scrExec(el){
  const sideT=S.side==="buy"?"Buy":"Sell";
  const body = S.execStatus==="failed"
    ? `<div class="xmark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ff5470" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
       <h2>Trade failed</h2><p class="sub">Nothing was executed.</p>
       <div class="err">${esc(S.error||"Unknown error")}</div>
       <div class="row"><button class="btn btn-ghost" onclick="S.screen='quote';render()">Back to quote</button>
       <button class="btn btn-neon" onclick="S.screen='confirm';S.error='';render()">Retry</button></div>`
    : `<div class="status-hero">
         ${S.execStatus==="pending"?'<div class="spinner"></div><h2>Signing…</h2><p class="sub">Approve in your wallet if prompted.</p>':""}
         ${S.execStatus==="confirming"?'<div class="spinner"></div><h2>Confirming on-chain…</h2><p class="sub">Waiting for Solana finality.</p>':""}
       </div>
       ${S.execSig?`<div class="tiny mut center">SIGNATURE</div><div class="sig">${esc(S.execSig)}</div>
       <a class="link" href="https://solscan.io/tx/${esc(S.execSig)}" target="_blank" rel="noopener">View on Solscan ↗</a>`:""}`;
  el.innerHTML=header(false)+`<div class="card neon center">${body}</div>`;
  if(S.execStatus==="confirmed"||S.execStatus==="submitted"){ S.screen="done"; setTimeout(render,400); }
}

/* ---- done ---- */
function scrDone(el){
  const sideT=S.side==="buy"?"Bought":"Sold";
  const ok=S.execStatus==="confirmed";
  el.innerHTML=header(false)+`
  <div class="card neon center">
    <div class="status-hero" style="padding-top:6px">
      ${ok?'<div class="checkmark"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#17ff4d" stroke-width="3"><path d="M4 12.5l5 5L20 6.5"/></svg></div>'
          :'<div class="checkmark" style="border-color:var(--amber);box-shadow:0 0 30px rgba(255,176,46,.4)"><span style="font-size:28px">⏳</span></div>'}
      <h2>${ok?sideT+" ✓":"Submitted"}</h2>
      <p class="sub">${ok?"Confirmed on-chain.":"Broadcast — confirmation pending. Verify below."}</p>
    </div>
    ${S.execSig?`<div class="tiny mut">TRANSACTION SIGNATURE</div><div class="sig">${esc(S.execSig)}</div>
    <a class="link" href="https://solscan.io/tx/${esc(S.execSig)}" target="_blank" rel="noopener">View on Solscan ↗</a>
    <div class="divider"></div>`:""}
    <div class="qrow"><span class="k">Side</span><span class="v">${S.side.toUpperCase()}</span></div>
    <div class="qrow"><span class="k">Amount</span><span class="v">${fmt(parseFloat(S.amount))} ${esc(S.currency)}</span></div>
    <div class="qrow"><span class="k">Token</span><span class="v">${esc(S.token?S.token.symbol:"")}</span></div>
    <div style="margin-top:14px" class="row">
      <button class="btn btn-ghost" onclick="resetAll()">New trade</button>
    </div>
  </div>`;
}
function resetAll(){ clearTimer(); S.token=null; S.amount=""; S.quote=null; S.execSig=""; S.error=""; S.screen="search"; render(); }

/* ---- error mapping ---- */
function mapErr(e){
  const m=String(e&&(e.message||e)).toLowerCase();
  if(m.includes("insufficient")||m.includes("balance")||m.includes("funds")) return "Insufficient funds — lower the amount or fund your wallet.";
  if(m.includes("auth")||m.includes("401")||m.includes("unauthorized")||m.includes("session")) return "Session expired — reconnect your OrbitX wallet to continue.";
  if(m.includes("slippage")||m.includes("price moved")) return "Price moved beyond slippage — refresh the quote and try again.";
  if(m.includes("invalid")||m.includes("unknown mint")||m.includes("not found")) return "Invalid token — the mint wasn't recognized. Check the address.";
  if(m.includes("expired")) return "Quote expired — get a fresh quote.";
  return "Error: "+String(e&&(e.message||e)).slice(0,220);
}

async function loadOrders(){
  if(!S.authCode){ render(); return; }
  S.d14.loading=true; S.dErr=""; render();
  try{
    const r=await Bridge.callTool("orbitx_app_orders",{authCode:S.authCode});
    const arr=r&&(r.orders||r.data)||[];
    S.d14.list=Array.isArray(arr)?arr:[];
  }catch(e){ dashAuthErr(e); }
  S.d14.loading=false; render();
}
function ordSizeTxt(o){
  const side=String(o.side||"sell").toLowerCase(); const sz=o.size||{};
  if(side==="sell"){
    if(sz.fraction!=null) return Math.round(Number(sz.fraction)*100)+"% of position";
    if(sz.amount) return fmt(sz.amount)+" tokens";
    return "100% of position";
  }
  if(sz.usd!=null) return "$"+fmt(sz.usd)+" buy";
  if(sz.amountSol!=null) return fmt(sz.amountSol)+" SOL buy";
  if(sz.amountUsdc!=null) return "$"+fmt(sz.amountUsdc)+" buy";
  return "buy";
}
function ordCard(o,i){
  const open=String(o.status||"").toLowerCase()==="open";
  const side=String(o.side||"sell").toLowerCase();
  const trig=o.triggerPct!=null?Number(o.triggerPct):null;
  const dirTxt=side==="sell"?"sell ↑ +":"buy ↓ −";
  const sideC=side==="sell"?"var(--neon)":"var(--amber)";
  return `<div class="ocard">
    <div class="top"><div class="ttl">${esc(o.symbol||"???")}</div>${stChip(o.status)}</div>
    <div class="qrow"><span class="k">Trigger</span><span class="v" style="color:${sideC}">${dirTxt}${trig!=null?trig+"%":"?"}</span></div>
    <div class="qrow"><span class="k">Entry → target</span><span class="v">${fmtUSD(o.entryUsd)} → ${fmtUSD(o.targetUsd)}</span></div>
    <div class="qrow"><span class="k">Size</span><span class="v">${esc(ordSizeTxt(o))}</span></div>
    <div class="qrow"><span class="k">Opened</span><span class="v">${ago(o.at)} · <span class="tiny mut">${shortMint(o.mint)}</span></span></div>
    ${open?(S.d14.cancelAsk===i
      ? `<div class="inline-confirm"><button class="btn btn-ghost" onclick="S.d14.cancelAsk=-1;render()">Keep</button>
         <button class="btn btn-danger" onclick="ordCancel(${i})">Confirm cancel</button></div>`
      : `<div style="margin-top:10px"><button class="btn btn-ghost" style="padding:10px;font-size:13px" onclick="S.d14.cancelAsk=${i};render()">Cancel order</button></div>`):""}
  </div>`;
}
async function ordCancel(i){
  const o=S.d14.list[i]; if(!o) return;
  S.d14.cancelAsk=-1; S.dErr=""; render();
  try{
    await Bridge.callTool("orbitx_app_cancel_order",{orderId:o.orderId,mint:o.mint,authCode:S.authCode});
    await loadOrders();
  }catch(e){ dashAuthErr(e); render(); }
}
async function ordLookup(){
  const m=S.d14.mint.trim(); if(!MINT_RE.test(m)){ S.dErr="Enter a valid Solana mint address."; render(); return; }
  S.d14.pxBusy=true; S.dErr=""; render();
  try{ S.d14.px=await lookupToken(m); if(!S.d14.px) S.dErr="Token not found — you can still arm the order; the backend resolves it."; }
  catch(e){ S.d14.px=null; S.dErr="Price lookup failed — you can still arm the order; the backend resolves it."; }
  S.d14.pxBusy=false; render();
}
function ordReview(){
  const m=S.d14.mint.trim();
  if(!MINT_RE.test(m)){ S.dErr="Enter a valid Solana mint address."; render(); return; }
  const p=parseFloat(S.d14.pct);
  if(!(p>0&&p<=100)){ S.dErr="Trigger must be between 1 and 100 (% price move)."; render(); return; }
  if(S.d14.otype==="tp"){
    const f=parseFloat(S.d14.sizePct);
    if(!(f>0&&f<=100)){ S.dErr="Sell size must be 1–100% of the position."; render(); return; }
  }else{
    const u=parseFloat(S.d14.usd);
    if(!(u>0)){ S.dErr="Buy size must be > $0."; render(); return; }
  }
  S.dErr=""; S.screen="ordPreview"; render();
}
function ordPreviewCalc(){
  const px=S.d14.px&&S.d14.px.price?Number(S.d14.px.price):null;
  const p=parseFloat(S.d14.pct); const sell=S.d14.otype==="tp";
  const target=px!=null?(sell?px*(1+p/100):px*(1-p/100)):null;
  return {px,target,sell,p};
}
async function ordArm(){
  const m=S.d14.mint.trim(); const c=ordPreviewCalc();
  const args={mint:m,side:c.sell?"sell":"buy",percent:c.p,slippageBps:200,authCode:S.authCode};
  if(c.sell) args.fraction=parseFloat(S.d14.sizePct)/100; else args.usd=parseFloat(S.d14.usd);
  S.d14.creating=true; S.dErr=""; render();
  try{
    const r=await Bridge.callTool("orbitx_app_limit",args);
    S.d14.armed=r; S.screen="ordDone"; S.d14.px=null;
  }catch(e){ dashAuthErr(e); S.screen="ordPreview"; }
  S.d14.creating=false; render();
}

/* ============================================================
   DCA — dollar-cost averaging, zero-SQL, widget-managed.
   Schedules live in localStorage (DCA_KEY). Auto-executes due
   buys via orbitx_app_buy while the widget is open.
   ============================================================ */
function dcaLoad(){ try{ const r=localStorage.getItem(DCA_KEY); return r?JSON.parse(r):[]; }catch(e){ return []; } }
function dcaSave(list){ try{ localStorage.setItem(DCA_KEY, JSON.stringify(list)); }catch(e){} }
function dcaNextRun(s){
  const freq=DCA_FREQ_MS[s.frequency]||86400e3;
  const last=s.lastRunAt?new Date(s.lastRunAt).getTime():new Date(s.createdAt).getTime();
  return last+freq;
}
function dcaImport(schedule){
  if(!schedule||!schedule.scheduleId) return false;
  const list=dcaLoad();
  if(list.some(s=>s.scheduleId===schedule.scheduleId)) return false;
  list.push(Object.assign({},schedule,{buysDone:schedule.buysDone||0,status:"active"}));
  dcaSave(list); return true;
}
async function loadDca(){
  const d=S.dca; d.loading=true; render();
  d.list=dcaLoad();
  d.loading=false; render();
  startDcaTimer();
}
function stopDcaTimer(){ if(S.dca.timer){ clearInterval(S.dca.timer); S.dca.timer=null; } }
function startDcaTimer(){
  stopDcaTimer();
  S.dca.timer=setInterval(dcaTick, 60000);
  dcaTick();
}
async function dcaTick(){
  const d=S.dca;
  if(!S.authCode||d.execBusy) return;
  const now=Date.now();
  const list=dcaLoad();
  let changed=false;
  for(const s of list){
    if(s.status!=="active") continue;
    if((s.buysDone||0)>=(s.totalBuys||0)){ s.status="done"; changed=true; continue; }
    if(dcaNextRun(s)<=now){
      d.execBusy=true;
      try{
        const r=await Bridge.callTool("orbitx_app_buy",{mint:s.mint,amountSol:s.amountSol});
        if(r&&(r.ok!==false)&&!r.error){
          s.buysDone=(s.buysDone||0)+1;
          s.lastRunAt=new Date().toISOString();
          s.lastTx=r.signature||r.tx||null;
          if(s.buysDone>=s.totalBuys) s.status="done";
        } else {
          s.lastError=String((r&&(r.error||r.message))||"buy failed");
        }
      }catch(e){ s.lastError=String(e.message||e); }
      d.execBusy=false;
      changed=true;
    }
  }
  if(changed){ dcaSave(list); d.list=list; render(); }
}
async function dcaCreate(){
  const d=S.dca;
  const mint=String(d.mint||"").trim();
  if(!MINT_RE.test(mint)){ S.dErr="Paste a valid token mint address."; render(); return; }
  const amountSol=Number(d.amountSol);
  if(!isFinite(amountSol)||amountSol<=0||amountSol>100){ S.dErr="Amount must be 0-100 SOL per buy."; render(); return; }
  d.creating=true; S.dErr=""; render();
  try{
    const r=await Bridge.callTool("orbitx_dca_create",{mint:mint,amountSol:amountSol,frequency:d.frequency,totalBuys:parseInt(d.totalBuys,10)||7});
    if(r&&r.ok&&r.schedule){
      dcaImport(r.schedule);
      d.mint=""; d.list=dcaLoad();
    } else {
      S.dErr=String((r&&(r.error||r.message))||"Could not create schedule.");
    }
  }catch(e){ S.dErr=String(e.message||e); }
  d.creating=false; render();
}
function dcaCancel(i){
  const list=dcaLoad();
  if(list[i]){ list[i].status="cancelled"; dcaSave(list); S.dca.list=list; S.dca.cancelAsk=-1; render(); }
}
function dcaCard(s,i){
  const freq=s.frequency||"daily";
  const done=s.buysDone||0, total=s.totalBuys||0;
  const pct=total?Math.round(done/total*100):0;
  const next=s.status==="active"?new Date(dcaNextRun(s)).toLocaleString():"-";
  const stColor=s.status==="active"?"var(--neon)":s.status==="done"?"var(--mut)":"var(--red)";
  return '<div class="card" style="margin-bottom:10px">'
    +'<div class="row" style="align-items:center;margin-bottom:8px">'
    +'<div style="flex:1"><b>'+esc(s.mint.slice(0,6))+"…"+esc(s.mint.slice(-4))+'</b>'
    +'<span class="pill" style="color:'+stColor+";border-color:"+stColor+';margin-left:8px">'+esc(s.status)+"</span></div></div>"
    +'<div class="qrow"><span class="k">Per buy</span><span class="v">'+esc(String(s.amountSol))+" SOL</span></div>"
    +'<div class="qrow"><span class="k">Frequency</span><span class="v">'+esc(freq)+"</span></div>"
    +'<div class="qrow"><span class="k">Progress</span><span class="v">'+done+"/"+total+" ("+pct+'%)</span></div>'
    +'<div style="height:6px;background:var(--line);border-radius:3px;margin:8px 0;overflow:hidden">'
    +'<div style="height:100%;width:'+pct+'%;background:var(--neon);border-radius:3px;transition:width .4s"></div></div>'
    +'<div class="qrow"><span class="k">Next run</span><span class="v">'+esc(next)+"</span></div>"
    +(s.lastTx?'<div class="qrow"><span class="k">Last tx</span><span class="v"><a href="https://solscan.io/tx/'+esc(s.lastTx)+'" target="_blank" rel="noopener" style="color:var(--neon)">'+esc(String(s.lastTx).slice(0,8))+"…</a></span></div>":"")
    +(s.lastError?'<p class="sub" style="color:var(--red)">Last error: '+esc(s.lastError)+"</p>":"")
    +(s.status==="active"?(S.dca.cancelAsk===i
      ? '<div class="inline-confirm"><button class="btn btn-ghost" onclick="S.dca.cancelAsk=-1;render()">Keep</button>'
        +'<button class="btn btn-red" onclick="dcaCancel('+i+')">Confirm cancel</button></div>'
      : '<div style="margin-top:8px"><button class="btn btn-ghost" style="padding:10px;font-size:13px" onclick="S.dca.cancelAsk='+i+';render()">Cancel schedule</button></div>'):"")
    +"</div>";
}

  +["hourly","daily","weekly"].map(f=>'<button class="'+(d.frequency===f?"on":"")+'" onclick="S.dca.frequency=\''+f+"';render()\">"+f[0].toUpperCase()+f.slice(1)+"</button>").join("")
  +'</div></div>'

/* ============================================================
   #15 COPY TRADING — orbitx_app_copy_follow / _unfollow / _list / _provision
   ============================================================ */
async function loadCopy(){
  if(!S.authCode){ render(); return; }
  S.d15.loading=true; S.dErr=""; render();
  try{
    const r=await Bridge.callTool("orbitx_app_copy_list",{authCode:S.authCode});
    const arr=r&&(r.follows||r.data)||[];
    S.d15.list=Array.isArray(arr)?arr:[];
  }catch(e){ dashAuthErr(e); }
  S.d15.loading=false; render();
  loadProv();
}
async function loadProv(){
  if(!S.authCode) return;
  S.d15.provBusy=true; render();
  try{ S.d15.prov=await Bridge.callTool("orbitx_app_copy_provision",{action:"status",authCode:S.authCode}); }
  catch(e){ S.d15.prov={ok:false,message:String(e&&(e.message||e))}; }
  S.d15.provBusy=false; render();
}
const trimNum=n=>{ const x=Number(n); if(!isFinite(x)) return "?";
  return String(Math.round(x*100)/100); };
const fmtSigned=n=>{ const x=Number(n); if(!isFinite(x)) return "—";
  const a=Math.abs(x), s=x<0?"−":"+";
  const v=a>=1000?(a/1000).toFixed(2)+"K":a>=1?a.toFixed(2):a.toFixed(4);
  return s+"$"+v; };
function cpyModeText(f){
  const m=String(f.mode||""); const s=trimNum(f.sizeValue);
  if(m==="fixed_usd") return "$"+s+" per mirrored buy";
  if(m==="percent_of_their_size") return s+"% of their size";
  if(m==="mirror_ratio") return s+"× their size";
  return m;
}
function cpyCard(f,i){
  return `<div class="ocard">
    <div class="top"><div class="ttl">${esc(f.label||"Untitled target")}</div><span class="chip">LIVE</span></div>
    <div class="tiny mut" style="margin-bottom:6px">${shortMint(f.wallet)}</div>
    <div class="qrow"><span class="k">Mirror</span><span class="v">${esc(cpyModeText(f))}</span></div>
    <div class="qrow"><span class="k">Max / trade</span><span class="v">$${fmt(f.maxPerTradeUsd)}</span></div>
    <div class="qrow"><span class="k">Their trades / mirrored</span><span class="v">${f.theirTrades??"—"} / ${f.fills??0}</span></div>
    <div class="qrow"><span class="k">Following since</span><span class="v">${ago(f.createdAt)}</span></div>
    ${S.d15.unfAsk===i
      ? `<div class="inline-confirm"><button class="btn btn-ghost" onclick="S.d15.unfAsk=-1;render()">Keep</button>
         <button class="btn btn-danger" onclick="cpyUnfollow(${i})">Confirm unfollow</button></div>`
      : `<div style="margin-top:10px"><button class="btn btn-ghost" style="padding:10px;font-size:13px" onclick="S.d15.unfAsk=${i};render()">Unfollow</button></div>`}
  </div>`;
}
async function cpyUnfollow(i){
  const f=S.d15.list[i]; if(!f) return;
  S.d15.unfAsk=-1; S.dErr=""; render();
  try{
    await Bridge.callTool("orbitx_app_copy_unfollow",{wallet:f.wallet,authCode:S.authCode});
    await loadCopy();
  }catch(e){ dashAuthErr(e); render(); }
}
function cpyReview(){
  const w=S.d15.wallet.trim();
  if(!MINT_RE.test(w)){ S.dErr="Enter a valid Solana wallet address."; render(); return; }
  const sz=parseFloat(S.d15.size);

/* ============================================================
   #23 PAPER TRADING — orbitx_agentplus_paper_buy/_sell/_portfolio
   Simulated. One persistent paper agent per user; reset = archive +
   spawn a fresh agent (fresh $10,000 paper USDC).
   ============================================================ */
function paperAgent(){
  if(S.d23.agent) return S.d23.agent;
  try{ S.d23.agent=localStorage.getItem("orbitx.paperAgent")||"paper-trader"; }catch(_){ S.d23.agent="paper-trader"; }
  return S.d23.agent;
}
function paperSaveAgent(n){ S.d23.agent=n; try{ localStorage.setItem("orbitx.paperAgent",n); }catch(_){} }
async function ensurePaperAgent(){
  const want=paperAgent().toLowerCase();
  let list=[];
  try{
    const r=await Bridge.callTool("orbitx_agentplus_list",{authCode:S.authCode});
    list=Array.isArray(r)?r:(r&&(r.agents||r.data)||[]);
  }catch(e){ /* fall through to spawn attempt */ }
  const found=list.find(a=>String(a.name||"").toLowerCase()===want&&String(a.status||"active")==="active");
  if(found){ paperSaveAgent(String(found.name).toLowerCase()); return found.name; }
  const sp=await Bridge.callTool("orbitx_agentplus_spawn",{name:want,role:"Paper trading agent",
    persona:"Simulated paper trading. No real money.",capabilities:["paper-trading"],authCode:S.authCode});
  if(sp&&(sp.ok===false||sp.error)) throw new Error(sp.message||sp.error||"Could not create paper agent.");
  const nm=(sp.agent&&sp.agent.name)||want; paperSaveAgent(nm); return nm;
}
async function loadPaper(){
  S.d23.loading=true; S.dErr=""; render();
  try{
    const name=await ensurePaperAgent();
    const r=await Bridge.callTool("orbitx_agentplus_paper_portfolio",{name,authCode:S.authCode});
    if(r&&(r.ok===false||r.error)) throw new Error(r.message||r.error);
    S.d23.pf=r;
  }catch(e){ dashAuthErr(e); }
  S.d23.loading=false; render();
}
async function pprLookup(){
  const m=S.d23.mint.trim(); if(!MINT_RE.test(m)){ S.dErr="Enter a valid Solana mint address."; render(); return; }
  S.d23.pxBusy=true; S.dErr=""; render();
  try{ S.d23.px=await lookupToken(m); if(!S.d23.px) S.dErr="Price lookup failed — you can still paper-trade; the backend prices it."; }
  catch(e){ S.d23.px=null; S.dErr="Price lookup failed — you can still paper-trade; the backend prices it."; }
  S.d23.pxBusy=false; render();
}
function pprReview(){
  const m=S.d23.mint.trim();
  if(!MINT_RE.test(m)){ S.dErr="Enter a valid Solana mint address."; render(); return; }
  const u=parseFloat(S.d23.usd);
  if(!(u>0)){ S.dErr="Amount must be > $0."; render(); return; }
  const cash=S.d23.pf?Number(S.d23.pf.cash_usdc):1e9;
  if(u>cash){ S.dErr=`Paper cash $${fmt(cash)} < $${fmt(u)} — lower the amount.`; render(); return; }
  S.dErr=""; S.screen="pprPreview"; render();
}
async function pprBuy(){
  S.d23.buying=true; S.dErr=""; render();
  try{
    const r=await Bridge.callTool("orbitx_agentplus_paper_buy",
      {name:paperAgent(),mint:S.d23.mint.trim(),usdc_amount:parseFloat(S.d23.usd),authCode:S.authCode});
    if(r&&(r.ok===false||r.error)) throw new Error(r.message||r.error);
    S.d23.mint=""; S.d23.px=null; S.screen="ppr"; await loadPaper();
  }catch(e){ dashAuthErr(e); S.screen="pprPreview"; }
  S.d23.buying=false; render();
}
async function pprSell(i){
  const pf=S.d23.pf; const pos=pf&&pf.positions&&pf.positions[i]; if(!pos) return;
  const pct=parseFloat(S.d23.sellPct);
  if(!(pct>0&&pct<=100)){ S.dErr="Sell percent must be 1–100."; render(); return; }
  S.d23.sellIdx=-1; S.dErr=""; render();
  try{
    const r=await Bridge.callTool("orbitx_agentplus_paper_sell",
      {name:paperAgent(),mint:pos.mint,percent:pct,authCode:S.authCode});
    if(r&&(r.ok===false||r.error)) throw new Error(r.message||r.error);
    await loadPaper();
  }catch(e){ dashAuthErr(e); render(); }
}
async function pprResetGo(){
  S.d23.resetBusy=true; S.dErr=""; render();
  try{
    const old=paperAgent();

/* ============================================================
   AGENT TABS — zero-SQL, widget-managed.
   S.asnipe / S.alpha state below; screens registered in
   DASH_SCREENS further down. Scan/feed timers stop on tab
   switch (see goTab → stopAsnipeTimer).

/* ============================================================
   🤖 SNIPER AGENT — orbitx_agent_snipe
   Scans fresh launches every 15s while running; PASS launches get
   a one-tap buy. Config + positions persist in localStorage.
   Honest: the scan loop runs only while this tab is open.
   ============================================================ */
S.asnipe={running:false,config:null,launches:[],positions:[],timer:null,lastScan:0,
  mb:"0.5",ml:"10000",md:"10",ms:"60",scanning:false,startBusy:false,buying:-1,pnlBusy:false,pendingStart:false};
const ASN_CFG_KEY="orbitx.agentSnipe.config";
const ASN_POS_KEY="orbitx.agentSnipe.positions";
const ASN_SCAN_MS=15000;
function asnipeLoadCfg(){ try{ const r=localStorage.getItem(ASN_CFG_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function asnipeSaveCfg(c){ try{ localStorage.setItem(ASN_CFG_KEY,JSON.stringify(c)); }catch(e){} }
function asnipeLoadPos(){ try{ const r=localStorage.getItem(ASN_POS_KEY); const l=r?JSON.parse(r):[]; return Array.isArray(l)?l:[]; }catch(e){ return []; } }
function asnipeSavePos(l){ try{ localStorage.setItem(ASN_POS_KEY,JSON.stringify(l)); }catch(e){} }
function asnipeArgs(){
  const n=(v,def)=>{ const x=Number(v); return isFinite(x)&&x>0?x:def; };
  return {maxBuySol:n(S.asnipe.mb,0.5),
    filters:{minLiquidityUsd:n(S.asnipe.ml,10000),maxDevPct:n(S.asnipe.md,10),minScore:n(S.asnipe.ms,60)}};
}
function asnipeApplyCfg(c){
  if(!c||typeof c!=="object") return;
  if(c.maxBuySol!=null&&isFinite(Number(c.maxBuySol))) S.asnipe.mb=String(c.maxBuySol);
  const f=c.filters||{};
  if(f.minLiquidityUsd!=null&&isFinite(Number(f.minLiquidityUsd))) S.asnipe.ml=String(f.minLiquidityUsd);
  if(f.maxDevPct!=null&&isFinite(Number(f.maxDevPct))) S.asnipe.md=String(f.maxDevPct);
  if(f.minScore!=null&&isFinite(Number(f.minScore))) S.asnipe.ms=String(f.minScore);
}
function stopAsnipeTimer(){ if(S.asnipe.timer){ clearInterval(S.asnipe.timer); S.asnipe.timer=null; } }
function startAsnipeTimer(){ stopAsnipeTimer(); S.asnipe.timer=setInterval(asnipeScan,ASN_SCAN_MS); asnipeScan(); }
async function loadAsnipe(){
  const a=S.asnipe;
  if(!S.authCode){ render(); return; }
  a.positions=asnipeLoadPos();
  asnipeApplyCfg(asnipeLoadCfg());
  S.dErr="";
  try{
    const r=await Bridge.callTool("orbitx_agent_snipe",{action:"status",authCode:S.authCode});
    if(r&&typeof r==="object"){
      if(r.config){ a.config=r.config; asnipeSaveCfg(r.config); asnipeApplyCfg(r.config); }
      if(r.running===true||String(r.status||"").toLowerCase()==="running") a.running=true;
    }
  }catch(e){ /* status is best-effort; local state stands */ }
  if(a.pendingStart){ a.pendingStart=false; await asnipeStart(); return; }
  render();
  if(a.running) startAsnipeTimer();
}
async function asnipeStart(){
  const a=S.asnipe;
  if(a.startBusy||a.running) return;
  a.startBusy=true; S.dErr=""; render();
  try{
    const args=Object.assign({action:"start"},asnipeArgs(),{authCode:S.authCode});
    const r=await Bridge.callTool("orbitx_agent_snipe",args);
    if(r&&(r.ok===false||r.error)) throw new Error(r.error||r.message||"Sniper start failed.");
    a.config=(r&&r.config)||args; asnipeSaveCfg(a.config); asnipeApplyCfg(a.config);
    a.running=true;
    startAsnipeTimer();
  }catch(e){ if(!dashAuthErr(e)) S.dErr=mapErr(e); }
  a.startBusy=false; render();
}
async function asnipeStop(){
  const a=S.asnipe;
  stopAsnipeTimer(); a.running=false;
  try{ await Bridge.callTool("orbitx_agent_snipe",{action:"stop",authCode:S.authCode}); }catch(e){}
  render();
}
async function asnipeScan(){
  const a=S.asnipe;
  if(!a.running||a.scanning||!S.authCode) return;
  a.scanning=true;
  try{
    const args=Object.assign({action:"scan"},asnipeArgs(),{authCode:S.authCode});
    const r=await Bridge.callTool("orbitx_agent_snipe",args);
    if(r&&(r.ok===false||r.error)) throw new Error(r.error||r.message||"Scan failed.");
    const L=(r&&(r.launches||r.data))||[];
    a.launches=Array.isArray(L)?L:[];
    a.lastScan=Date.now(); S.dErr="";
  }catch(e){
    if(dashAuthErr(e)){ a.running=false; stopAsnipeTimer(); }
    else S.dErr=mapErr(e);
  }
  a.scanning=false; render();
}
/* one-shot preview scan without starting the loop */
async function asnipeScanOnce(){
  const a=S.asnipe;
  if(a.running){ asnipeScan(); return; }
  if(a.scanning) return;
  const was=false; a.running=true;
  try{ await asnipeScan(); }finally{ if(!was){ a.running=false; stopAsnipeTimer(); } }
}
async function asnipeBuy(i){
  const a=S.asnipe; const L=a.launches[i]; if(!L) return;
  const mint=String(L.mint||"").trim();
  if(!MINT_RE.test(mint)){ S.dErr="Bad mint on this launch — skipped."; render(); return; }
  a.buying=i; S.dErr=""; render();
  try{
    const amt=Number(L.maxBuySol)||Number(a.mb)||0.5;
    const r=await Bridge.callTool("orbitx_app_buy",{mint:mint,amountSol:amt,authCode:S.authCode});
    if(r&&(r.ok===false||r.error)) throw new Error(r.error||r.message||"Buy failed.");
    const sig=r.signature||r.tx||"";
    const pos={mint:mint,symbol:L.symbol||"",amountSol:amt,time:new Date().toISOString(),
      txUrl:sig?("https://solscan.io/tx/"+sig):(r.txUrl||""),
      priceUsd:L.priceUsd!=null?Number(L.priceUsd):null};
    const list=asnipeLoadPos(); list.unshift(pos); asnipeSavePos(list); a.positions=list;
  }catch(e){ if(!dashAuthErr(e)) S.dErr=mapErr(e); }
  a.buying=-1; render();
}
async function asnipeRefreshPnl(){
  const a=S.asnipe; if(a.pnlBusy) return; a.pnlBusy=true; render();
  for(const p of a.positions){
    if(!p||!p.mint||p.priceUsd==null) continue;
    try{ const t=await lookupToken(p.mint); if(t&&t.price!=null) p.curUsd=Number(t.price); }catch(e){}
  }
  asnipeSavePos(a.positions);
  a.pnlBusy=false; render();
}

  +'<div class="card"><div class="row" style="align-items:center;margin-bottom:10px">'
  +'<div style="flex:1"><h2 style="margin:0">Positions</h2>'
  +'<p class="sub" style="margin:2px 0 0">'+a.positions.length+" snipe buys · saved on this device</p></div>"
  +'<button class="btn btn-ghost" style="width:auto;padding:10px 14px;font-size:13px" '+(a.pnlBusy?"disabled":"")+' onclick="asnipeRefreshPnl()">'+(a.pnlBusy?"…":"↻ PnL")+"</button></div>"
  +(a.positions.length?a.positions.map(asnipePosCard).join("")
    :'<div class="empty"><div class="empty-ico">💼</div><p class="sub">No snipe buys yet — PASS launches get a one-tap buy button.</p></div>')
  +"</div>";
  goBack=function(){S.screen="search";render();};
}

/* ============================================================
   ⚡ ALPHA FINDER — orbitx_agent_alpha
   Ranks smart-money wallets by hot streak; one-tap copy-follow
   via orbitx_app_copy_follow (defaults match the Copy tab).
   ============================================================ */
S.alpha={wallets:[],loading:false,minTrades:"5",timeframe:"7d",followBusy:-1,followed:{},scanCount:0};
function hotFlames(hs){
  const h=Number(hs)||0;
  if(h>=80) return "🔥🔥🔥";
  if(h>=50) return "🔥🔥";
  if(h>=25) return "🔥";
  return "—";
}
async function loadAlpha(){
  if(!S.authCode){ render(); return; }
  render();
}
async function alphaScan(){
  const a=S.alpha;
  a.loading=true; S.dErr=""; render();
  try{
    const mt=parseInt(a.minTrades,10);
    const r=await Bridge.callTool("orbitx_agent_alpha",{action:"scan",
      minTrades:(isFinite(mt)&&mt>0)?mt:5,timeframe:a.timeframe,authCode:S.authCode});
    if(r&&(r.ok===false||r.error)) throw new Error(r.error||r.message||"Alpha scan failed.");
    const W=(r&&(r.wallets||r.data))||[];
    a.wallets=Array.isArray(W)?W:[];
    a.scanCount++;
  }catch(e){ dashAuthErr(e); }
  a.loading=false; render();
}
async function alphaFollow(i){
  const a=S.alpha; const w=a.wallets[i]; if(!w||!w.wallet) return;
  const addr=String(w.wallet).trim();
  if(!MINT_RE.test(addr)){ S.dErr="Bad wallet address on this card."; render(); return; }
  a.followBusy=i; S.dErr=""; render();
  try{
    await Bridge.callTool("orbitx_app_copy_follow",{wallet:addr,mode:"fixed_usd",size:1,
      maxPerTradeUsd:25,label:"alpha",authCode:S.authCode});
    a.followed[addr]=true;
  }catch(e){ if(!dashAuthErr(e)) S.dErr=mapErr(e); }
  a.followBusy=-1; render();
}
function alphaCard(w,i){
  const hs=Number(w.hotScore); const hsc=isFinite(hs)?Math.max(0,Math.min(100,hs)):0;
  const hscColor=hsc>=80?"var(--neon)":hsc>=50?"var(--amber)":"var(--mut)";
  const addr=String(w.wallet||"");
  const followed=!!S.alpha.followed[addr];
  const toks=Array.isArray(w.tokens)?w.tokens:[];
  return '<div class="card" style="margin-bottom:10px">'
    +'<div class="row" style="align-items:center;margin-bottom:8px">'
    +'<div style="flex:1"><span class="tiny mut" style="margin-right:8px">#'+(i+1)+'</span>'
    +'<b>'+esc(shortMint(addr))+'</b>'
    +'<span style="margin-left:8px">'+hotFlames(hs)+"</span></div>"
    +'<a href="'+esc(w.url||("https://solscan.io/account/"+encodeURIComponent(addr)))+'" target="_blank" rel="noopener" class="tiny" style="color:var(--neon)">solscan ↗</a></div>'
    +'<div class="qrow"><span class="k">Hot score</span><span class="v" style="color:'+hscColor+'">'+(isFinite(hs)?esc(String(hs)):"—")+"</span></div>"
    +'<div style="height:6px;background:var(--line);border-radius:3px;margin:8px 0;overflow:hidden">'
    +'<div style="height:100%;width:'+hsc+'%;background:'+hscColor+';border-radius:3px"></div></div>'
    +'<div class="qrow"><span class="k">Buys</span><span class="v">'+esc(String(w.buys!=null?w.buys:"—"))+"</span></div>"
    +'<div class="qrow"><span class="k">Volume</span><span class="v">'+fmtUSD(w.volumeUsd)+"</span></div>"
    +'<div class="qrow"><span class="k">Tokens traded</span><span class="v">'+(toks.length?toks.length:"—")+"</span></div>"
    +(toks.length?'<p class="tiny mut" style="margin:6px 0 0">'+toks.slice(0,6).map(esc).join(" · ")+(toks.length>6?" …":"")+"</p>":"")
    +'<div style="margin-top:10px">'
    +(followed
      ?'<span class="chip2" style="color:var(--neon);border-color:var(--neon)">✓ following</span>'
      :'<button class="btn btn-ghost" style="padding:10px;font-size:13px" '+(S.alpha.followBusy===i?"disabled":"")+' onclick="alphaFollow('+i+')">'
        +(S.alpha.followBusy===i?"Following…":"🪞 Follow wallet")+"</button>")
    +"</div></div>";
}
function scrAlpha(el){
  if(!S.authCode){ scrAuthGate(el,"alpha",loadAlpha); return; }
  const a=S.alpha;
  el.innerHTML=header(false)+tabBar("alpha")
  +'<div class="card neon"><div class="row" style="align-items:center;margin-bottom:10px">'
  +'<div style="flex:1"><h2 style="margin:0">⚡ Alpha Finder</h2>'
  +'<p class="sub" style="margin:2px 0 0">Smart-money wallets ranked by hot streak · one-tap copy-follow</p></div></div>'
  +'<div class="field"><span class="flabel">MIN TRADES</span>'
  +'<input type="number" inputmode="numeric" min="1" max="500" value="'+esc(a.minTrades)+'" oninput="S.alpha.minTrades=this.value"></div>'
  +'<div class="field"><span class="flabel">TIMEFRAME</span><div class="seg">'
  +["24h","7d","30d"].map(f=>'<button class="'+(a.timeframe===f?"on":"")+'" onclick="S.alpha.timeframe=\''+f+'\';render()">'+f+"</button>").join("")
  +'</div></div>'
  +'<button class="btn btn-neon" '+(a.loading?"disabled":"")+' onclick="alphaScan()">'+(a.loading?"Scanning…":"⚡ Scan for alpha")+"</button>"
  +dErrHtml()+"</div>"
  +'<div class="card"><div class="row" style="align-items:center;margin-bottom:10px">'
  +'<div style="flex:1"><h2 style="margin:0">Ranked wallets</h2>'
  +'<p class="sub" style="margin:2px 0 0">'+(a.scanCount?a.wallets.length+" wallets · latest scan":"No scan yet")+"</p></div>"
  +(a.loading?"":'<button class="btn btn-ghost" style="width:auto;padding:10px 14px;font-size:13px" onclick="alphaScan()">↻</button>')+"</div>"
  +(a.loading?skelList(3)
    :(a.wallets.length?a.wallets.map(alphaCard).join("")
      :'<div class="empty"><div class="empty-ico">⚡</div><p><b>No wallets yet</b></p>'
      +'<p class="sub">Run a scan to find wallets on a hot streak right now.</p></div>'))
  +"</div>";
  goBack=function(){S.screen="search";render();};
}

/* ---- dashboard screen registry (merged into render()) ---- */
const DASH_SCREENS={ord:scrOrd,ordPreview:scrOrdPreview,ordDone:scrOrdDone,
  dca:scrDca,
  cpy:scrCpy,cpyPreview:scrCpyPreview,
  snp:scrSnp,snpCfg:scrSnpCfg,snpPreview:scrSnpPreview,snpKill:scrSnpKill,
  ppr:scrPpr,pprPreview:scrPprPreview,pprReset:scrPprReset,
  asnipe:scrAsnipe,alpha:scrAlpha};
</script>

<script>
"use strict";
/* ================= boot ================= */
render();
</script>
