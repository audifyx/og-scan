<title>OrbitX Wallet Analytics</title>
<!--
  OrbitX ChatGPT Mini App — Wallet Portfolio + Real PnL
  resourceUri: ui://widget/orbitx-wallet.html
  Bridge: window.OrbitX.callTool(name, args) when hosted in the OrbitX bridge,
          else standalone fallback POSTs to https://www.orbitx.world/api/mcp
  Tools (verified live): orbitx_get_wallet, orbitx_app_pnl, orbitx_get_swaps
  PnL chart: derived client-side from swap history; honest "insufficient history"
  state when the data can't support it. Addresses only — never keys/secrets.
-->
<style>

<body>
<div id="bgfx"></div>
<div id="app"></div>
<script>
"use strict";
/* ================= Bridge (CONTRACT.md v1) ================= */
const MCP_URL = "https://www.orbitx.world/api/mcp";
const Bridge = {
  async callTool(name, args){
    if (window.openai && typeof window.openai.callTool === "function"){
      return await window.openai.callTool(name, args);
    }
    if (window.OrbitX && typeof window.OrbitX.callTool === "function"){
      return await window.OrbitX.callTool(name, args);
    }
    // standalone fallback: POST MCP JSON-RPC directly (no bridge).
    // Sends Accept for both plain JSON and SSE; parses either.
    const res = await fetch(MCP_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json, text/event-stream"},
      body: JSON.stringify({jsonrpc:"2.0", id:"w"+Date.now()+Math.floor(Math.random()*999), method:"tools/call",
        params:{name, arguments:args||{}}})
    });
    if(!res.ok) throw new Error("MCP HTTP "+res.status);
    const raw = await res.text();
    let j;
    try{
      const lines = raw.split(/\r?\n/).filter(l=>l.indexOf("data:")===0);
      j = JSON.parse((lines.length?lines[lines.length-1].slice(5):raw).trim());
    }catch(e){ throw new Error("bad MCP response"); }
    if(j.error) throw new Error(j.error.message||"tool error");
    const r = j.result||{};
    if(r.structuredContent) return r.structuredContent;
    const content = r.content;
    if(Array.isArray(content)){
      const t = content.find(c=>c.type==="text");
      if(t){ try{ return JSON.parse(t.text); }catch(e){ return t.text; } }
      return content;
    }
    return r;
  }
};
/* Auth: contract key `orbitx.authCode` (legacy `orbitx_auth_code` still read) */
const AUTH_KEYS = ["orbitx.authCode","orbitx_auth_code"];
const getAuth = ()=>{ try{ for(const k of AUTH_KEYS){ const v=localStorage.getItem(k); if(v) return v; } }catch(e){} return ""; };
const AUTH_ERR_RE=/auth|unauthor|expir|invalid code|session|forbidden|not (linked|connected|signed)|sign.?in|token|credential/i;
function authFail(e){ const m=String((e&&e.message)||e||"");
  if(AUTH_ERR_RE.test(m)){ try{ window.dispatchEvent(new CustomEvent("orbitx-auth-error",{detail:{message:m}})); }catch(x){} return true; }
  return false; }
function setErr(e){ if(authFail(e)) S.error="Session expired — reconnect via the OrbitX auth widget, then retry.";
  else S.error=String(e.message||e); }
function openUrl(href){ if(!href) return;
  try{
    if(window.openai&&typeof window.openai.openExternal==="function"){ window.openai.openExternal({href}); return; }
    if(window.OrbitX&&typeof window.OrbitX.openUrl==="function"){ window.OrbitX.openUrl(href); return; }
  }catch(e){}
  window.open(href,"_blank","noopener"); }
function standaloneNote(){ const hosted=(window.openai&&window.openai.callTool)||(window.OrbitX&&window.OrbitX.callTool);
  return hosted?"":`<div class="mut" style="text-align:center;font-size:11px;margin-bottom:10px;opacity:.8">⚙ standalone mode — reads live · paste your authCode from the Auth widget to enable writes</div>`; }
document.addEventListener("click",e=>{
  const a=e.target&&e.target.closest?e.target.closest("a[target='_blank']"):null;
  if(a&&a.href){ e.preventDefault(); openUrl(a.href); } });
window.addEventListener("orbitx-auth-changed",()=>{ if(typeof render==="function") render(); });

/* ================= State ================= */
const S = { addr:"", valid:null, wallet:null, pnlAgg:null, swaps:[],
  chartPts:[], fetchedAt:0, error:"", loading:false, addrErr:"",
  tab:"wallet",
  shop:{loaded:false,loading:false,error:"",catalog:null,status:null,tiers:null,boosts:null,
    credits:null,usage:null,confirmId:null,confirmBoost:null,boostMint:"",boostSymbol:"",
    creditsSol:"0.1",buying:false,result:null} };

/* ================= Helpers ================= */
const app = document.getElementById("app");
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n,d)=>{ if(n==null||n===""||isNaN(Number(n))) return "—";
  const x=Number(n), neg=x<0?"-":"", a=Math.abs(x);
  const s=a>=1e9?(a/1e9).toFixed(2)+"B":a>=1e6?(a/1e6).toFixed(2)+"M":a>=1e3?(a/1e3).toFixed(2)+"K":a.toFixed(d!=null?d:(a<1?4:2));
  return neg+s; };
const fmtUSD = n=>{ if(n==null||isNaN(Number(n))) return "—"; const x=Number(n);
  const s=Math.abs(x)<0.01&&x!==0?"$"+Math.abs(x).toExponential(2):"$"+fmt(Math.abs(x));
  return (x<0?"-":"")+s; };
const fmtSigned = n=>{ if(n==null||isNaN(Number(n))) return "—";
  return (Number(n)>=0?"+":"−")+fmtUSD(Math.abs(Number(n))).slice(1).replace("$","$"); };
const signedUSD = n=>{ if(n==null||isNaN(Number(n))) return "—";
  const x=Number(n); return (x<0?"−$":"+$")+fmt(Math.abs(x)); };
const pctCls = n=>Number(n)>=0?"up":"down";
const shortA = a=>a&&a.length>10?a.slice(0,4)+"…"+a.slice(-4):esc(a||"");
const isAddr = a=>/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test((a||"").trim());
const timeAgo = ts=>{ if(!ts) return "—"; const s=Math.floor((Date.now()-new Date(ts).getTime())/1000);
  if(s<0) return "just now"; if(s<60) return s+"s ago"; if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; };
const timeHM = ts=>ts?new Date(ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}):"—";
function staleBar(){ return S.fetchedAt?
  `<div class="stale"><span>🕐 Updated ${esc(timeHM(S.fetchedAt))} (${esc(timeAgo(S.fetchedAt))})</span>
   <button onclick="loadAll()">↻ Refresh</button></div>`:""; }
function toast(msg){ const t=document.createElement("div");
  t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0d151c;border:1px solid #17ff4d;color:#17ff4d;padding:10px 18px;border-radius:12px;font-size:13px;z-index:99";
  t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
</script>

<script>
"use strict";
/* ================= Load ================= */
function onAddrInput(){
  const v=(document.getElementById("addr")||{}).value||"";
  S.addr=v.trim();
  const el=document.getElementById("addr");
  if(!S.addr){ S.valid=null; S.addrErr=""; el.classList.remove("invalid"); renderAddrMsg(); return; }
  if(isAddr(S.addr)){ S.valid=true; S.addrErr=""; el.classList.remove("invalid"); }
  else { S.valid=false; S.addrErr="That doesn't look like a Solana address (base58, 32–44 chars)."; el.classList.add("invalid"); }
  renderAddrMsg();
}
function renderAddrMsg(){
  const m=document.getElementById("addrmsg"); if(!m) return;
  m.innerHTML = S.addrErr?`<div style="color:var(--red);font-size:12px;margin-top:6px">⚠️ ${esc(S.addrErr)}</div>`
    : S.valid?`<div style="color:var(--neon);font-size:12px;margin-top:6px">✓ Valid Solana address</div>`:"";
}
async function loadConnected(){
  document.getElementById("addr").value=""; S.addr=""; S.valid=null;
  await loadAll(true);
}
async function loadAll(connected){
  if(!connected){
    const v=(document.getElementById("addr")||{}).value||"";
    S.addr=v.trim();
    if(!S.addr){ S.addrErr="Paste a wallet address, or use your connected wallet."; renderAddrMsg(); return; }
    if(!isAddr(S.addr)){ S.addrErr="That doesn't look like a Solana address (base58, 32–44 chars)."; renderAddrMsg(); return; }
  }
  S.error=""; S.loading=true; S.wallet=null; S.swaps=[]; S.chartPts=[]; S.pnlAgg=null; render();
  const args={authCode:getAuth()}; if(!connected) args.address=S.addr;
  try{
    const [w,s,p]=await Promise.all([
      Bridge.callTool("orbitx_get_wallet",args).catch(e=>({ok:false,error:String(e.message||e)})),
      Bridge.callTool("orbitx_get_swaps",{...args,limit:50}).catch(e=>({ok:false,error:String(e.message||e)})),
      Bridge.callTool("orbitx_app_pnl",{authCode:getAuth()}).catch(()=>null)
    ]);
    if(w.ok===false) throw new Error(w.error||"wallet fetch failed");
    S.wallet=w; S.fetchedAt=Date.now();
    if(s&&s.ok!==false){ S.swaps=(s.trades||s.swaps||s.data||[]).slice(0,50); }
    if(p&&p.ok!==false) S.pnlAgg=p;
    S.chartPts=derivePnLCurve(S.swaps);
  }catch(e){ setErr(e); }
  S.loading=false; render();
}

/* PnL curve: cumulative per-trade PnL from swap history — real points only.
   Trade needs a numeric pnl-ish field AND a timestamp; otherwise we say so. */
function derivePnLCurve(swaps){
  const pts=[];
  for(const t of (swaps||[])){
    const ts=t.timestamp||t.time||t.blockTime||t.createdAt;
    const pnl=t.pnlUsd??t.pnl??t.profitUsd??t.realizedPnlUsd??t.pnl_usd;
    if(ts==null||pnl==null||isNaN(Number(pnl))) continue;
    pts.push({t:new Date(ts).getTime(), v:Number(pnl)});
  }
  pts.sort((a,b)=>a.t-b.t);
  let cum=0; return pts.map(p=>{ cum+=p.v; return {t:p.t, v:cum}; });
}
</script>

<script>
"use strict";
/* ================= Render ================= */
function render(){
  const w=S.wallet;

function bodySkel(){
  return `<div class="card glow"><div class="skel" style="height:110px"></div></div>
  <div class="card"><div class="skel" style="height:220px"></div></div>
  <div class="card"><div class="skel" style="height:180px"></div></div>`;
}
function bodyHTML(){
  if(S.tab==="shop") return shopTabHTML();
  if(S.tab==="send") return sendTabHTML();
  const w=S.wallet;
  if(!w) return `<div class="empty"><div class="big">👛</div>
    Paste any Solana wallet address and hit <b>Track</b> —<br>
    portfolio value, per-token PnL, trade history & win-rate,<br>all live from OrbitX.</div>`;
  if(S.tab==="pnl") return pnlHTML(w);
  return walletHTML(w);
}
function walletData(w){
  const pnl=w.pnl||{};
  const holdings=(w.holdings||[]).filter(h=>(h.usd??h.valueUsd??0)>0.5);
  const perToken=pnl.perToken||pnl.positions||[];
  const emptyWallet=(w.totalUsd||0)<0.5&&!holdings.length&&!perToken.length&&!S.swaps.length;
  return {pnl,holdings,perToken,emptyWallet};
}
function walletHTML(w){
  const {pnl,holdings,emptyWallet}=walletData(w);
  if(emptyWallet) return emptyWalletHTML(w);
  return `
  <div class="card glow">
    <div class="hero">
      <div class="mut">TOTAL PORTFOLIO VALUE</div>
      <div class="total">${fmtUSD(w.totalUsd)}</div>
      <div class="sub">◎ ${fmt(w.sol,4)} SOL · <span class="mono">${shortA(w.address)}</span></div>
      <div class="sub" style="margin-top:4px">SOL ≈ ${fmtUSD(w.solPrice)} · ${w.tokenCount??holdings.length} tokens</div>
    </div>

function drawPnLChart(){
  const svg=document.getElementById("pnlChart"); if(!svg||!S.chartPts.length) return;
  const W=560,H=220,P=14, pts=S.chartPts;
  const vs=pts.map(p=>p.v), mx=Math.max(...vs,0), mn=Math.min(...vs,0), rg=(mx-mn)||1;
  const X=i=>P+(W-2*P)*i/(pts.length-1||1), Y=v=>P+(H-2*P)*(1-(v-mn)/rg);
  const line=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ");
  const area=line+` L${X(pts.length-1).toFixed(1)},${Y(0).toFixed(1)} L${X(0).toFixed(1)},${Y(0).toFixed(1)} Z`;
  const last=pts[pts.length-1].v, col=last>=0?"#17ff4d":"#ff4d5e";
  svg.innerHTML=`
    <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${P}" y1="${Y(0)}" x2="${W-P}" y2="${Y(0)}" stroke="#2a3a48" stroke-dasharray="4 4"/>
    <path d="${area}" fill="url(#pg)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(pts.length-1)}" cy="${Y(last)}" r="4.5" fill="${col}"/>
    <text x="${W-P-4}" y="${P+12}" fill="${col}" font-size="13" font-weight="800" text-anchor="end">${esc(signedUSD(last))}</text>`;
  const el=document.getElementById("pnlLast");
  if(el) el.innerHTML=`Cumulative: <b class="${pctCls(last)}">${esc(signedUSD(last))}</b> across ${pts.length} trades`;
}

async function loadShop(){
  if(S.shop.loading||S.shop.loaded) return;
  S.shop.loading=true; S.shop.error=""; render();
  const a={}; const ac=getAuth(); if(ac) a.authCode=ac;
  try{
    const [cat,st,tiers,boosts]=await Promise.all([
      Bridge.callTool("orbitx_shop",{}).catch(e=>({ok:false,error:String(e.message||e)})),
      Bridge.callTool("orbitx_mcp_access_status",a).catch(e=>({ok:false,error:String(e.message||e)})),
      Bridge.callTool("orbitx_boost_tiers",a).catch(e=>({ok:false,error:String(e.message||e)})),
      Bridge.callTool("orbitx_boosts",a).catch(e=>({ok:false,error:String(e.message||e)}))
    ]);
    if(cat&&cat.ok!==false) S.shop.catalog=cat;
    if(st&&st.ok!==false) S.shop.status=st;
    if(tiers&&tiers.tiers) S.shop.tiers=tiers;
    if(boosts&&boosts.ok!==false) S.shop.boosts=boosts;
    if(ac){
      const c=await Bridge.callTool("orbitx_credits_balance",{authCode:ac}).catch(()=>null);
      if(c&&c.ok!==false&&!c.error) S.shop.credits=c;
      const u=await Bridge.callTool("orbitx_credits_usage",{authCode:ac,period:"all",limit:20}).catch(()=>null);
      if(u&&u.ok!==false&&!u.error) S.shop.usage=u;
    }
    S.shop.loaded=true;
  }catch(e){
    if(authFail(e)) S.shop.error="Session expired — reconnect via the OrbitX auth widget, then retry.";
    else S.shop.error=String(e.message||e);
  }
  S.shop.loading=false; render();
}
function shopPackages(){

      tokens:sp.tokens,duration:sp.durationLabel||"",

    return;
  }
  const sig=r.signature||r.txSignature||r.tx||r.txHash||null;
  const url=r.openUrl||r.signUrl||r.jupUrl||r.jupiterUrl||null;
  if(sig){
    pushShopHist({ts:Date.now(),kind:meta.kind,label:meta.label,costStr:meta.costStr,sig});
    S.shop.result={ok:true,msg:"Purchase confirmed on-chain.",sig,meta};
    refreshShopStatus();
    return;
  }
  if(r.action==="ask_amount"||r.payTo){
    const perSol=r.creditsPerSol||10000;
    S.shop.result={ok:false,pending:true,creditsPay:true,
      msg:String(r.message||"Send SOL to the desk wallet, then paste the tx signature."),
      payTo:r.payTo,sol:meta.cost,costStr:meta.costStr,
      credits:Math.round((Number(meta.cost)||0)*perSol),meta};
    return;
  }
  if(url){
    S.shop.result={ok:false,pending:true,msg:String(r.message||"Signature required — complete the burn in Phantom."),url,meta};
    return;
  }
  S.shop.result={ok:false,msg:String(r.message||"Unexpected response from orbitx_shop."),meta};
}
function refreshShopStatus(){
  const a={}; const ac=getAuth(); if(ac) a.authCode=ac;
  Bridge.callTool("orbitx_mcp_access_status",a).then(r=>{ if(r&&r.ok!==false){ S.shop.status=r; if(S.tab==="shop") render(); } }).catch(()=>{});
}

/* ---------- result card ---------- */
function shopResultHTML(){
  const r=S.shop.result;
  if(r.ok){
    return `<div class="resultcard ok"><div class="badge">✓ DONE</div>
      <div style="margin-top:8px;font-size:14px">${esc(r.msg)}</div>
      ${r.meta&&r.meta.label?`<div class="mut" style="margin-top:4px">${esc(r.meta.label)}</div>`:""}
      ${r.sig?`<div style="margin-top:6px"><a class="tx" target="_blank" href="https://solscan.io/tx/${esc(r.sig)}">View on Solscan ↗</a></div>`:""}
      <div style="margin-top:10px"><button class="btn sm" onclick="S.shop.result=null;render()">Done</button></div></div>`;
  }
  if(r.pending&&r.creditsPay){
    const sigId="creditsSig";
    return `<div class="resultcard"><div class="badge warn">⏳ PAYMENT NEEDED</div>
      <div style="margin-top:8px;font-size:14px">${esc(r.msg)}</div>
      <div class="balrow"><span class="k">Send</span><span class="v" style="color:var(--amber)">${esc(String(r.sol))} SOL</span></div>
      <div class="balrow"><span class="k">To desk wallet</span><span class="v mono" style="font-size:11px">${esc(r.payTo)}<button class="copybtn" onclick="copyTxt('${esc(r.payTo)}')">copy</button></span></div>
      <div class="balrow"><span class="k">You get</span><span class="v up">≈ ${intStr(r.credits)} credits</span></div>
      <div class="mut" style="margin:8px 0">After sending, paste the Solana transaction signature to credit your balance:</div>
      <input class="field mono" id="${sigId}" placeholder="Solana tx signature…" autocapitalize="off" spellcheck="false">
      <div class="row" style="gap:8px;margin-top:8px">
        <button class="btn ghost sm" style="flex:1" onclick="S.shop.result=null;render()">Cancel</button>
        <button class="btn sm" style="flex:2" onclick="verifyCredits('${sigId}')">Verify payment</button>
      </div></div>`;
  }
  if(r.pending){
    const sigId="shopSig";
    return `<div class="resultcard"><div class="badge warn">⏳ SIGNATURE NEEDED</div>
      <div style="margin-top:8px;font-size:14px">${esc(r.msg)}</div>
      ${r.url?`<div style="margin:10px 0"><button class="btn" onclick="openUrl('${esc(r.url)}')">Sign in Phantom →</button></div>`:""}
      <div class="mut" style="margin:6px 0">After signing, paste the transaction signature to confirm the burn:</div>
      <input class="field mono" id="${sigId}" placeholder="Solana tx signature…" autocapitalize="off" spellcheck="false">
      <div class="row" style="gap:8px;margin-top:8px">
        <button class="btn ghost sm" style="flex:1" onclick="S.shop.result=null;render()">Cancel</button>
        <button class="btn sm" style="flex:2" onclick="verifyMcpBurn('${sigId}','${esc(r.meta.id)}')">Verify burn</button>
      </div></div>`;
  }
  return `<div class="resultcard bad"><div class="badge exp">✕ FAILED</div>
    <div style="margin-top:8px;font-size:14px">${esc(r.msg)}</div>
    ${r.fixUrl?`<div style="margin:10px 0"><button class="btn ghost" onclick="openUrl('${esc(r.fixUrl)}')">Open shop page →</button></div>`:""}
    <div class="mut">No $ORBITX was moved.</div>
    <div style="margin-top:10px"><button class="btn sm ghost" onclick="S.shop.result=null;render()">Dismiss</button></div></div>`;
}
async function verifyMcpBurn(inputId,pkgId){
  const sig=((document.getElementById(inputId)||{}).value||"").trim();
  if(!sig){ toast("Paste the tx signature first"); return; }
  S.shop.buying=true; render();
  try{
    const r=await Bridge.callTool("orbitx_mcp_access_confirm",{signature:sig,package:pkgId,authCode:getAuth()});
    if(r&&r.ok!==false&&!r.error){
      const p=shopPackages().find(x=>x.id===pkgId)||{};
      pushShopHist({ts:Date.now(),kind:"access",label:(p.title||p.label||pkgId)+" — "+(p.duration||""),costStr:intStr(p.tokens)+" $ORBITX",sig});
      S.shop.result={ok:true,msg:"Burn confirmed — MCP access granted.",sig,meta:{label:p.title||p.label||pkgId}};
      S.shop.confirmId=null; refreshShopStatus();
    }else S.shop.result={ok:false,msg:String((r&&(r.message||r.error))||"Confirm failed"),meta:{id:pkgId}};
  }catch(e){ S.shop.result={ok:false,msg:String(e.message||e),meta:{id:pkgId}}; }
  S.shop.buying=false; render();
}

/* ---------- credits ---------- */
function shopCreditsHTML(){
  const cr=S.shop.credits, sol=S.shop.creditsSol||"0.1";
  let h=`<div class="balrow"><span class="k">Credits balance</span><span class="v">${cr?esc(String(cr.balance??cr.credits??cr.total??"—")):"—"}</span></div>`;
  h+=`<div class="mut" style="margin:10px 0">10,000 credits / 1 SOL — shared across Agent MCP + X MCP. Non-custodial Phantom sign.</div>`;
  h+=`<div class="row" style="gap:8px"><input class="field mono" id="creditsSol" type="text" inputmode="decimal" value="${esc(sol)}" oninput="S.shop.creditsSol=this.value" autocapitalize="off" spellcheck="false" style="flex:1"><button class="btn sm" style="flex:1.4" onclick="buyCredits()">Buy credits</button></div>`;
  h+=`<div class="mut" style="margin-top:6px">≈ ${intStr(Number(sol)*10000)} credits</div>`;
  if(!getAuth()) h+=`<div class="mut" style="margin-top:6px">🔒 Connect via the OrbitX Auth widget to buy.</div>`;
  return h;
}
async function buyCredits(){
  if(!getAuth()){ S.shop.error="Connect via the OrbitX Auth widget first — credits purchase needs your authCode."; render(); return; }
  const sol=parseFloat(S.shop.creditsSol);
  if(!(sol>=0.001&&sol<=100)){ toast("Amount must be 0.001 – 100 SOL"); return; }
  S.shop.buying=true; S.shop.result=null; render();
  try{
    const r=await Bridge.callTool("orbitx_shop",{package:"credits",amountSol:sol,authCode:getAuth()});
    shopHandleResult(r,{kind:"credits",id:"credits",label:intStr(sol*10000)+" credits",cost:sol,costStr:String(sol)+" SOL"});
  }catch(e){
    S.shop.result=authFail(e)?{ok:false,msg:"Session expired — reconnect via the OrbitX auth widget, then retry."}
      :{ok:false,msg:String(e.message||e)};
  }
  S.shop.buying=false; render();
}
async function verifyCredits(inputId){
  const sig=((document.getElementById(inputId)||{}).value||"").trim();
  if(!sig){ toast("Paste the tx signature first"); return; }
  S.shop.buying=true; render();
  try{
    const r=await Bridge.callTool("orbitx_credits_confirm",{signature:sig,authCode:getAuth()});
    if(r&&r.ok!==false&&!r.error){
      pushShopHist({ts:Date.now(),kind:"credits",label:"Credits purchase",costStr:"—",sig});
      S.shop.result={ok:true,msg:"Credits payment confirmed.",sig,meta:{label:"Credits"}};
      const c=await Bridge.callTool("orbitx_credits_balance",{authCode:getAuth()}).catch(()=>null);
      if(c&&c.ok!==false&&!c.error) S.shop.credits=c;
    }else S.shop.result={ok:false,msg:String((r&&(r.message||r.error))||"Confirm failed"),meta:{id:"credits"}};
  }catch(e){ S.shop.result={ok:false,msg:String(e.message||e),meta:{id:"credits"}}; }
  S.shop.buying=false; render();
}

/* ---------- token boosts ---------- */
function shopBoostsHTML(){
  const sh=S.shop, tiers=((sh.tiers||{}).tiers)||[], active=((sh.boosts||{}).boosts)||[];
  let h=`<div class="card">`;
  if(!tiers.length) h+=`<div class="mut">Boost tiers unavailable.</div>`;
  else h+=`<div class="shopgrid">${tiers.map(t=>`
    <div class="shopitem">
      <div class="ico">🚀</div><div class="t">${esc(t.label)}</div>
      <div class="d">${t.hours}h of OG DEX token placement. Request goes pending — admin approves after payment.</div>
      <div class="c">$${esc(String(t.usd))} USD</div>
      <button class="btn buy" onclick="boostFormToggle('${esc(t.id)}')">Request</button>
      ${sh.boostForm===t.id?boostFormHTML(t):""}
    </div>`).join("")}</div>`;
  if(sh.tiers&&sh.tiers.payWallet) h+=`<div class="mut" style="margin-top:8px">Pay wallet: <span class="mono" style="font-size:11px">${esc(sh.tiers.payWallet)}</span><button class="copybtn" onclick="copyTxt('${esc(sh.tiers.payWallet)}')">copy</button></div>`;
  h+=`</div>`;
  h+=`<div class="card" style="margin-top:12px"><div class="sect" style="margin:0 0 8px">Active boosts <span class="tag">${sh.boosts?(sh.boosts.count??active.length):"—"}</span></div>`;
  h+=active.length?active.map(b=>`<div class="histrow"><div style="flex:1;min-width:0">
      <div style="font-weight:700">${esc(b.symbol||b.tokenSymbol||shortA(b.mint||""))}</div>
      <div class="mut">${esc(b.tier||b.label||"boost")}${b.expiresAt?" · ends "+esc(timeAgo(b.expiresAt)):""}</div></div>
      <span class="badge">LIVE</span></div>`).join("")
    :`<div class="mut">No active token boosts.</div>`;
  h+=`</div>`;
  return h;
}
function boostFormToggle(tierId){ S.shop.boostForm=S.shop.boostForm===tierId?null:tierId; render(); }
function boostFormHTML(t){
  return `<div class="boostform">
    <input class="field mono" id="boostMint" placeholder="Token mint address…" value="${esc(S.shop.boostMint)}" oninput="S.shop.boostMint=this.value" autocapitalize="off" spellcheck="false">
    <input class="field" id="boostSymbol" placeholder="Symbol (optional)" value="${esc(S.shop.boostSymbol)}" oninput="S.shop.boostSymbol=this.value" autocapitalize="off" spellcheck="false">
    <button class="btn buy" onclick="reviewBoost('${esc(t.id)}','${esc(t.label)}')">Review request</button>
  </div>`;
}
function reviewBoost(tierId,label){
  const mint=(S.shop.boostMint||"").trim();
  if(!isAddr(mint)){ toast("Enter a valid token mint"); return; }
  if(!getAuth()){ S.shop.error="Connect via the OrbitX Auth widget first — boost requests need your authCode."; render(); return; }
  S.shop.confirmBoost={tier:tierId,label,mint,symbol:(S.shop.boostSymbol||"").trim()};
  S.shop.boostForm=null; render();
}
function boostConfirmHTML(){
  const b=S.shop.confirmBoost; if(!b) return "";
  const usd=tierUsd(b.tier);
  return `<div class="confirmcard"><h3>⚠️ Confirm boost request</h3>
    <div class="balrow"><span class="k">Tier</span><span class="v">${esc(b.label)} — $${esc(String(usd==null?"?":usd))} USD</span></div>
    <div class="balrow"><span class="k">Token</span><span class="v mono">${esc(shortA(b.mint))}${b.symbol?" ("+esc(b.symbol)+")":""}</span></div>
    <div class="mut" style="margin:10px 0">This is a <b>WRITE</b> operation. The request goes <b>pending</b> — an admin approves it after payment to the pay wallet. Token address shown, never any key.</div>
    <div class="row" style="gap:8px">
      <button class="btn ghost sm" style="flex:1" onclick="S.shop.confirmBoost=null;render()">Cancel</button>
      <button class="btn danger sm" style="flex:2" ${S.shop.buying?"disabled":""} onclick="confirmBoost()">${S.shop.buying?"Working…":"Submit request"}</button>
    </div></div>`;
}
async function confirmBoost(){
  const b=S.shop.confirmBoost; if(!b||S.shop.buying) return;
  S.shop.buying=true; S.shop.result=null; render();
  try{
    const args={mint:b.mint,tier:b.tier,authCode:getAuth()};
    if(b.symbol) args.symbol=b.symbol;
    const r=await Bridge.callTool("orbitx_request_boost",args);
    if(r&&r.ok!==false&&!r.error){
      const usd=tierUsd(b.tier);
      pushShopHist({ts:Date.now(),kind:"boost",label:b.label+" — "+(b.symbol||shortA(b.mint)),costStr:usd==null?"—":"$"+usd+" USD",sig:null});
      S.shop.result={ok:true,msg:String(r.message||"Boost request submitted — pending admin approval."),meta:{label:b.label}};
      S.shop.confirmBoost=null;
      const bb=await Bridge.callTool("orbitx_boosts",{authCode:getAuth()}).catch(()=>null);
      if(bb&&bb.ok!==false) S.shop.boosts=bb;
    }else S.shop.result={ok:false,msg:String((r&&(r.message||r.error))||"Request failed"),meta:{id:b.tier}};
  }catch(e){
    S.shop.result=authFail(e)?{ok:false,msg:"Session expired — reconnect via the OrbitX auth widget, then retry."}
      :{ok:false,msg:String(e.message||e)};
  }
  S.shop.buying=false; render();
}

/* ---------- purchase history (this device) ---------- */
function shopHistoryHTML(){
  const h=shopHist();
  if(!h.length) return `<div class="mut">No purchases from this device yet. Lifetime burn totals above are from the live access ledger.</div>`;
  return h.map(e=>`<div class="histrow"><div style="flex:1;min-width:0">
      <div style="font-weight:700">${esc(e.label||e.kind)}</div>
      <div class="mut">${e.costStr?esc(e.costStr)+" · ":""}${esc(timeAgo(e.ts))}</div></div>
      ${e.sig?`<a class="tx" target="_blank" href="https://solscan.io/tx/${esc(e.sig)}">Solscan ↗</a>`:'<span class="badge warn">PENDING</span>'}
    </div>`).join("");
}

/* ---------- Boot ---------- */
render();
/* Standalone: if a saved authCode exists, validate + auto-load the linked
   wallet so the widget shows real data immediately. Otherwise the address
   input (rendered above) is the entry point. */
(function(){
  if(getAuth()){
    loadConnected().catch(function(){ /* render() already shows input fallback */ });
  }
})();
</script>
