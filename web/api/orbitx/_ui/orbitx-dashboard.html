<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OrbitX Dashboard</title>
<!--
  OrbitX ChatGPT Mini App — Dashboard (home screen)
  resourceUri: ui://widget/orbitx-dashboard.html
  Bridge order: window.OrbitX.callTool -> window.openai.callTool -> standalone POST https://www.orbitx.world/api/mcp
  Sections: header/auth pill, portfolio snapshot, market overview (orbitx_screen_tokens),
            quick actions to the other mini-app widgets (tool -> _meta widget binding renders them).
  Auth: contract key `orbitx.authCode` (shared with the auth widget via localStorage).
        authCode is never painted into the DOM and never placed in URLs.
-->
<style>
:root{
  --bg:#07080e; --bg2:#0b0e16; --panel:#0d1119; --panel2:#10151f; --line:#1a2230;
  --neon:#17ff4d; --teal:#2dd4bf; --gold:#fbbf24; --danger:#f87171;
  --txt:#e8eaf2; --muted:#9aa0b8; --faint:#5c6178; --r:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;min-height:100vh}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(600px 300px at 15% -5%, rgba(23,255,77,.09), transparent 60%),
   radial-gradient(700px 380px at 90% 10%, rgba(45,212,191,.06), transparent 60%),
   radial-gradient(500px 500px at 50% 110%, rgba(23,255,77,.05), transparent 60%);}
#app{position:relative;z-index:1;max-width:620px;margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
.header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.logo img.oxlogo{width:32px;height:32px;border-radius:8px;filter:drop-shadow(0 0 8px rgba(23,255,77,.7))}
.brand{font-weight:800;letter-spacing:2px;font-size:17px;line-height:1.1}
.brand small{display:block;font-size:9px;letter-spacing:3px;color:var(--neon);font-weight:600}
.authpill{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;
  border:1px solid var(--line);border-radius:20px;padding:0 13px;min-height:54px;cursor:pointer;
  background:var(--bg2);color:var(--muted);font-weight:600;max-width:48%}
.authpill .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.authpill.on{color:var(--txt);border-color:rgba(23,255,77,.45)}
.authpill.on .dot{background:var(--neon);box-shadow:0 0 8px var(--neon);animation:blink 2s infinite}
.authpill.stale{border-color:rgba(251,191,36,.55);color:var(--gold)}
.authpill .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,monospace;font-size:11px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.sect{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:2px;color:var(--neon);
  font-weight:800;margin:18px 0 10px;text-transform:uppercase}
.sect .sp{flex:1;height:1px;background:var(--line)}
.sect button{background:none;border:1px solid var(--line);color:var(--neon);border-radius:8px;
  padding:6px 12px;font-size:11px;cursor:pointer;min-height:36px;letter-spacing:1px}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:4px}
.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat .v{font-weight:800;font-size:16px;font-family:ui-monospace,monospace}
.stat .l{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:5px;text-transform:uppercase}
.up{color:var(--neon)} .down{color:var(--danger)}
.mut{color:var(--muted);font-size:12px}
.btn{background:linear-gradient(135deg,#17ff4d,#0fce43);border:0;color:#03130b;font-weight:800;
  border-radius:12px;padding:0 16px;font-size:15px;cursor:pointer;width:100%;min-height:54px}
.btn.ghost{background:#0d151c;color:var(--neon);border:1px solid rgba(23,255,77,.4)}
.btn:active{transform:scale(.98)}
.btn.sm{width:auto;min-height:40px;padding:8px 14px;font-size:13px}
.center{text-align:center}
.trow{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);
  cursor:pointer;min-height:56px}
.trow:last-child{border-bottom:0}
.trow:active{background:rgba(23,255,77,.04)}
.ticon{width:34px;height:34px;border-radius:50%;background:#131a26;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:var(--neon);flex:none;overflow:hidden}
.ticon img{width:100%;height:100%;object-fit:cover}
.tmeta{flex:1;min-width:0}
.tname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.tprice{text-align:right;font-family:ui-monospace,monospace}
.tprice .p{font-size:13px;font-weight:700}
.tchg{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px}
.tchg.up{background:rgba(23,255,77,.12);color:var(--neon)}
.tchg.down{background:rgba(248,113,113,.12);color:var(--danger)}
.chev{color:var(--faint);font-size:16px;flex:none}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:var(--r);padding:6px 14px;min-height:64px;cursor:pointer;
  color:var(--txt);font-family:inherit;text-align:left;font-size:14px;font-weight:700;width:100%}
.qbtn:active{border-color:rgba(23,255,77,.5);transform:scale(.98)}
.qbtn .ic{font-size:22px;width:34px;text-align:center;flex:none}
.qbtn .d{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:3px;line-height:1.35}
#toolsdrawer{margin-top:10px}
.toolrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;
  padding:12px;margin-bottom:8px;background:rgba(255,255,255,.015)}
.toolrow .nm{font-weight:700;font-size:13px}
.toolrow .ds{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.toolrow .btn{margin-left:auto;flex:none}
.err{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.4);border-radius:14px;
  padding:14px;color:#ffb9c0;font-size:14px;margin-bottom:12px;line-height:1.5}
.empty{text-align:center;padding:30px 18px;color:var(--muted);font-size:14px;line-height:1.6}
.empty .big{font-size:44px;margin-bottom:10px}
.skel{position:relative;overflow:hidden;background:#0d141b;border-radius:12px;min-height:18px;margin-bottom:8px}
.skel::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(23,255,77,.08),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.inlineres{margin-top:10px;border:1px dashed var(--line);border-radius:12px;padding:12px;
  font-size:12px;color:var(--muted);max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.standalone{text-align:center;font-size:11px;color:var(--muted);opacity:.85;margin-bottom:10px}
/* Command palette (Cmd+K) */
#cmdk{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;
  padding:calc(60px + env(safe-area-inset-top)) 16px 16px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px)}
#cmdk.open{display:flex;animation:fadein .15s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.cmdk-box{width:100%;max-width:520px;background:var(--panel);border:1px solid rgba(23,255,77,.35);
  border-radius:18px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 40px rgba(23,255,77,.08)}
.cmdk-input{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdk-input input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:16px;font-family:inherit}
.cmdk-input input::placeholder{color:var(--faint)}
.cmdk-list{max-height:320px;overflow-y:auto;padding:8px}
.cmdk-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;min-height:56px}
.cmdk-item.sel,.cmdk-item:active{background:rgba(23,255,77,.08);border:1px solid rgba(23,255,77,.25)}
.cmdk-item .ic{font-size:20px;width:32px;text-align:center;flex:none}
.cmdk-item .nm{font-weight:700;font-size:14px}
.cmdk-item .ds{font-size:11px;color:var(--muted);margin-top:2px}
.cmdk-item kbd{margin-left:auto;font-family:ui-monospace,monospace;font-size:10px;color:var(--faint);
  border:1px solid var(--line);border-radius:6px;padding:3px 7px;flex:none}
.cmdk-hint{padding:10px 16px;font-size:11px;color:var(--faint);border-top:1px solid var(--line);
  display:flex;gap:14px}
.cmdk-hint kbd{font-family:ui-monospace,monospace;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.cmdk-fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:16px;z-index:40;
  width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#17ff4d,#0fce43);
  border:0;color:#03130b;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 28px rgba(23,255,77,.35)}
.cmdk-fab:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* UI polish: smooth transitions, press feedback, fade-in */
.card,.tcard,.toolrow,.qbtn,.stat{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:hover,.tcard:hover{border-color:rgba(23,255,77,.25)}
button{transition:transform .12s ease,opacity .12s ease,border-color .15s ease}
button:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card,.tcard{animation:fadeUp .32s ease both}
@media (prefers-reduced-motion:reduce){.card,.tcard{animation:none}}
</style>
</head>
<body>
<div id="bgfx"></div>
<div id="app"></div>
<div id="cmdk" role="dialog" aria-label="Command palette">
  <div class="cmdk-box">
    <div class="cmdk-input"><span style="font-size:18px">🔍</span><input id="cmdk-q" placeholder="Search tools, actions…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="cmdk-list" id="cmdk-list"></div>
    <div class="cmdk-hint"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>
<button class="cmdk-fab" onclick="cmdkOpen()" aria-label="Quick actions">⌘</button>
<script>
"use strict";
/* ================= Bridge (CONTRACT.md v1 — task order: OrbitX -> openai -> standalone) ================= */
const MCP_URL = "https://www.orbitx.world/api/mcp";
/* Unwrap an MCP CallToolResult envelope into the tool's data. Bridge calls
   (window.openai / window.OrbitX) return the raw envelope
   {content:[...], structuredContent} — callers expect the data itself. */
function unwrapToolResult(r){
  if(!r || typeof r!=="object") return r;
  if(r.isError){
    const t=Array.isArray(r.content)?r.content.find(c=>c&&c.type==="text"&&typeof c.text==="string"):null;
    throw new Error((t&&t.text)||"tool error");
  }
  if(r.structuredContent && typeof r.structuredContent==="object") return r.structuredContent;
  if(Array.isArray(r.content) && r.content.length && r.content[0] && (r.content[0].type==="text"||r.content[0].type==="resource")){
    const t=r.content.find(c=>c&&c.type==="text"&&typeof c.text==="string");
    if(t){ try{ return JSON.parse(t.text); }catch(e){ return t.text; } }
    return r.content;
  }
  return r;
}

const Bridge = {
  async callTool(name, args){
    if (window.OrbitX && typeof window.OrbitX.callTool === "function"){
      return unwrapToolResult(await window.OrbitX.callTool(name, args));
    }
    if (window.openai && typeof window.openai.callTool === "function"){
      return unwrapToolResult(await window.openai.callTool(name, args));
    }
    const res = await fetch(MCP_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json, text/event-stream"},
      body: JSON.stringify({jsonrpc:"2.0", id:"w"+Date.now()+Math.floor(Math.random()*999), method:"tools/call",
        params:{name, arguments:args||{}}})
    });
    if(!res.ok) throw new Error("MCP HTTP "+res.status);
    const raw = await res.text();
    let j;
    try{
      const lines = raw.split(/\r?\n/).filter(l=>l.indexOf("data:")===0);
      j = JSON.parse((lines.length?lines[lines.length-1].slice(5):raw).trim());
    }catch(e){ throw new Error("bad MCP response"); }
    if(j.error) throw new Error(j.error.message||"tool error");
    const r = j.result||{};
    if(r.structuredContent) return r.structuredContent;
    const content = r.content;
    if(Array.isArray(content)){
      const t = content.find(c=>c.type==="text");
      if(t){ try{ return JSON.parse(t.text); }catch(e){ return t.text; } }
      return content;
    }
    return r;
  }
};
const isHosted = ()=>(window.OrbitX && typeof window.OrbitX.callTool==="function") ||
                     (window.openai && typeof window.openai.callTool==="function");
/* Auth: contract key `orbitx.authCode` (shared with the auth widget) */
const AUTH_KEYS = ["orbitx.authCode","orbitx_auth_code"];
const getAuth = ()=>{ try{ for(const k of AUTH_KEYS){ const v=localStorage.getItem(k); if(v) return v; } }catch(e){} return ""; };
const AUTH_ERR_RE=/auth|unauthor|expir|invalid code|session|forbidden|not (linked|connected|signed)|sign.?in|token|credential/i;
function standaloneNote(){ return isHosted()?"":`<div class="standalone">⚙ standalone preview — live reads work; signing in needs the OrbitX bridge</div>`; }

/* ================= State ================= */
const S = {
  identity:null, authState:"boot",        // boot | authed | signedout | stale
  portfolio:null, pfLoading:false, pfError:"",
  market:[], mkLoading:false, mkError:"", mkFetchedAt:0,
  toolsOpen:false, inlineResult:"",
  bootCount:0
};
const app = document.getElementById("app");
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n,d)=>{ const x=Number(n); if(!isFinite(x)) return "—";
  const a=Math.abs(x), neg=x<0?"-":"";
  const s=a>=1e9?(a/1e9).toFixed(2)+"B":a>=1e6?(a/1e6).toFixed(2)+"M":a>=1e3?(a/1e3).toFixed(2)+"K":a.toFixed(d!=null?d:(a<1?4:2));
  return neg+s; };
const fmtUSD = n=>{ if(n==null||isNaN(Number(n))) return "—"; const x=Number(n);
  const s=Math.abs(x)<0.01&&x!==0?"$"+Math.abs(x).toExponential(2):"$"+fmt(Math.abs(x));
  return (x<0?"-":"")+s; };
const signedUSD = n=>{ if(n==null||isNaN(Number(n))) return "—";
  const x=Number(n); return (x<0?"−$":"+$")+fmt(Math.abs(x)); };
const fmtPct = n=>{ if(n==null||isNaN(Number(n))) return "—"; const x=Number(n);
  return (x>=0?"+":"")+x.toFixed(2)+"%"; };
const ageFmt = t=>{
  const raw=t.age??t.ageMin??t.ageMinutes;
  if(raw!=null && !isNaN(Number(raw))){ const m=Number(raw);
    if(m<60) return Math.round(m)+"m"; if(m<1440) return Math.round(m/60)+"h"; return Math.round(m/1440)+"d"; }
  const ts=t.createdAt||t.pairCreatedAt||t.launchTs||t.created_at;
  if(!ts) return "—"; const s=Math.floor((Date.now()-new Date(ts).getTime())/1000);
  if(s<0||!isFinite(s)) return "—"; if(s<60) return s+"s"; if(s<3600) return Math.floor(s/60)+"m";
  if(s<86400) return Math.floor(s/3600)+"h"; return Math.floor(s/86400)+"d"; };
const shortA = a=>a&&a.length>10?a.slice(0,4)+"…"+a.slice(-4):esc(a||"");
const timeHM = ts=>ts?new Date(ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"—";

/* ================= Auth ================= */
function normalizeIdentity(r){
  if(!r||typeof r!=="object") return null;
  // orbitx_whoami returns walletAddress + agentName — NOT wallet/name.
  const w=r.walletAddress||r.wallet||r.address||r.pubkey||r.publicKey||r.id||"";
  if(!w) return null;
  return { wallet:String(w),
    handle:String(r.handle||r.username||r.agentName||r.name||r.displayName||r.ens||"Trader"),
    tier:String(r.tier||r.plan||r.level||r.badge||"Standard") };
}
async function checkAuth(){
  const code=getAuth();
  try{
    // Hosted (ChatGPT/OrbitX bridge): the MCP call carries the user's OAuth
    // session, so whoami resolves even with no localStorage code — the
    // dashboard is connected from the start, no manual link step.
    const who=await Bridge.callTool("orbitx_whoami", code?{authCode:code}:{});
    const id=normalizeIdentity(who);
    if(!id) throw new Error("Identity lookup returned no wallet.");
    S.identity=id; S.authState="authed";
  }catch(e){
    const msg=String((e&&e.message)||e||"");
    if(AUTH_ERR_RE.test(msg)){ S.authState="stale"; S.identity=null; }
    else { S.authState="signedout"; S.identity=null; }
  }
}
function openAuthFlow(){
  // established mini-app pattern: ask the auth widget to show itself
  try{ document.dispatchEvent(new CustomEvent("orbitx-show-auth")); }catch(e){}
  // direct path: calling the auth tool renders the auth widget via its _meta binding
  const code=getAuth();
  Bridge.callTool("orbitx_auth_link", code?{authCode:code}:{})
    .then(r=>{ if(!isHosted()) S.inlineResult="Auth widget tool result: "+JSON.stringify(r).slice(0,600); render(); })
    .catch(e=>{ if(!isHosted()){ S.inlineResult="orbitx_auth_link failed: "+(e.message||e); render(); } });
}

/* ================= Data ================= */
async function loadPortfolio(){
  if(S.authState!=="authed"){ S.portfolio=null; return; }
  S.pfLoading=true; S.pfError=""; render();
  try{
    const [w,p]=await Promise.all([
      Bridge.callTool("orbitx_get_wallet",{authCode:getAuth()}).catch(e=>({__err:String(e.message||e)})),
      Bridge.callTool("orbitx_app_pnl",{authCode:getAuth()}).catch(()=>null)
    ]);
    if(w&&w.__err) throw new Error(w.__err);
    S.portfolio={wallet:w, pnl:(p&&!p.__err)?p:null};
  }catch(e){
    const msg=String((e&&e.message)||e||"");
    if(AUTH_ERR_RE.test(msg)){ S.authState="stale"; S.identity=null; }
    else S.pfError=msg;
  }
  S.pfLoading=false; render();
}
async function loadMarket(){
  S.mkLoading=true; S.mkError=""; render();
  const intervals=["24h","1h","1m"];
  let lastErr="";
  for(const iv of intervals){
    try{
      const r=await Bridge.callTool("orbitx_screen_tokens",
        {type:"trending", interval:iv, limit:10, chain:"solana", authCode:getAuth()});
      if(typeof r==="string") throw new Error(r);
      const list=r.rows||r.results||r.tokens||r.data||[];
      if(list.length){
        S.market=list.slice(0,10); S.mkFetchedAt=Date.now(); S.mkInterval=iv;
        S.mkLoading=false; render(); return;
      }
      lastErr=`No trending tokens for ${iv}`;
    }catch(e){ lastErr=String((e&&e.message)||e||"market fetch failed"); }
  }
  S.mkError=`Screener empty after trying 24h/1h/1m. ${lastErr}`;
  S.mkLoading=false; render();
}
async function scanMint(mint){
  if(!mint) return;
  S.inlineResult=""; render();
  try{
    const r=await Bridge.callTool("orbitx_crypto_scan",{mint, authCode:getAuth()});
    if(typeof r==="string") throw new Error(r);
    // hosted: the tool -> widget _meta binding renders the Token Intel widget in ChatGPT.
    if(!isHosted()) S.inlineResult="Token scan result:\n"+JSON.stringify(r,null,1).slice(0,2000);
  }catch(e){
    S.inlineResult="Scan failed: "+String((e&&e.message)||e);
  }
  render();
}

/* ================= Quick actions ================= */
// Widget registry (matches _widgets.js UI_TOOL_WIDGET) — each entry's flagship tool
// carries a _meta ui binding, so calling it renders the target widget in the host.
const WIDGETS=[
  {label:"Trade",       sub:"Quotes · buy · sell · swap", ic:"⚡", tool:"orbitx_trade_quote",  args:{}},
  {label:"Token Intel", sub:"Scans · screeners · charts", ic:"🔭", tool:"orbitx_screen_tokens",args:{type:"trending",interval:"1h",limit:20,chain:"solana"}},
  {label:"Wallet",      sub:"Balances · PnL · swaps",     ic:"👛", tool:"orbitx_get_wallet",   args:{}},
  {label:"Studio",      sub:"Images · X posts · launches",ic:"🎨", tool:"orbitx_generate_image",args:{}},
  {label:"Group Chat",  sub:"Live chat feed + composer",  ic:"💬", tool:"orbitx_gc_chat",      args:{}},
  {label:"Connect",     sub:"Link wallet · session",      ic:"🔑", tool:"orbitx_auth_link",    args:{}},
];
async function quickGo(i){
  const w=WIDGETS[i]; if(!w) return;
  const args=Object.assign({}, w.args||{});
  if(/get_wallet|gc_chat|auth_link/.test(w.tool)){ const c=getAuth(); if(c) args.authCode=c; }
  S.inlineResult=""; render();
  try{
    const r=await Bridge.callTool(w.tool, args);
    if(typeof r==="string" && !isHosted()) S.inlineResult=w.label+" result: "+r.slice(0,1200);
    else if(!isHosted()) S.inlineResult=w.label+" result:\n"+JSON.stringify(r,null,1).slice(0,1200);
    // hosted: the tool's _meta outputTemplate renders the target widget — no inline dump needed

function portfolioCard(){
  let body;
  if(S.authState==="authed"){
    if(S.pfLoading) body=`<div class="skel" style="height:30px"></div><div class="statgrid">${'<div class="skel" style="height:74px"></div>'.repeat(3)}</div>`;
    else if(S.pfError) body=`<div class="err">${esc(S.pfError)}</div><button class="btn ghost" onclick="loadPortfolio()">↻ Retry</button>`;
    else if(S.portfolio){
      const w=S.portfolio.wallet||{}, p=S.portfolio.pnl||{};
      const total=w.totalUsd??w.totalValue??w.totalValueUsd??w.valueUsd??w.portfolioValue;
      const tPnl=p.totalPnlUsd??p.totalPnl??p.pnlUsd??p.pnl;
      const wins=p.wins??0, losses=p.losses??0;
      const closed=p.closedTrades??(wins+losses);
      const wr=p.winRate??(closed?100*wins/closed:null);
      body=`<div class="statgrid">
        <div class="stat"><div class="v">${fmtUSD(total)}</div><div class="l">Total value</div></div>
        <div class="stat"><div class="v ${Number(tPnl)>=0?"up":"down"}">${tPnl==null?"—":signedUSD(tPnl)}</div><div class="l">Total PnL</div></div>
        <div class="stat"><div class="v" style="color:var(--neon)">${wr==null?"—":Number(wr).toFixed(1)+"%"}</div><div class="l">Win rate</div></div>
      </div>
      <div class="mut" style="margin-top:10px">${S.identity?esc(S.identity.handle)+" · "+shortA(S.identity.wallet):""} · ${closed||"—"} closed trades</div>`;
    } else body=`<div class="skel" style="height:74px"></div>`;
  } else if(S.authState==="stale"){
    body=`<div class="empty" style="padding:22px 14px"><div class="big">🔑</div>
      <div style="font-weight:700;color:var(--gold);margin-bottom:6px">Your session expired</div>
      Reconnect to see your portfolio.</div>
      <button class="btn" onclick="openAuthFlow()">Reconnect wallet</button>`;
  } else {
    body=`<div class="empty" style="padding:22px 14px"><div class="big">👛</div>
      <div style="font-weight:700;margin-bottom:6px">Connect to see your portfolio</div>
      Link your OrbitX session once — the dashboard picks it up automatically.</div>
      <button class="btn" onclick="openAuthFlow()">Connect wallet</button>`;
  }
  return `<div class="card"><div class="sect" style="margin:0 0 12px">Portfolio<span class="sp"></span>${S.authState==="authed"&&!S.pfLoading?'<button onclick="loadPortfolio()">↻</button>':""}</div>${body}</div>`;
}
function marketCard(){
  let body;
  if(S.mkLoading) body='<div class="skel" style="height:52px"></div>'.repeat(5);
  else if(S.mkError) body=`<div class="err">${esc(S.mkError)}</div><button class="btn ghost" onclick="loadMarket()">↻ Retry</button>`;
  else if(!S.market.length) body=`<div class="empty"><div class="big">📉</div>No trending tokens returned.<br>Try again in a moment.</div>`;
  else body=S.market.map(t=>{
    const sym=t.symbol||"?", p=t.priceUsd??t.price, c=t.change24h??t.priceChange24h??t.change;
    const mint=t.mint||t.address||"";
    const init=(sym||"?").slice(0,3).toUpperCase();
    return `<div class="trow" onclick="scanMint('${esc(mint)}')">
      <div class="ticon">${t.icon?`<img src="${esc(t.icon)}" alt="" loading="lazy" onerror="this.remove()">`:`<span>${esc(init)}</span>`}</div>
      <div class="tmeta"><div class="tname">${esc(t.name||sym)}</div>
        <div class="tsub">${esc(sym)} · ${esc(ageFmt(t))}</div></div>
      <div class="tprice"><div class="p">${fmtUSD(p)}</div>
        <div class="tchg ${Number(c)>=0?"up":"down"}">${fmtPct(c)}</div></div>
      <div class="chev">›</div>
    </div>`;
  }).join("");
  return `<div class="card"><div class="sect" style="margin:0 0 6px">Market overview<span class="sp"></span>
    ${S.mkFetchedAt?`<span class="mut" style="font-size:10px;letter-spacing:0">updated ${esc(timeHM(S.mkFetchedAt))}</span>`:""}
    ${!S.mkLoading?'<button onclick="loadMarket()">↻</button>':""}</div>
    <div class="mut" style="margin-bottom:8px">Trending · Solana · 24h — tap a row for a full safety scan</div>${body}</div>`;
}
function quickActions(){
  const grid=WIDGETS.map((w,i)=>`<button class="qbtn" onclick="quickGo(${i})">
    <span class="ic">${w.ic}</span><span>${esc(w.label)}<span class="d">${esc(w.sub)}</span></span></button>`).join("");
  return `<div class="sect">Quick actions<span class="sp"></span></div>
    <div class="qgrid">${grid}
      <button class="qbtn" onclick="toggleTools()"><span class="ic">🧰</span><span>Tools<span class="d">Browse all mini-app tools</span></span></button>
    </div>
    ${S.toolsOpen?toolsDrawer():""}`;
}
function toolsDrawer(){
  const rows=WIDGETS.map((w,i)=>{
    const uri="ui://widget/orbitx-"+({Trade:"trade", "Token Intel":"token", Wallet:"wallet", Studio:"media", "Group Chat":"groupchat", Connect:"auth"})[w.label]+".html";
    return `<div class="toolrow"><div><div class="nm">${w.ic} ${esc(w.label)}</div>
      <div class="ds">${esc(w.sub)} · <span style="font-family:ui-monospace,monospace">${esc(w.tool)}</span></div></div>
      <button class="btn sm" onclick="quickGo(${i})">Open</button></div>`;
  }).join("");
  return `<div id="toolsdrawer">${rows}
    <div class="mut" style="margin-top:6px">Each tool opens its widget inside ChatGPT via the tool → widget binding. Coming-soon tools (orders, copy trading, sniping…) have no widget yet and are not listed.</div></div>`;
}
function toggleTools(){ S.toolsOpen=!S.toolsOpen; render(); }
function render(){
  const boot=S.bootCount===0;
  app.innerHTML = header()
    + (boot?`<div class="skel" style="height:120px"></div><div class="skel" style="height:200px"></div><div class="skel" style="height:160px"></div>`
      : portfolioCard()
      + `<div class="sect">Market overview<span class="sp"></span></div>` + marketCard()
      + quickActions()
      + (S.inlineResult?`<div class="inlineres">${esc(S.inlineResult)}</div>`:""));
}
/* ================= Command palette (Cmd+K) ================= */
const CMDK_CMDS=[
  {ic:"⚡",nm:"Trade",ds:"Quotes · buy · sell · swap",run:()=>quickGo(0)},
  {ic:"🔭",nm:"Token Intel",ds:"Scans · screeners · charts",run:()=>quickGo(1)},
  {ic:"👛",nm:"Wallet",ds:"Balances · PnL · swaps",run:()=>quickGo(2)},
  {ic:"🎨",nm:"Studio",ds:"Images · X posts · launches",run:()=>quickGo(3)},
  {ic:"💬",nm:"Group Chat",ds:"Live chat feed + composer",run:()=>quickGo(4)},
  {ic:"🔑",nm:"Connect",ds:"Link wallet · session",run:()=>quickGo(5)},
  {ic:"🔄",nm:"Refresh market",ds:"Reload trending tokens",run:()=>loadMarket()},
  {ic:"💼",nm:"Refresh portfolio",ds:"Reload wallet balances",run:()=>loadPortfolio()},
  {ic:"🐋",nm:"Whale watch",ds:"Large transfers for a wallet",run:()=>cmdkCall("orbitx_whale_watch",{wallet:prompt("Wallet address to watch:")||""})},
  {ic:"🔔",nm:"Price alert",ds:"Alert when a token crosses a price",run:()=>cmdkCall("orbitx_alert_create",{})},
  {ic:"📅",nm:"Unlock calendar",ds:"Vesting schedules for a token",run:()=>cmdkCall("orbitx_unlocks",{mint:prompt("Token mint (blank for general):")||""})},
  {ic:"🎁",nm:"Airdrop checker",ds:"Unclaimed drops for a wallet",run:()=>cmdkCall("orbitx_airdrops",{wallet:prompt("Wallet address:")||""})},
  {ic:"🗂",nm:"Multi-wallet portfolio",ds:"Aggregate up to 10 wallets",run:()=>cmdkCall("orbitx_portfolio_multi",{wallets:(prompt("Wallet addresses, comma-separated:")||"").split(",").map(s=>s.trim()).filter(Boolean)})},
  {ic:"🧰",nm:"Browse all tools",ds:"Open the tools drawer",run:()=>{ if(!S.toolsOpen) toggleTools(); cmdkClose(); document.getElementById("toolsdrawer")?.scrollIntoView({behavior:"smooth"}); }},
];
let cmdkSel=0;
async function cmdkCall(tool,args){
  cmdkClose();
  S.inlineResult=""; render();
  try{
    const r=await Bridge.callTool(tool,args);
    if(!isHosted()) S.inlineResult=tool+" result:\n"+JSON.stringify(r,null,1).slice(0,1500);
  }catch(e){ S.inlineResult=tool+" failed: "+String((e&&e.message)||e); }
  render();
}
function cmdkFiltered(){
  const q=(document.getElementById("cmdk-q").value||"").toLowerCase().trim();
  if(!q) return CMDK_CMDS;
  return CMDK_CMDS.filter(c=>(c.nm+" "+c.ds).toLowerCase().includes(q));
}
function cmdkRender(){
  const list=cmdkFiltered();
  cmdkSel=Math.min(cmdkSel,Math.max(0,list.length-1));
  document.getElementById("cmdk-list").innerHTML=list.length
    ? list.map((c,i)=>`<div class="cmdk-item${i===cmdkSel?" sel":""}" data-i="${i}" onclick="cmdkPick(${i})">
        <span class="ic">${c.ic}</span><span><div class="nm">${esc(c.nm)}</div><div class="ds">${esc(c.ds)}</div></span></div>`).join("")
    : `<div class="empty" style="padding:20px">No matches</div>`;
}
function cmdkOpen(){ document.getElementById("cmdk").classList.add("open"); cmdkSel=0;
  const q=document.getElementById("cmdk-q"); q.value=""; cmdkRender(); setTimeout(()=>q.focus(),50); }
function cmdkClose(){ document.getElementById("cmdk").classList.remove("open"); }
function cmdkPick(i){ const c=cmdkFiltered()[i]; if(c) c.run(); }
document.getElementById("cmdk-q").addEventListener("input",()=>{ cmdkSel=0; cmdkRender(); });
document.getElementById("cmdk").addEventListener("click",e=>{ if(e.target.id==="cmdk") cmdkClose(); });
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault();
    document.getElementById("cmdk").classList.contains("open")?cmdkClose():cmdkOpen(); return; }
  if(!document.getElementById("cmdk").classList.contains("open")) return;
  if(e.key==="Escape") cmdkClose();
  else if(e.key==="ArrowDown"){ e.preventDefault(); cmdkSel++; cmdkRender(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); cmdkSel=Math.max(0,cmdkSel-1); cmdkRender(); }
  else if(e.key==="Enter"){ const c=cmdkFiltered()[cmdkSel]; if(c) c.run(); }
});

async function boot(rebind){
  if(!rebind){ S.bootCount++; render(); }
  await checkAuth();
  if(S.authState==="authed") loadPortfolio(); else { S.portfolio=null; S.pfLoading=false; S.pfError=""; }
  loadMarket();
  S.bootCount=2; render();
}
window.addEventListener("orbitx-auth-changed",()=>{ boot(true); });
boot();
</script>
</body>
