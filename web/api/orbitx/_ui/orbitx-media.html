<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OrbitX Media Studio</title>
<!--
  OrbitX ChatGPT Mini App — Media Studio (image gen, X posts, token launch)
  resourceUri: ui://widget/orbitx-media.html
  Bridge: window.OrbitX.callTool(name, args) when hosted in the OrbitX bridge,
          else standalone fallback POSTs to https://www.orbitx.world/api/mcp
  Tools (verified live): orbitx_generate_image, orbitx_x_post, orbitx_app_launch
  RULES: X posts ALWAYS require explicit confirm. Launches ALWAYS require a
  confirmation gate. No secrets in this file.
-->
<style>
:root{
  --bg:#04070a; --panel:#0a0f14; --panel2:#0d141b; --line:#14202a;
  --neon:#00ff88; --neon2:#00d4ff; --dim:#8fa3b3; --txt:#eaf4ee;
  --red:#ff4d5e; --amber:#ffb02e; --violet:#b06bff; --r:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;min-height:100vh}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(600px 300px at 15% -5%, rgba(0,255,136,.09), transparent 60%),
   radial-gradient(700px 380px at 90% 10%, rgba(176,107,255,.08), transparent 60%),
   radial-gradient(500px 500px at 50% 110%, rgba(0,255,136,.05), transparent 60%);}
#app{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:14px 14px 60px}
.header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.logo svg{width:30px;height:30px;filter:drop-shadow(0 0 8px rgba(0,255,136,.7))}
.brand{font-weight:800;letter-spacing:2px;font-size:17px}
.brand small{display:block;font-size:9px;letter-spacing:3px;color:var(--neon);font-weight:600}
.tabs{display:flex;gap:8px;margin-bottom:14px;position:sticky;top:0;z-index:5;
  background:rgba(4,7,10,.9);backdrop-filter:blur(10px);padding:8px 0}
.tab{flex:1;text-align:center;padding:10px 6px;border-radius:12px;font-size:13px;font-weight:700;
  background:var(--panel);border:1px solid var(--line);color:var(--dim);cursor:pointer}
.tab.on{background:rgba(0,255,136,.1);border-color:var(--neon);color:var(--neon);
  box-shadow:0 0 14px rgba(0,255,136,.25)}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;
  box-shadow:0 6px 24px rgba(0,0,0,.4)}
.card.glow{border-color:rgba(0,255,136,.4);box-shadow:0 0 20px rgba(0,255,136,.12)}
.mut{color:var(--dim);font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
label.fl{display:block;font-size:12px;color:var(--dim);letter-spacing:1px;margin:12px 0 6px;text-transform:uppercase;font-weight:700}
input[type=text],input[type=url],input[type=number],textarea,select{
  width:100%;background:#080d12;border:1px solid var(--line);border-radius:12px;
  color:var(--txt);padding:12px 14px;font-size:15px;outline:none;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--neon);box-shadow:0 0 0 2px rgba(0,255,136,.2)}
textarea{min-height:110px;resize:vertical}
.btn{background:linear-gradient(135deg,#00ff88,#00c86e);border:0;color:#03130b;font-weight:800;
  border-radius:12px;padding:13px 16px;font-size:15px;cursor:pointer;width:100%;letter-spacing:.5px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#0d151c;color:var(--neon);border:1px solid var(--neon)}
.btn.danger{background:linear-gradient(135deg,#ff4d5e,#c81e3a);color:#fff}
.btn.sm{width:auto;padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.skel{position:relative;overflow:hidden;background:#0d141b;border-radius:12px;min-height:18px}
.skel::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(0,255,136,.08),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.err{background:rgba(255,77,94,.08);border:1px solid rgba(255,77,94,.4);border-radius:14px;
  padding:14px;color:#ffb9c0;font-size:14px;margin-bottom:12px}
.okbox{background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.4);border-radius:14px;
  padding:14px;font-size:14px;margin-bottom:12px}
.empty{text-align:center;padding:30px 18px;color:var(--dim);font-size:14px}
.empty .big{font-size:42px;margin-bottom:10px}
.sect{font-size:12px;letter-spacing:2px;color:var(--neon);font-weight:800;margin:16px 0 8px;text-transform:uppercase}
.imggrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.imggrid img{width:100%;border-radius:12px;border:1px solid var(--line);display:block;aspect-ratio:1;object-fit:cover}
.imggrid a{position:relative}
.prog{height:10px;background:#080d12;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;width:40%;border-radius:99px;
  background:linear-gradient(90deg,var(--neon),var(--neon2));animation:pg 1.1s ease-in-out infinite alternate}
@keyframes pg{from{margin-left:0}to{margin-left:60%}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--panel2);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  width:100%;max-width:620px;padding:20px 18px 30px;max-height:85vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-size:18px}
.previewbox{background:#080d12;border:1px solid var(--line);border-radius:12px;padding:14px;
  margin:12px 0;white-space:pre-wrap;font-size:15px;line-height:1.5;max-height:220px;overflow:auto}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #0f1720;font-size:14px}
.kv:last-child{border-bottom:0}.kv .k{color:var(--dim)}
.warnbar{background:rgba(255,176,46,.07);border:1px solid rgba(255,176,46,.35);border-radius:14px;
  padding:12px 14px;font-size:13px;color:#ffd9a0;margin:12px 0;line-height:1.55}
.charcount{text-align:right;font-size:12px;color:var(--dim);margin-top:4px}
.charcount.over{color:var(--red);font-weight:800}
</style>
</head>
<body>
<div id="bgfx"></div>
<div id="app"></div>
<div id="modal"></div>
<script>
"use strict";
/* ================= Bridge (CONTRACT.md v1) ================= */
const MCP_URL = "https://www.orbitx.world/api/mcp";
const Bridge = {
  async callTool(name, args){
    if (window.openai && typeof window.openai.callTool === "function"){
      return await window.openai.callTool(name, args);
    }
    if (window.OrbitX && typeof window.OrbitX.callTool === "function"){
      return await window.OrbitX.callTool(name, args);
    }
    const res = await fetch(MCP_URL, {
      method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify({jsonrpc:"2.0", id:"m"+Date.now(), method:"tools/call",
        params:{name, arguments:args||{}}})
    });
    if(!res.ok) throw new Error("MCP HTTP "+res.status);
    const j = await res.json();
    if(j.error) throw new Error(j.error.message||"tool error");
    const r = j.result||{};
    if(r.structuredContent) return r.structuredContent;
    const content = r.content;
    if(Array.isArray(content)){
      const t = content.find(c=>c.type==="text");
      if(t){ try{ return JSON.parse(t.text); }catch(e){ return t.text; } }
      return content;
    }
    return r;
  }
};
/* Auth: contract key `orbitx.authCode` (legacy `orbitx_auth_code` still read) */
const AUTH_KEYS = ["orbitx.authCode","orbitx_auth_code"];
const getAuth = ()=>{ try{ for(const k of AUTH_KEYS){ const v=localStorage.getItem(k); if(v) return v; } }catch(e){} return ""; };
const AUTH_ERR_RE=/auth|unauthor|expir|invalid code|session|forbidden|not (linked|connected|signed)|sign.?in|token|credential/i;
function authFail(e){ const m=String((e&&e.message)||e||"");
  if(AUTH_ERR_RE.test(m)){ try{ window.dispatchEvent(new CustomEvent("orbitx-auth-error",{detail:{message:m}})); }catch(x){} return true; }
  return false; }
function friendlyErr(e){ return authFail(e)?"Session expired — reconnect via the OrbitX auth widget, then retry.":String(e.message||e); }
function openUrl(href){ if(!href) return;
  try{
    if(window.openai&&typeof window.openai.openExternal==="function"){ window.openai.openExternal({href}); return; }
    if(window.OrbitX&&typeof window.OrbitX.openUrl==="function"){ window.OrbitX.openUrl(href); return; }
  }catch(e){}
  window.open(href,"_blank","noopener"); }
function standaloneNote(){ const hosted=(window.openai&&window.openai.callTool)||(window.OrbitX&&window.OrbitX.callTool);
  return hosted?"":`<div class="mut" style="text-align:center;font-size:11px;margin-bottom:10px;opacity:.8">⚙ standalone preview — reads work live; writes need the OrbitX bridge</div>`; }
document.addEventListener("click",e=>{
  const a=e.target&&e.target.closest?e.target.closest("a[target='_blank']"):null;
  if(a&&a.href){ e.preventDefault(); openUrl(a.href); } });
window.addEventListener("orbitx-auth-changed",()=>{ if(typeof render==="function") render(); });

/* ================= State ================= */
const S = { tab:"gen",
  genPrompt:"", genAR:"1:1", genState:"idle", genImgs:[], genErr:"", genTask:null, genStarted:0,
  xText:"", xLink:"", xState:"idle", xErr:"", xResult:null,
  lz:{name:"",symbol:"",desc:"",img:"",tw:"",tg:"",web:"",pair:"sol",devBuy:""},
  lzState:"idle", lzErr:"", lzResult:null };

/* ================= Helpers ================= */
const app = document.getElementById("app"), modal=document.getElementById("modal");
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=document.createElement("div");
  t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0d151c;border:1px solid #00ff88;color:#00ff88;padding:10px 18px;border-radius:12px;font-size:13px;z-index:99";
  t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function header(){
  return `<div class="header">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7L12 2z" stroke="#00ff88" stroke-width="2"/><circle cx="12" cy="12" r="3.2" fill="#00ff88"/></svg></div>
    <div class="brand">ORBITX<small>MEDIA STUDIO</small></div>
  </div>`+standaloneNote();
}
function tabsHTML(){
  return `<div class="tabs">
    <div class="tab ${S.tab==="gen"?"on":""}" onclick="S.tab='gen';render()">🎨 Generate</div>
    <div class="tab ${S.tab==="x"?"on":""}" onclick="S.tab='x';render()">𝕏 Post</div>
    <div class="tab ${S.tab==="lz"?"on":""}" onclick="S.tab='lz';render()">🚀 Launch</div>
  </div>`;
}
function closeModal(){ modal.innerHTML=""; }
</script>

<script>
"use strict";
/* ================= Render ================= */
function render(){
  app.innerHTML = header()+tabsHTML()+
    (S.tab==="gen"?genHTML():S.tab==="x"?xHTML():lzHTML());
}
function errBox(e){ return e?`<div class="err">⚠️ ${esc(e)}</div>`:""; }

/* ---------- Generate ---------- */
function genHTML(){
  return `<div class="card glow">
    <label class="fl">Prompt</label>
    <textarea id="gprompt" placeholder="A neon-green astronaut riding a Solana rocket over a cyberpunk city…">${esc(S.genPrompt)}</textarea>
    <label class="fl">Aspect ratio</label>
    <select id="gar">
      ${["1:1","16:9","9:16","4:3","3:4"].map(a=>`<option ${S.genAR===a?"selected":""}>${a}</option>`).join("")}
    </select>
    <div style="height:12px"></div>
    <button class="btn" id="gbtn" onclick="genGo()" ${S.genState==="busy"?"disabled":""}>${S.genState==="busy"?"⏳ Generating…":"🎨 Generate Image"}</button>
    <div class="mut" style="margin-top:8px">Grok Imagine via OrbitX. Quality mode can return ~4 images.</div>
  </div>
  ${errBox(S.genErr)}
  <div id="genout">${genOutHTML()}</div>`;
}
function genOutHTML(){
  if(S.genState==="busy") return `<div class="card"><div class="prog"><i></i></div>
    <div class="mut" style="text-align:center">Dreaming pixels… ${Math.floor((Date.now()-S.genStarted)/1000)}s<br>
    ${S.genTask?`Task <span class="mono">${esc(S.genTask)}</span> — still rendering.`: "Waiting on the image model."}</div></div>`;
  if(S.genState==="done"&&S.genImgs.length) return `<div class="card"><div class="sect" style="margin-top:0">✨ Result — ${S.genImgs.length} image${S.genImgs.length>1?"s":""}</div>
    <div class="imggrid">${S.genImgs.map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" loading="lazy" onerror="this.style.opacity=.3"></a>`).join("")}</div>
    <div class="mut" style="margin-top:8px">Tap an image to open full-size.</div></div>`;
  if(S.genState==="done") return `<div class="empty"><div class="big">🎨</div>Generation finished but no image URLs came back. Try again.</div>`;
  return `<div class="empty"><div class="big">🎨</div>Describe the image — OrbitX renders it live.<br>Nothing here is stock; every render is fresh.</div>`;
}
function extractImgs(r){
  const out=[];
  const push=u=>{ if(typeof u==="string"&&/^https?:\/\//.test(u)&&!out.includes(u)) out.push(u); };
  const walk=o=>{ if(!o) return;
    if(Array.isArray(o)){ o.forEach(walk); return; }
    if(typeof o==="object"){ for(const k of Object.keys(o)){
      const v=o[k];
      if(/url|image|src/i.test(k)&&typeof v==="string") push(v);
      else if(/images|results|outputs/i.test(k)) walk(v);
      else if(typeof v==="object") walk(v);
    } return; } };
  walk(r);
  return out;
}
async function genGo(){
  const p=(document.getElementById("gprompt")||{}).value||"";
  S.genPrompt=p; S.genAR=(document.getElementById("gar")||{}).value||"1:1";
  if(!p.trim()){ S.genErr="Describe the image first."; render(); return; }
  S.genErr=""; S.genImgs=[]; S.genTask=null; S.genState="busy"; S.genStarted=Date.now(); render();
  const tick=setInterval(()=>{ const o=document.getElementById("genout"); if(o&&S.genState==="busy") o.innerHTML=genOutHTML(); },1000);
  try{
    const r=await Bridge.callTool("orbitx_generate_image",
      {prompt:p.trim(), aspect_ratio:S.genAR, wait:true, waitMs:60000, authCode:getAuth()});
    if(r&&(r.ok===false)&&!r.taskId) throw new Error(r.error||r.message||"generation failed");
    S.genTask=r.taskId||r.task_id||null;
    S.genImgs=extractImgs(r);
    if(!S.genImgs.length&&S.genTask){
      S.genErr="Still rendering (task "+S.genTask+"). The model soft-returned a task ID — wait a beat and hit Generate again with the same prompt.";
      S.genState="idle";
    } else if(!S.genImgs.length){
      S.genErr="The model returned no usable images. Try a different prompt.";
      S.genState="idle";
    } else S.genState="done";
  }catch(e){ S.genErr=friendlyErr(e); S.genState="idle"; }
  clearInterval(tick); render();
}

/* ---------- X Post ---------- */
function xHTML(){
  const n=(S.xText||"").length;
  return `<div class="warnbar">𝕏 posts go out on <b>your connected X account</b>. Nothing posts until you hit confirm on the review sheet.</div>
  <div class="card glow">
    <label class="fl">Post text</label>
    <textarea id="xtext" maxlength="2000" placeholder="What's happening in the trenches…" oninput="xCount()">${esc(S.xText)}</textarea>
    <div class="charcount ${n>280?"over":""}" id="xcount">${n} / 280</div>
    <label class="fl">Link (optional)</label>
    <input type="url" id="xlink" placeholder="https://…" value="${esc(S.xLink)}" autocapitalize="off">
    <div style="height:12px"></div>
    <button class="btn" onclick="xReview()" ${S.xState==="busy"?"disabled":""}>${S.xState==="busy"?"⏳ Posting…":"Review & Post →"}</button>
  </div>
  ${errBox(S.xErr)}
  ${S.xResult?`<div class="okbox">✅ <b>Posted.</b> ${S.xResult.url?`<a href="${esc(S.xResult.url)}" target="_blank" style="color:var(--neon)">View on X ↗</a>`:""}
    ${S.xResult.id?`<div class="mut mono" style="margin-top:6px">${esc(String(S.xResult.id))}</div>`:""}</div>`:""}
  <div class="empty" style="padding-top:6px"><span class="mut">Draft stays here until you confirm. Nothing is sent silently.</span></div>`;
}
function xCount(){
  const t=document.getElementById("xtext"), c=document.getElementById("xcount");
  S.xText=t.value; const n=t.value.length;
  c.textContent=n+" / 280"; c.classList.toggle("over",n>280);
}
function xReview(){
  S.xText=(document.getElementById("xtext")||{}).value||"";
  S.xLink=(document.getElementById("xlink")||{}).value||"";
  const t=S.xText.trim();
  if(!t){ S.xErr="Write the post first."; render(); return; }
  if(t.length>280){ S.xErr="Over 280 chars ("+t.length+"). Trim it down."; render(); return; }
  S.xErr="";
  modal.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="sheet">
      <h3>⚠️ Confirm X post</h3>
      <div class="mut">This will post <b>publicly</b> to your connected X account right now. Exact text:</div>
      <div class="previewbox">${esc(t)}${S.xLink.trim()?"\n\n🔗 "+esc(S.xLink.trim()):""}</div>
      <div class="row" style="gap:8px">
        <button class="btn ghost" style="flex:1" onclick="closeModal()">Cancel</button>
        <button class="btn danger" style="flex:1" onclick="xPost()">🚀 Post it</button>
      </div>
    </div></div>`;
}
async function xPost(){
  closeModal(); S.xState="busy"; S.xErr=""; S.xResult=null; render();
  try{
    const args={text:S.xText.trim(), authCode:getAuth()};
    if(S.xLink.trim()) args.linkUrl=S.xLink.trim();
    const r=await Bridge.callTool("orbitx_x_post",args);
    if(r.ok===false) throw new Error(r.error||r.message||"post failed");
    S.xResult={ id:r.tweetId||r.id||r.tweet_id,
      url:r.url||r.tweetUrl||((r.tweetId||r.id)?"https://x.com/i/status/"+(r.tweetId||r.id):null) };
    S.xText=""; S.xLink="";
    toast("Posted to X");
  }catch(e){ S.xErr=friendlyErr(e); }
  S.xState="idle"; render();
}
</script>

<script>
"use strict";
/* ---------- Token Launch ---------- */
function lzHTML(){
  const L=S.lz;
  return `<div class="warnbar">🚀 Launches a <b>real pump.fun token</b> from your connected desk wallet — FREE launch, you only cover gas + mint rent. Auto vanity CA ending <b>obx</b>. Nothing launches until you pass the confirmation gate.</div>
  <div class="card glow">
    <div class="row" style="gap:8px">
      <div style="flex:1"><label class="fl">Name *</label><input type="text" id="lzname" placeholder="OrbitCat" value="${esc(L.name)}" maxlength="32"></div>
      <div style="width:110px"><label class="fl">Symbol *</label><input type="text" id="lzsym" placeholder="OCAT" value="${esc(L.symbol)}" maxlength="10" style="text-transform:uppercase"></div>
    </div>
    <label class="fl">Description</label>
    <textarea id="lzdesc" style="min-height:70px" placeholder="What is this coin about?">${esc(L.desc)}</textarea>
    <label class="fl">Image URL</label>
    <input type="url" id="lzimg" placeholder="https://…/logo.png" value="${esc(L.img)}" autocapitalize="off">
    <div class="row" style="gap:8px">
      <div style="flex:1"><label class="fl">Twitter</label><input type="text" id="lztw" placeholder="@handle or URL" value="${esc(L.tw)}"></div>
      <div style="flex:1"><label class="fl">Telegram</label><input type="text" id="lztg" placeholder="t.me/…" value="${esc(L.tg)}"></div>
    </div>
    <label class="fl">Website</label>
    <input type="url" id="lzweb" placeholder="https://…" value="${esc(L.web)}" autocapitalize="off">
    <div class="row" style="gap:8px">
      <div style="flex:1"><label class="fl">Pair</label><select id="lzpair">
        <option value="sol" ${L.pair==="sol"?"selected":""}>SOL</option>
        <option value="usdc" ${L.pair==="usdc"?"selected":""}>USDC</option></select></div>
      <div style="flex:1"><label class="fl">Dev buy (SOL)</label><input type="number" id="lzdev" placeholder="0.1" step="0.01" min="0" value="${esc(L.devBuy)}"></div>
    </div>
    <div style="height:14px"></div>
    <button class="btn" onclick="lzReview()" ${S.lzState==="busy"?"disabled":""}>${S.lzState==="busy"?"⏳ Launching…":"Review Launch →"}</button>
  </div>
  ${errBox(S.lzErr)}
  ${S.lzResult?lzDoneHTML():""}
  <div class="empty" style="padding-top:6px"><span class="mut">Schema check: <span class="mono">orbitx_app_launch</span> is live and permitted — the gate below is the only thing between you and mainnet.</span></div>`;
}
function lzRead(){
  const L=S.lz, g=id=>((document.getElementById(id)||{}).value||"").trim();
  L.name=g("lzname"); L.symbol=g("lzsym").toUpperCase(); L.desc=g("lzdesc");
  L.img=g("lzimg"); L.tw=g("lztw"); L.tg=g("lztg"); L.web=g("lzweb");
  L.pair=g("lzpair")||"sol"; L.devBuy=g("lzdev");
}
function lzReview(){
  lzRead(); const L=S.lz;
  if(!L.name||!L.symbol){ S.lzErr="Name and symbol are required."; render(); return; }
  S.lzErr="";
  modal.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="sheet">
      <h3>🚨 Final gate — real mainnet launch</h3>
      <div class="warnbar">You are about to deploy a <b>live token on Solana mainnet</b> from your desk wallet. This costs gas + mint rent, cannot be undone, and the token will be publicly tradable.</div>
      <div class="kv"><span class="k">Name</span><b>${esc(L.name)}</b></div>
      <div class="kv"><span class="k">Symbol</span><b>$${esc(L.symbol)}</b></div>
      <div class="kv"><span class="k">Pair</span><b>${esc(L.pair.toUpperCase())}</b></div>
      <div class="kv"><span class="k">Dev buy</span><b>${esc(L.devBuy||"0")} SOL</b></div>
      <div class="kv"><span class="k">Vanity CA</span><b>ends in …obx</b></div>
      ${L.desc?`<div class="kv"><span class="k">About</span><span style="text-align:right;max-width:60%">${esc(L.desc)}</span></div>`:""}
      <div style="height:12px"></div>
      <div class="row" style="gap:8px">
        <button class="btn ghost" style="flex:1" onclick="closeModal()">Not yet</button>
        <button class="btn danger" style="flex:1" onclick="lzGo()">🚀 LAUNCH IT</button>
      </div>
    </div></div>`;
}
async function lzGo(){
  closeModal(); S.lzState="busy"; S.lzErr=""; S.lzResult=null; render();
  try{
    const L=S.lz, args={name:L.name, symbol:L.symbol, authCode:getAuth()};
    if(L.desc) args.description=L.desc;
    if(L.img) args.imageUrl=L.img;
    if(L.tw) args.twitter=L.tw;
    if(L.tg) args.telegram=L.tg;
    if(L.web) args.website=L.web;
    args.pair=L.pair||"sol";
    if(L.devBuy&&Number(L.devBuy)>0) args.devBuySol=Number(L.devBuy);
    const r=await Bridge.callTool("orbitx_app_launch",args);
    if(r.ok===false) throw new Error(r.error||r.message||"launch failed");
    S.lzResult={ mint:r.mint||r.tokenMint||r.ca, sig:r.signature||r.tx||r.txSignature,
      url:r.url||r.dexscreener||((r.mint||r.ca)?"https://dexscreener.com/solana/"+(r.mint||r.ca):null) };
    toast("Token launched 🚀");
  }catch(e){ S.lzErr=friendlyErr(e); }
  S.lzState="idle"; render();
}
function lzDoneHTML(){
  const r=S.lzResult;
  return `<div class="okbox">✅ <b>Launched on mainnet.</b>
    ${r.mint?`<div class="kv"><span class="k">Mint</span><span class="mono">${esc(r.mint)}</span></div>`:""}
    ${r.sig?`<div class="kv"><span class="k">Tx</span><a href="https://solscan.io/tx/${esc(r.sig)}" target="_blank" style="color:var(--neon2)">Solscan ↗</a></div>`:""}
    ${r.url?`<div style="margin-top:8px"><a href="${esc(r.url)}" target="_blank" style="color:var(--neon)">View chart ↗</a></div>`:""}
  </div>`;
}
/* ---------- Boot ---------- */
render();
</script>
</body>
</html>
