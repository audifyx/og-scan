<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OrbitX Token Explorer</title>
<!--
  OrbitX ChatGPT Mini App — Token Explorer + Discovery + Security
  resourceUri: ui://widget/orbitx-token.html
  Bridge: window.OrbitX.callTool(name, args) when hosted in the OrbitX bridge,
          else standalone fallback POSTs to https://www.orbitx.world/api/mcp
  Tools: orbitx_search, orbitx_crypto_scan, orbitx_screen_tokens,
         orbitx_get_forensics, orbitx_dex_chart, orbitx_get_chart,
         orbitx_leaderboard, orbitx_platform_stats (#22 Leaderboards tab)
  Charts: OrbitX OHLC hero (real candles from orbitx_get_chart, 1m/5m/15m/1h/4h/1d
          re-query) + DexScreener preview card (server-verified pairAddress/embedUrl/pageUrl
          from orbitx_dex_chart; embed iframe is user-gated, never auto-rendered in the
          Apps SDK sandbox) + TradingView (tab shown only for mapped major symbols).
          Never drawn approximations, never a dead/blank iframe.
-->
<style>
:root{
  --bg:#04070a; --panel:#0a0f14; --panel2:#0d141b; --line:#14202a;
  --neon:#17ff4d; --neon2:#00d4ff; --dim:#8fa3b3; --txt:#eaf4ee;
  --red:#ff4d5e; --amber:#ffb02e; --violet:#b06bff;
  --r:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  min-height:100vh}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(600px 300px at 15% -5%, rgba(23,255,77,.09), transparent 60%),
   radial-gradient(700px 380px at 90% 10%, rgba(0,212,255,.07), transparent 60%),
   radial-gradient(500px 500px at 50% 110%, rgba(23,255,77,.05), transparent 60%);}
#app{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:14px 14px 60px}
.header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.logo img.oxlogo{width:30px;height:30px;border-radius:8px;filter:drop-shadow(0 0 8px rgba(23,255,77,.7))}
.brand{font-weight:800;letter-spacing:2px;font-size:17px}
.brand small{display:block;font-size:9px;letter-spacing:3px;color:var(--neon);font-weight:600}
.back{margin-left:auto;background:#0d151c;border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:14px;position:sticky;top:0;z-index:5;
  background:rgba(4,7,10,.9);backdrop-filter:blur(10px);padding:8px 0}
.tab{flex:1;text-align:center;padding:10px 6px;border-radius:12px;font-size:13px;font-weight:700;
  background:var(--panel);border:1px solid var(--line);color:var(--dim);cursor:pointer;letter-spacing:.5px}
.tab.on{background:rgba(23,255,77,.1);border-color:var(--neon);color:var(--neon);
  box-shadow:0 0 14px rgba(23,255,77,.25)}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;
  box-shadow:0 6px 24px rgba(0,0,0,.4)}
.card.glow{border-color:rgba(23,255,77,.4);box-shadow:0 0 20px rgba(23,255,77,.12)}
.row{display:flex;align-items:center;gap:10px}
.mut{color:var(--dim);font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
input[type=text],input[type=url],input[type=number],textarea,select{
  width:100%;background:#080d12;border:1px solid var(--line);border-radius:12px;
  color:var(--txt);padding:12px 14px;font-size:15px;outline:none}
input:focus,textarea:focus{border-color:var(--neon);box-shadow:0 0 0 2px rgba(23,255,77,.2)}
.btn{background:linear-gradient(135deg,#17ff4d,#00c86e);border:0;color:#03130b;font-weight:800;
  border-radius:12px;padding:13px 16px;font-size:15px;cursor:pointer;width:100%;letter-spacing:.5px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#0d151c;color:var(--neon);border:1px solid var(--neon)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px}
.searchbar{display:flex;gap:8px;margin-bottom:12px}
.searchbar .btn{width:auto;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);font-size:13px;font-weight:600;cursor:pointer}
.chip.on{border-color:var(--neon);color:var(--neon);background:rgba(23,255,77,.08)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#080d12;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat .v{font-size:15px;font-weight:800;color:var(--txt)}
.stat .v.up{color:var(--neon)} .stat .v.down{color:var(--red)}

.tokenrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;

.ticon{width:42px;height:42px;border-radius:50%;background:#0d151c;border:1px solid var(--line);

  color:var(--neon);flex-shrink:0;overflow:hidden}

.tname{font-weight:700;font-size:15px}
.tsym{color:var(--dim);font-size:12px}
.tprice{margin-left:auto;text-align:right;font-weight:800}
.tchg{font-size:12px;font-weight:700}
.up{color:var(--neon)} .down{color:var(--red)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.5px}
.badge.good{background:rgba(23,255,77,.12);color:var(--neon);border:1px solid rgba(23,255,77,.4)}
.badge.warn{background:rgba(255,176,46,.12);color:var(--amber);border:1px solid rgba(255,176,46,.4)}
.badge.bad{background:rgba(255,77,94,.12);color:var(--red);border:1px solid rgba(255,77,94,.4)}
.badge.info{background:rgba(0,212,255,.1);color:var(--neon2);border:1px solid rgba(0,212,255,.35)}
.score{width:54px;height:54px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;border:3px solid var(--neon);
  box-shadow:0 0 12px rgba(23,255,77,.35);background:#080d12}
.skel{position:relative;overflow:hidden;background:#0d141b;border-radius:12px;min-height:18px}
.skel::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(23,255,77,.08),transparent);
  animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.err{background:rgba(255,77,94,.08);border:1px solid rgba(255,77,94,.4);border-radius:14px;
  padding:14px;color:#ffb9c0;font-size:14px;margin-bottom:12px}
.empty{text-align:center;padding:34px 18px;color:var(--dim);font-size:14px}
.empty .big{font-size:40px;margin-bottom:10px}
.stale{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);margin-top:10px}
.stale button{background:none;border:1px solid var(--line);color:var(--neon);border-radius:8px;
  padding:4px 10px;font-size:11px;cursor:pointer}
.sect{font-size:12px;letter-spacing:2px;color:var(--neon);font-weight:800;margin:16px 0 8px;text-transform:uppercase}
.frow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #0f1720;font-size:14px}
.frow:last-child{border-bottom:0}
.frow .k{color:var(--dim)}
.frow .val{text-align:right;font-weight:600;word-break:break-all}
.disclaim{background:rgba(255,176,46,.07);border:1px solid rgba(255,176,46,.35);border-radius:14px;
  padding:12px 14px;font-size:12.5px;color:#ffd9a0;margin-bottom:12px;line-height:1.5}
.chartwrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000;margin-top:10px}
.chartwrap.hero{min-height:480px}
.chartwrap iframe{width:100%;height:480px;border:0;display:block}
.tfx{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.tfx .lbl{font-size:11px;color:var(--dim);letter-spacing:1px;margin-right:2px}
.tfx .chip{padding:7px 12px;font-size:12px}
.dexprev{padding:16px}
.bigpx{font-size:24px;font-weight:800}
.chartbtn{background:#0d151c;border:1px solid var(--line);border-radius:10px;color:var(--neon);
  font-size:15px;padding:8px 10px;cursor:pointer;flex-shrink:0}
.chartbtn:active{transform:scale(.95)}
.ctabs{display:flex;gap:6px;margin-top:10px}
.ctab{flex:1;padding:9px 4px;font-size:12px;font-weight:700;text-align:center;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);color:var(--dim);cursor:pointer}
.ctab.on{color:var(--neon);border-color:var(--neon);background:rgba(23,255,77,.07)}
#ohlcCanvas{width:100%;height:440px;display:block;background:#05080b}
.copybtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;
  padding:2px 8px;font-size:11px;cursor:pointer;margin-left:6px}
.copybtn:active{color:var(--neon);border-color:var(--neon)}
/* UI polish: smooth transitions, press feedback, fade-in */
.card,.tcard,.toolrow,.qbtn,.stat{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:hover,.tcard:hover{border-color:rgba(23,255,77,.25)}
button{transition:transform .12s ease,opacity .12s ease,border-color .15s ease}
button:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card,.tcard{animation:fadeUp .32s ease both}
@media (prefers-reduced-motion:reduce){.card,.tcard{animation:none}}
/* Analyst + Research screens */
.conv{font-size:11px;font-weight:800;letter-spacing:1px;padding:4px 10px;border-radius:999px;border:1px solid;white-space:nowrap}
.conv.high{color:#ff6b7a;border-color:rgba(255,77,94,.5);background:rgba(255,77,94,.1)}
.conv.medium{color:var(--amber);border-color:rgba(255,176,46,.5);background:rgba(255,176,46,.1)}
.conv.low{color:#c8d6e0;border-color:rgba(200,214,224,.4);background:rgba(200,214,224,.07)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.pcell{background:#080d12;border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.pcell .l{font-size:10px;color:var(--dim);letter-spacing:1px}
.pcell .v{font-size:14px;font-weight:800;margin-top:3px}
.verdict{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;margin-bottom:12px;border:1px solid}
.verdict.buy{background:rgba(23,255,77,.08);border-color:rgba(23,255,77,.5)}
.verdict.wait{background:rgba(255,176,46,.08);border-color:rgba(255,176,46,.5)}
.verdict.avoid{background:rgba(255,77,94,.08);border-color:rgba(255,77,94,.5)}
.verdict .word{font-size:26px;font-weight:900;letter-spacing:2px}
.verdict.buy .word{color:var(--neon)} .verdict.wait .word{color:var(--amber)} .verdict.avoid .word{color:var(--red)}
.meter{height:10px;border-radius:999px;background:#0d151c;overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#00c86e,#17ff4d)}
.reasons{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.6;color:#cfe0d2}
.reasons li{margin-bottom:4px}
.wrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #0f1720;font-size:13px}
.wrow:last-child{border-bottom:0}
.dotpulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--neon);margin-right:6px;animation:pl 1.4s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dotpulse{animation:none}}
.bigstart{font-size:17px;padding:16px}
</style>

<body>
<div id="bgfx"></div>
<div id="app"></div>
<script>
"use strict";
/* ================= Bridge (CONTRACT.md v1) ================= */
const MCP_URL = "https://www.orbitx.world/api/mcp";
/* Unwrap an MCP CallToolResult envelope into the tool's data. Bridge calls
   (window.openai / window.OrbitX) return the raw envelope
   {content:[...], structuredContent} — callers expect the data itself. */
function unwrapToolResult(r){
  if(!r || typeof r!=="object") return r;
  if(r.isError){
    const t=Array.isArray(r.content)?r.content.find(c=>c&&c.type==="text"&&typeof c.text==="string"):null;
    throw new Error((t&&t.text)||"tool error");
  }
  if(r.structuredContent && typeof r.structuredContent==="object") return r.structuredContent;
  if(Array.isArray(r.content) && r.content.length && r.content[0] && (r.content[0].type==="text"||r.content[0].type==="resource")){
    const t=r.content.find(c=>c&&c.type==="text"&&typeof c.text==="string");
    if(t){ try{ return JSON.parse(t.text); }catch(e){ return t.text; } }
    return r.content;
  }
  return r;
}

const Bridge = {
  async callTool(name, args){
    if (window.openai && typeof window.openai.callTool === "function"){
      return unwrapToolResult(await window.openai.callTool(name, args));
    }
    if (window.OrbitX && typeof window.OrbitX.callTool === "function"){
      return unwrapToolResult(await window.OrbitX.callTool(name, args)); // hosted bridge (CONTRACT.md)
    }
    // standalone fallback: POST MCP JSON-RPC directly (no bridge).
    // Sends Accept for both plain JSON and SSE; parses either.
    const res = await fetch(MCP_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json, text/event-stream"},
      body: JSON.stringify({jsonrpc:"2.0", id:"t"+Date.now()+Math.floor(Math.random()*999), method:"tools/call",
        params:{name, arguments:args||{}}})
    });
    if(!res.ok) throw new Error("MCP HTTP "+res.status);
    const raw = await res.text();
    let j;
    try{
      const lines = raw.split(/\r?\n/).filter(l=>l.indexOf("data:")===0);
      j = JSON.parse((lines.length?lines[lines.length-1].slice(5):raw).trim());
    }catch(e){ throw new Error("bad MCP response"); }
    if(j.error) throw new Error(j.error.message||"tool error");
    const r = j.result||{};
    if(r.structuredContent) return r.structuredContent;
    const content = r.content;
    if(Array.isArray(content)){
      const t = content.find(c=>c.type==="text");
      if(t){ try{ return JSON.parse(t.text); }catch(e){ return t.text; } }
      return content;
    }
    return r;
  }
};
/* Auth: contract key `orbitx.authCode` (legacy `orbitx_auth_code` still read) */
const AUTH_KEYS = ["orbitx.authCode","orbitx_auth_code"];
const getAuth = ()=>{ try{ for(const k of AUTH_KEYS){ const v=localStorage.getItem(k); if(v) return v; } }catch(e){} return ""; };
const AUTH_ERR_RE=/auth|unauthor|expir|invalid code|session|forbidden|not (linked|connected|signed)|sign.?in|token|credential/i;
function authFail(e){ const m=String((e&&e.message)||e||"");
  if(AUTH_ERR_RE.test(m)){ try{ window.dispatchEvent(new CustomEvent("orbitx-auth-error",{detail:{message:m}})); }catch(x){} return true; }
  return false; }
function setErr(e){ if(authFail(e)) S.error="Session expired — reconnect via the OrbitX auth widget, then retry.";
  else S.error=String(e.message||e); }
function openUrl(href){ if(!href) return;
  try{
    if(window.openai&&typeof window.openai.openExternal==="function"){ window.openai.openExternal({href}); return; }
    if(window.OrbitX&&typeof window.OrbitX.openUrl==="function"){ window.OrbitX.openUrl(href); return; }
  }catch(e){}
  window.open(href,"_blank","noopener"); }
function standaloneNote(){ const hosted=(window.openai&&window.openai.callTool)||(window.OrbitX&&window.OrbitX.callTool);
  return hosted?"":`<div class="mut" style="text-align:center;font-size:11px;margin-bottom:10px;opacity:.8">⚙ standalone mode — reads live · paste your authCode from the Auth widget to enable writes</div>`; }
document.addEventListener("click",e=>{
  const a=e.target&&e.target.closest?e.target.closest("a[target='_blank']"):null;
  if(a&&a.href){ e.preventDefault(); openUrl(a.href); } });
window.addEventListener("orbitx-auth-changed",()=>{ if(typeof render==="function") render(); });

/* ================= State ================= */
const S = { screen:"explore", q:"", results:[], token:null, mint:null,
  discType:"trending", discInterval:"1h", disc:[], forensics:null,
  chartTab:"ohlc", tf:"1h", ohlc:null, dexInfo:null, tvSym:null,
  dexEmbedded:false, chartScroll:false, sparkQ:false,
  fetchedAt:0, error:"", loading:false, lastQ:"", copied:false,
  boardSub:"traders", lb:null, lbTokens:[], lbStats:null, lbExpanded:null,
  whales:[], whaleAddr:"", whaleMin:"10000", whaleData:null, whaleBusy:false,
  alerts:[], alMint:"", alCond:"above", alPrice:"", alertBusy:false, alertTimer:null,
  analyst:{running:false,minConviction:"medium",calls:[],track:[],timer:null,busy:false},
  research:{mint:"",report:null,loading:false,depth:"full"} };
/* Timeframes (re-query orbitx_get_chart / orbitx_dex_chart) */
const TF_LIST=["1m","5m","15m","1h","4h","1d"];
/* TradingView only lists major pairs — arbitrary mints render TV's own
   "invalid symbol" state, so the tab is hidden unless we map a real symbol. */
const TV_MAP={SOL:"COINBASE:SOLUSD",USDC:"CRYPTO:USDCUSD",USDT:"CRYPTO:USDTUSD",
  BTC:"COINBASE:BTCUSD",ETH:"COINBASE:ETHUSD"};

/* ================= Helpers ================= */
const app = document.getElementById("app");
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n,d)=>{ if(n==null||n===""||isNaN(Number(n))) return "—";
  const x=Number(n); const neg=x<0?"-":""; const a=Math.abs(x);
  const s = a>=1e9?(a/1e9).toFixed(2)+"B":a>=1e6?(a/1e6).toFixed(2)+"M":
    a>=1e3?(a/1e3).toFixed(2)+"K":a.toFixed(d!=null?d:(a<1?6:2));
  return neg+s; };
const fmtUSD = n=>{ if(n==null||isNaN(Number(n))) return "—"; const x=Number(n);
  return x<0.01&&x>0 ? "$"+Math.abs(x).toExponential(2) : (x<0?"-$":"$")+fmt(Math.abs(x)); };
const fmtPct = n=>{ if(n==null||isNaN(Number(n))) return "—";
  const x=Number(n); return (x>=0?"+":"")+x.toFixed(2)+"%"; };
const pctCls = n=>Number(n)>=0?"up":"down";
const shortMint = m=>m&&m.length>10?m.slice(0,4)+"…"+m.slice(-4):esc(m||"");
const looksMint = q=>/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test((q||"").trim());
const ago = ts=>{ if(!ts) return "—"; const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+"s ago"; if(s<3600) return Math.floor(s/60)+"m ago";
  return Math.floor(s/3600)+"h ago"; };
const timeHM = ts=>ts?new Date(ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}):"—";
function staleBar(){ return S.fetchedAt?
  `<div class="stale"><span>🕐 Updated ${esc(timeHM(S.fetchedAt))} (${esc(ago(S.fetchedAt))})</span>
   <button onclick="refreshCurrent()">↻ Refresh</button></div>`:""; }

function toast(msg){ const t=document.createElement("div");
  t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0d151c;border:1px solid #17ff4d;color:#17ff4d;padding:10px 18px;border-radius:12px;font-size:13px;z-index:99";
  t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }

<script>
"use strict";
/* ================= Screens ================= */
function goBack(){ S.screen="explore"; render(); }
function render(){
  if(S.screen==="explore") renderExplore();
  else if(S.screen==="discover") renderDiscover();
  else if(S.screen==="boards") renderBoards();
  else if(S.screen==="whales") renderWhales();
  else if(S.screen==="alerts") renderAlerts();
  else if(S.screen==="analyst") renderAnalyst();
  else if(S.screen==="research") renderResearch();
  else if(S.screen==="token") renderToken();
}
function tabsHTML(){
  return `<div class="tabs">
    <div class="tab ${S.screen==="explore"?"on":""}" onclick="S.screen='explore';render()">🔍 Explore</div>
    <div class="tab ${S.screen==="discover"?"on":""}" onclick="S.screen='discover';render();loadDiscover()">🔥 Discover</div>
    <div class="tab ${S.screen==="boards"?"on":""}" onclick="S.screen='boards';render();loadBoards()">🏆 Boards</div>
    <div class="tab ${S.screen==="whales"?"on":""}" onclick="S.screen='whales';render();loadWhales()">🐋 Whales</div>
    <div class="tab ${S.screen==="alerts"?"on":""}" onclick="S.screen='alerts';render();loadAlerts()">🔔 Alerts</div>
    <div class="tab ${S.screen==="analyst"?"on":""}" onclick="S.screen='analyst';render();analystInit()">📊 Analyst</div>
    <div class="tab ${S.screen==="research"?"on":""}" onclick="S.screen='research';render()">🔬 Research</div>
    <div class="tab ${S.token?"":""}" style="${S.token?"":"opacity:.35;pointer-events:none"}" onclick="S.screen='token';render()">🪙 Token</div>
  </div>`;
}
function skelRows(n){ let h=""; for(let i=0;i<n;i++)
  h+=`<div class="skel" style="height:66px;margin-bottom:8px"></div>`; return h; }
function errHTML(){ return S.error?`<div class="err">⚠️ ${esc(S.error)}
  <div style="margin-top:8px"><button class="btn sm ghost" onclick="retryLast()">Retry</button></div></div>`:""; }
function retryLast(){
  if(S.screen==="token"&&S.mint) inspect(S.mint,true);
  else if(S.screen==="discover") loadDiscover();
  else if(S.screen==="boards") loadBoards();
  else if(S.screen==="analyst") analystTick();
  else if(S.screen==="research"&&S.research.mint) doResearch(S.research.mint);
  else if(S.lastQ) doSearch(S.lastQ);
}

/* ---------- Explore ---------- */
function renderExplore(){
  app.innerHTML = header(false,"TOKEN EXPLORER")+tabsHTML()+`
  <div class="searchbar">
    <input type="text" id="q" placeholder="Search name, symbol or paste mint…" value="${esc(S.q)}"
      onkeydown="if(event.key==='Enter')doSearch()" autocapitalize="off" spellcheck="false">
    <button class="btn" onclick="doSearch()">Scan</button>
  </div>
  <div class="chips">
    <div class="chip" onclick="quickScan('So11111111111111111111111111111111111111112')">SOL</div>

<script>
"use strict";
/* ---------- Inspect (scan + forensics) ---------- */
async function inspect(mint, force){

  S.error=""; S.loading=true; S.fetchedAt=0; renderToken();
  try{
    const r=await Bridge.callTool("orbitx_crypto_scan",{mint, authCode:getAuth()});
    if(r.ok===false) throw new Error(r.error||r.message||"scan failed");
    S.token=r; S.fetchedAt=Date.now();

    try{ const tk2=(r.token&&r.token.token)||r.token||{};
      S.tvSym=TV_MAP[String(tk2.symbol||"").toUpperCase()]||null; }catch(e){ S.tvSym=null; }

  S.loading=false; renderToken();
}
function refreshCurrent(){ if(S.screen==="token"&&S.mint) inspect(S.mint,true); }

/* Server-verified DexScreener data: pairAddress/embedUrl/pageUrl/priceUsd/change24h.

async function loadDexInfo(mint){
  try{
    const r=await Bridge.callTool("orbitx_dex_chart",{ca:mint,interval:S.tf,authCode:getAuth()});
    if(S.mint!==mint) return; /* user moved on */

      S.dexInfo=r;
      if(S.chartTab==="dex") paintChart();
      else { const pa=document.getElementById("pairaddr");
        if(pa) pa.textContent=(r.dex||"dex")+" · "+String(r.pairAddress).slice(0,8)+"…"; }
    }
  }catch(e){ /* dex preview degrades to scan pair data */ }
}
/* Per-row "chart" affordance: open the dossier straight at the chart hero */
function openChart(mint,ev){ if(ev&&ev.stopPropagation) ev.stopPropagation();

/* ---------- Token screen ---------- */
function renderToken(){

  const score=t&&t.token?t.token.score:null;
  app.innerHTML = header(true,"TOKEN DOSSIER")+tabsHTML()+errHTML()+(S.loading?tokenSkel():tokenHTML(t,tk,meta,score))+staleBar();
  if(!S.loading&&t) paintChart();
  if(S.chartScroll){ S.chartScroll=false;
    const el=document.getElementById("chartsect");
    if(el) setTimeout(()=>{ try{el.scrollIntoView({behavior:"smooth",block:"start"});}catch(e){} },80); }
}
function tokenSkel(){
  return `<div class="card glow"><div class="skel" style="height:120px"></div></div>
  <div class="card"><div class="skel" style="height:90px"></div></div>
  <div class="card"><div class="skel" style="height:300px"></div></div>`;
}
function verdictBadge(v){
  v=String(v||"").toLowerCase();
  if(/good|safe|strong|high/.test(v)) return `<span class="badge good">${esc(v.toUpperCase()||"—")}</span>`;
  if(/warn|caution|medium|mixed/.test(v)) return `<span class="badge warn">${esc(v.toUpperCase())}</span>`;
  if(/bad|risk|danger|scam|avoid|rugged/.test(v)) return `<span class="badge bad">${esc(v.toUpperCase())}</span>`;
  return `<span class="badge info">${esc(v.toUpperCase()||"UNKNOWN")}</span>`;
}
function bestPair(t){
  const pairs=(t&&t.token&&t.token.pairs)||[];
  if(!pairs.length) return null;

}
function tokenHTML(t,tk,meta,score){

          <button class="copybtn" onclick="navigator.clipboard.writeText('${esc(tk.mint)}');toast('Mint copied')">copy</button></div>
        <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${verdictBadge(t.token.verdict)}
          ${tk.isVerified?'<span class="badge info">✓ VERIFIED</span>':""}
          ${tk.organicScoreLabel?`<span class="badge info">ORGANIC: ${esc(String(tk.organicScoreLabel).toUpperCase())}</span>`:""}</div>
      </div>

    </div>
    <div class="row" style="margin-top:12px;align-items:baseline">

    <div class="statgrid">
      <div class="stat"><div class="v">${fmtUSD(tk.mcap)}</div><div class="l">Mkt Cap</div></div>

    </div>
    <div id="chartbox" class="chartwrap hero"></div>
    <div class="mut" style="margin-top:6px">Pair: <span class="mono" id="pairaddr">resolving…</span></div>
  </div>

  <div class="sect">🔬 Forensics</div>
  <div class="card">${forensicsHTML(t,foren,sf)}</div>

  <div class="sect">📊 Market Intel</div>
  <div class="card">
    ${frow("FDV",fmtUSD(tk.fdv))}${frow("Circ Supply",fmt(tk.circSupply))}${frow("Total Supply",fmt(tk.totalSupply))}
    ${frow("Buy Vol 24h",fmtUSD(tk.buyVolume))}${frow("Sell Vol 24h",fmtUSD(tk.sellVolume))}
    ${frow("Traders 24h",fmt(tk.numTraders))}${frow("Net Buyers",fmt(tk.netBuyers))}
    ${frow("ATH Price",fmtUSD(t.athPrice||t.token.athPrice))}${frow("Age",tk.ageDays!=null?tk.ageDays+" days":"—")}
    ${frow("Chain","solana")}${frow("Token Program","<span class='mono'>"+shortMint(tk.tokenProgram)+"</span>",true)}

}
function frow(k,v,raw){ return `<div class="frow"><div class="k">${esc(k)}</div><div class="val">${raw?v:esc(v)}</div></div>`; }

/* Forensics: VERIFIED vs RISK vs MISSING — never promise safety */
function forensicsHTML(t,foren,sf){
  const v=[], r=[], m=[];
  const chk=(label,val,ok)=>{ if(val==null||val===""||val===false&&ok===false) m.push(label);
    else v.push([label, val]); };
  chk("Dev wallet", foren.dev?'<span class="mono">'+shortMint(foren.dev)+"</span>":null, true);
  chk("First buyer", foren.firstBuyer?'<span class="mono">'+shortMint(foren.firstBuyer)+"</span>":null, true);
  if(foren.concentration){
    const c=foren.concentration;
    if(c.top10Pct!=null) v.push(["Top-10 holders", Number(c.top10Pct).toFixed(1)+"%"]);
    else m.push("Top-10 concentration");
    if(c.totalHolders!=null) v.push(["Total holders", fmt(c.totalHolders)]); else m.push("Holder count");
  } else m.push("Concentration data");
  if(sf.lpLockedPct!=null) v.push(["LP locked", Number(sf.lpLockedPct).toFixed(1)+"%"]); else m.push("LP lock %");
  if(sf.mintRenounced!=null) v.push(["Mint authority", sf.mintRenounced?"renounced ✓":"NOT renounced"]); else m.push("Mint authority");
  if(sf.freezeRenounced!=null) v.push(["Freeze authority", sf.freezeRenounced?"renounced ✓":"NOT renounced"]); else m.push("Freeze authority");
  if(sf.rugged!=null) r.push(["Rugged flag", sf.rugged?"⚠️ TRUE — treat as rugged":"not flagged"]);
  if(foren.bundledPct!=null||foren.bundles!=null) v.push(["Bundled supply", (foren.bundledPct??foren.bundles)+"%"]); else m.push("Bundle data");
  if(sf.riskScore!=null) v.push(["Risk score", sf.riskScore+"/100"]);
  if(t.safety){ const s=t.safety;
    if(s.canBuy===false||s.canSell===false) r.push(["Trade route", "⚠️ "+esc(s.note||"no route found — honeypot risk")]);
    if(s.verdict) v.push(["Route verdict", esc(s.verdict)]);
  }
  if(foren.isPumpFun!=null) v.push(["Pump.fun", foren.isPumpFun?(foren.bondingComplete?"bonded ✓":"bonding…"):"no"]);
  let h=`<div class="frow"><div class="k" style="color:var(--neon);font-weight:800">✅ VERIFIED DATA</div><div class="val"></div></div>`;
  h+= v.length? v.map(x=>`<div class="frow"><div class="k">${esc(x[0])}</div><div class="val">${x[1]}</div></div>`).join("")
    : `<div class="mut" style="padding:8px 0">No verified datapoints returned.</div>`;
  h+=`<div class="frow" style="margin-top:8px"><div class="k" style="color:var(--amber);font-weight:800">⚠️ RISK INDICATORS</div><div class="val"></div></div>`;
  h+= r.length? r.map(x=>`<div class="frow"><div class="k">${esc(x[0])}</div><div class="val" style="color:var(--amber)">${x[1]}</div></div>`).join("")
    : `<div class="mut" style="padding:8px 0">No explicit risk flags — <b>absence of flags is not proof of safety</b>.</div>`;
  h+=`<div class="frow" style="margin-top:8px"><div class="k" style="color:var(--dim);font-weight:800">❓ MISSING INFO</div><div class="val"></div></div>`;
  h+= m.length? `<div class="mut" style="padding:8px 0">Not reported by scanners: ${m.map(esc).join(", ")}. Treat gaps as unknown risk.</div>`
    : `<div class="mut" style="padding:8px 0">Full coverage.</div>`;
  return h;
}

/* ---------- Charts ---------- */
function setChartTab(t){ S.chartTab=t; renderToken(); }
function setTF(tf){ S.tf=tf; S.ohlc=null; S.sparkQ=false;
  S.dexInfo=null; S.dexEmbedded=false;           /* re-resolve dex embed at the new interval */

function paintChart(){

/* OrbitX OHLC hero — real candles from orbitx_get_chart, re-queried per timeframe */
function paintOHLCBox(box){

    <canvas id="ohlcCanvas" style="display:none"></canvas><div class="mut" id="ohlcmsg" style="margin-top:6px"></div></div>`;

}
/* DexScreener tab — honest preview card FIRST (real data), embed only on user tap.
   Never auto-renders a possibly-blocked iframe in the Apps SDK sandbox. */
function paintDex(box,tk,pair,dx){
  if(true){ // auto-render embedded chart — user wants real embeds, not gated previews

      sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
      <div style="padding:10px 14px 14px">
        <button class="btn sm ghost" style="width:100%" onclick="openUrl('${esc(page)}')">Open live chart ↗</button>
      </div>`;
    return;
    }
  }
  const addr=pair&&pair.address;
  const page=dx&&dx.pageUrl?dx.pageUrl:(addr?"https://dexscreener.com/solana/"+addr:"https://dexscreener.com");
  const px=dx&&dx.priceUsd!=null?dx.priceUsd:tk.priceUsd;
  const ch=dx&&dx.change24h!=null?dx.change24h:tk.change24h;
  box.innerHTML=`<div class="dexprev">
    <div class="row" style="justify-content:space-between">
      <div><div class="mut">LAST PRICE</div><div class="bigpx">${fmtUSD(px)}</div></div>
      <div style="text-align:right"><div class="mut">24H</div>
        <div class="bigpx ${pctCls(ch)}">${fmtPct(ch)}</div></div>
    </div>
    <canvas id="dexspark" style="width:100%;height:90px;margin:10px 0;display:block"></canvas>
    <div class="mut mono" style="margin-bottom:10px">Pair ${addr?esc(String(addr)):"—"} · ${dx?"verified via OrbitX dex feed":"resolving via OrbitX dex feed…"}</div>
    <button class="btn" style="margin-bottom:8px" onclick="openUrl('${esc(page)}')">Open live chart ↗</button>
    ${addr?`<button class="btn ghost" onclick="toggleDexEmbed()">Try embedded chart</button>`
      :`<div class="mut">No pair address yet — live link still works.</div>`}
    <div class="mut" style="margin-top:8px;font-size:11px">Embedded charts can be blocked inside the ChatGPT sandbox — the live link always works.</div>
  </div>`;
  const cv=document.getElementById("dexspark");
  if(!cv) return;
  if(S.ohlc&&S.ohlc.length) drawSpark(cv,S.ohlc);
  else if(!S.sparkQ&&S.mint){ S.sparkQ=true;
    Bridge.callTool("orbitx_get_chart",{mint:S.mint,interval:"15m",limit:48,chain:"solana",authCode:getAuth()})
      .then(r=>{ const c=r.candles||r.data||r.ohlc||[];
        if(c.length){ S.ohlc=c; if(S.chartTab==="dex") paintChart(); } })
      .catch(()=>{}); }
}
/* TradingView — only reachable when a real symbol resolved (tab is hidden otherwise) */
function paintTV(box){
  box.innerHTML=`<div class="tradingview-widget-container" style="height:480px;width:100%">
    <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div></div>`;
  // innerHTML scripts never run — inject the TradingView embed properly
  const sc=document.createElement("script");
  sc.src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
  sc.async=true;
  sc.textContent=JSON.stringify({symbol:S.tvSym,theme:"dark",style:"1",locale:"en",
    hide_side_toolbar:true,allow_symbol_change:true,autosize:true,
    backgroundColor:"rgba(4,7,10,1)"});
  box.querySelector(".tradingview-widget-container").appendChild(sc);
}
/* Mini sparkline from real OHLC closes */
function drawSpark(cv,rows){
  try{
    const dpr=window.devicePixelRatio||1, W=cv.clientWidth||520, H=90;
    cv.width=W*dpr; cv.height=H*dpr;
    const x=cv.getContext("2d"); x.scale(dpr,dpr);
    const cl=rows.map(c=>Number(c.close!=null?c.close:c.c)).filter(Number.isFinite);
    if(cl.length<2) return;
    const mx=Math.max.apply(null,cl), mn=Math.min.apply(null,cl), rg=(mx-mn)||1;
    x.strokeStyle=cl[cl.length-1]>=cl[0]?"#17ff4d":"#ff4d5e"; x.lineWidth=2; x.beginPath();
    cl.forEach((v,i)=>{ const px=i/(cl.length-1)*W, py=6+(H-12)*(1-(v-mn)/rg);
      i?x.lineTo(px,py):x.moveTo(px,py); });
    x.stroke();
  }catch(e){}
}
async function loadOHLC(){
  const msg=document.getElementById("ohlcmsg"); const sk=document.getElementById("ohlcskel");
  try{
    const r=await Bridge.callTool("orbitx_get_chart",{mint:S.mint,interval:S.tf,limit:60,chain:"solana",authCode:getAuth()});
    const c=r.candles||r.data||r.ohlc||[];
    S.ohlc=c;
    if(sk) sk.style.display="none";
    const cv=document.getElementById("ohlcCanvas"); if(cv) cv.style.display="block";
    if(!c.length){ if(msg) msg.textContent="No candle data returned for this token at "+S.tf+"."; return; }
    drawOHLC();
    if(msg) msg.textContent=c.length+" real "+S.tf+" candles from OrbitX — never simulated.";
    if(S.chartTab==="dex") paintChart(); /* refresh dex preview sparkline */
  }catch(e){ if(msg) msg.textContent="Candle feed error: "+e.message; if(sk) sk.style.display="none"; }
}
function drawOHLC(){
  const cv=document.getElementById("ohlcCanvas"); if(!cv||!S.ohlc) return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth||560, H=440;
  cv.width=W*dpr; cv.height=H*dpr;
  const x=cv.getContext("2d"); x.scale(dpr,dpr);
  const rows=S.ohlc.map(c=>({o:+c.open??+c.o,h:+c.high??+c.h,l:+c.low??+c.l,cl:+c.close??+c.c,t:c.time||c.timestamp}));
  const hs=rows.map(r=>r.h), ls=rows.map(r=>r.l);
  const mx=Math.max(...hs), mn=Math.min(...ls), rg=(mx-mn)||1;
  const cw=W/rows.length;
  x.clearRect(0,0,W,H);
  x.strokeStyle="#14202a"; x.fillStyle="#5b6b7a"; x.font="10px monospace";
  for(let i=0;i<5;i++){ const v=mx-rg*i/4, y=10+(H-40)*i/4;
    x.beginPath(); x.moveTo(0,y); x.lineTo(W,y); x.stroke();
    x.fillText("$"+fmt(v), 4, y-3); }
  rows.forEach((r,i)=>{
    const cx=i*cw+cw/2, bw=Math.max(2,cw*0.6);
    const y=o=>10+(H-40)*(1-(o-mn)/rg);
    const up=r.cl>=r.o, col=up?"#17ff4d":"#ff4d5e";
    x.strokeStyle=col; x.fillStyle=col;
    x.beginPath(); x.moveTo(cx,y(r.h)); x.lineTo(cx,y(r.l)); x.stroke();
    const yo=y(r.o), yc=y(r.cl);
    x.fillRect(cx-bw/2, Math.min(yo,yc), bw, Math.max(2,Math.abs(yc-yo)));
  });
  const last=rows[rows.length-1];
  x.fillStyle="#00d4ff"; x.font="bold 12px monospace";
  x.fillText("LAST $"+fmt(last.cl), 8, H-8);
}
</script>

async function alertTick(){
  const list=alertLoad().filter(a=>!a.triggered);
  if(!list.length) return;
  let changed=false;
  for(const a of list){
    try{
      const r=await Bridge.callTool("orbitx_alert_create",{mint:a.mint,condition:a.condition,price:a.price});
      const cur=r&&r.alert&&r.alert.currentUsd;
      if(cur!=null){
        const hit=a.condition==="above"?cur>=a.price:cur<=a.price;
        if(hit){ a.triggered=true; a.triggeredAt=new Date().toISOString(); a.triggerPrice=cur; changed=true;
          try{ if("Notification" in window&&Notification.permission==="granted") new Notification("OrbitX alert",{body:`${a.symbol||a.mint.slice(0,8)} ${a.condition} $${a.price} — now $${cur}`}); }catch(e){} }
      }
    }catch(e){}
  }
  if(changed){ alertSave(alertLoad().map(a=>{ const u=list.find(x=>x.id===a.id); return u||a; })); if(S.screen==="alerts"){ S.alerts=alertLoad(); render(); } }
}

/* ================= Analyst tab ================= */
const AA_CFG_KEY="orbitx.agentAnalyst.config", AA_TRACK_KEY="orbitx.agentAnalyst.track";
function aaCfgLoad(){ try{ const r=localStorage.getItem(AA_CFG_KEY); return r?JSON.parse(r):{}; }catch(e){ return {}; } }
function aaCfgSave(c){ try{ localStorage.setItem(AA_CFG_KEY,JSON.stringify(c)); }catch(e){} }
function aaTrackLoad(){ try{ const r=localStorage.getItem(AA_TRACK_KEY); return r?JSON.parse(r):[]; }catch(e){ return []; } }
function aaTrackSave(l){ try{ localStorage.setItem(AA_TRACK_KEY,JSON.stringify(l.slice(0,60))); }catch(e){} }

  if(cfg.minConviction) S.analyst.minConviction=cfg.minConviction;
  if(!S.analyst.track.length){ const t=aaTrackLoad(); if(t.length) S.analyst.track=t; }
}
function convBadge(c){
  c=String(c||"").toLowerCase();
  if(c==="high") return `<span class="conv high">🔴 HIGH</span>`;
  if(c==="medium") return `<span class="conv medium">🟡 MEDIUM</span>`;
  return `<span class="conv low">⚪ LOW</span>`;
}
async function analystStart(){
  const ac=getAuth();
  if(!ac){ S.error="Reconnect via the OrbitX auth widget, then start the analyst."; render(); return; }
  S.analyst.busy=true; S.error=""; render();
  try{
    const cfg=await Bridge.callTool("orbitx_agent_analyst",{action:"start",minConviction:S.analyst.minConviction,authCode:ac});
    if(cfg&&cfg.ok===false) throw new Error(cfg.error||cfg.message||"analyst start failed");
    aaCfgSave({minConviction:S.analyst.minConviction});
    S.analyst.running=true;
    await analystTick();
    if(S.analyst.timer) clearInterval(S.analyst.timer);
    S.analyst.timer=setInterval(analystTick,60000);
  }catch(e){ setErr(e); }
  S.analyst.busy=false; render();
}
function analystStop(){
  if(S.analyst.timer){ clearInterval(S.analyst.timer); S.analyst.timer=null; }
  S.analyst.running=false; render();
}
async function analystTick(){
  if(!S.analyst.running) return;
  const ac=getAuth();
  if(!ac){ analystStop(); S.error="Session expired — reconnect via the OrbitX auth widget."; render(); return; }
  try{
    const r=await Bridge.callTool("orbitx_agent_analyst",{action:"brief",minConviction:S.analyst.minConviction,authCode:ac});
    if(r&&r.ok===false) throw new Error(r.error||r.message||"brief failed");
    const calls=(r&&r.calls)||[];
    S.analyst.calls=calls;
    recordTrack(calls);
    S.error="";
  }catch(e){ setErr(e); }
  if(S.screen==="analyst") render();
}
function recordTrack(calls){
  const now=Date.now(); let changed=false;
  const trk=S.analyst.track;
  for(const c of calls){
    const mint=String(c.mint||"");
    if(!mint) continue;
    const cur=Number(c.priceUsd);
    const existing=trk.find(t=>t.mint===mint);
    if(existing){
      /* latest brief carries current price for already-tracked mints */
      if(isFinite(cur)&&cur>0){ existing.curPrice=cur; existing.updatedAt=now; changed=true; }
      continue;
    }
    /* skip re-tracking the same mint within 30 min */
    if(trk.some(t=>t.mint===mint&&now-t.time<30*60000)) continue;
    trk.unshift({mint,symbol:c.symbol||"?",conviction:String(c.conviction||"medium").toLowerCase(),
      price:(isFinite(cur)&&cur>0)?cur:null,curPrice:(isFinite(cur)&&cur>0)?cur:null,
      time:now,updatedAt:now,url:c.url||""});
    changed=true;
  }
  if(changed){ S.analyst.track=trk.slice(0,60); aaTrackSave(S.analyst.track); }
}
function aaWinRate(){
  const now=Date.now(); let right=0, settled=0;
  for(const t of S.analyst.track){
    if(String(t.conviction)!=="high") continue;
    if(now-t.time<3600000) continue; /* settles 1h after the call */
    if(!(t.price>0)||!(t.curPrice>0)) continue;
    settled++; if(t.curPrice>t.price) right++;
  }
  return {right,settled,rate:settled?(100*right/settled):null};
}
function analystConvSet(v){
  S.analyst.minConviction=v; aaCfgSave({minConviction:v});
  if(S.analyst.running){ analystStop(); analystStart(); } else render();
}
function renderAnalyst(){
  const A=S.analyst, wr=aaWinRate();
  app.innerHTML=header(false,"AI ANALYST")+tabsHTML()+`
  <div class="card glow"><div class="sect" style="margin:0 0 10px">📊 Market analyst<span class="sp"></span>
    ${A.running?'<span class="mut"><span class="dotpulse"></span><b style="color:var(--neon)">LIVE</b></span>':'<span class="mut">idle</span>'}</div>
    <p class="mut" style="margin-bottom:12px">AI conviction calls from OrbitX scanners, refreshed every minute.<br>Runs while this widget is open — intel, not financial advice.</p>
    <div class="field"><span class="flabel">MIN CONVICTION</span><div class="seg">
      ${["low","medium","high"].map(v=>`<button class="${A.minConviction===v?"on":""}" onclick="analystConvSet('${v}')">${v[0].toUpperCase()+v.slice(1)}</button>`).join("")}</div></div>
    ${A.running
      ?`<button class="btn bigstart" style="background:linear-gradient(135deg,#ff4d5e,#c81e3a);color:#fff" onclick="analystStop()">🔴 STOP ANALYST</button>`
      :`<button class="btn bigstart" ${A.busy?"disabled":""} onclick="analystStart()">${A.busy?"Starting…":"🟢 START ANALYST"}</button>`}
    ${errHTML()}
  </div>
  <div class="card"><div class="sect" style="margin:0 0 10px">Analyst feed<span class="sp"></span>
    <span class="mut">${A.calls.length?A.calls.length+" calls":""}</span></div>
    ${A.calls.length?A.calls.map(analystCard).join("")
      :`<div class="empty"><div class="big">📊</div><b>No calls yet</b><p class="mut">Start the analyst to get live conviction calls.</p></div>`}
  </div>
  <div class="card"><div class="sect" style="margin:0 0 10px">Track record<span class="sp"></span>
    ${wr.rate!=null?`<span class="badge ${wr.rate>=50?"good":"bad"}">${wr.rate.toFixed(0)}% WIN</span>`:""}</div>
    <div class="mut" style="margin-bottom:10px">High-conviction calls, settled 1h after the call time.
      ${wr.settled?wr.right+"/"+wr.settled+" right":"None settled yet"}.</div>
    ${A.track.length?A.track.map(trackRow).join("")
      :`<div class="empty"><div class="big">🧾</div><b>No tracked calls yet</b><p class="mut">Calls you receive are tracked here against their entry price.</p></div>`}
  </div>`;
}
function analystCard(c){
  const mint=String(c.mint||""), p=Number(c.priceUsd);
  const cell=(k,l)=>{ const v=Number(c[k]);
    return `<div class="pcell"><div class="l">${l}</div><div class="v ${isNaN(v)?"":pctCls(v)}">${fmtPct(v)}</div></div>`; };
  return `<div class="card" style="padding:12px;margin-bottom:8px;cursor:pointer" onclick="inspect('${esc(mint)}')">
    <div class="row"><div style="flex:1;min-width:0">
      <div class="tname">${esc(c.symbol||"?")} ${convBadge(c.conviction)}</div>
      <div class="tsym mono">${shortMint(mint)}</div></div>
      <div class="tprice"><div>${fmtUSD(p)}</div></div></div>
    <div class="pgrid">${cell("chg5m","5M")}${cell("chg1h","1H")}${cell("chg24h","24H")}</div>
    <div class="row"><div class="tsub">Vol 24h ${fmtUSD(Number(c.vol24h))} · Liq ${fmtUSD(Number(c.liquidity))}</div>
      ${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener" class="chev" style="text-decoration:none" onclick="event.stopPropagation()">↗</a>`:""}</div>
    ${(c.reasons&&c.reasons.length)?`<ul class="reasons">${c.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}
  </div>`;
}
function trackRow(t){
  const settled=Date.now()-t.time>=3600000;
  const hasPx=t.price>0&&t.curPrice>0;
  const chg=hasPx?(100*(t.curPrice-t.price)/t.price):null;
  const verdict=!settled?`<span class="badge info">PENDING</span>`
    :String(t.conviction)==="high"
      ?(chg!=null&&chg>0?`<span class="badge good">RIGHT</span>`:`<span class="badge bad">WRONG</span>`)
      :`<span class="badge info">SETTLED</span>`;
  return `<div class="trow" style="cursor:pointer" onclick="inspect('${esc(t.mint)}')">
    <div class="tmeta"><div class="tname">${esc(t.symbol||"?")} ${convBadge(t.conviction)}</div>
      <div class="tsub">${ago(t.time)} · entry ${fmtUSD(t.price)}${hasPx?` → <span class="${pctCls(chg)}">${fmtPct(chg)}</span>`:""}</div></div>
    ${verdict}</div>`;
}

/* ================= Research tab ================= */
function renderResearch(){
  const R=S.research, rep=R.report;
  app.innerHTML=header(false,"AI RESEARCH")+tabsHTML()+`
  <div class="card glow"><div class="sect" style="margin:0 0 10px">🔬 Token research<span class="sp"></span></div>
    <p class="mut" style="margin-bottom:12px">Full-spectrum dossier: safety audit, holders, whale flow, price action and a verdict.</p>
    <div class="field"><span class="flabel">TOKEN MINT</span>
      <input type="text" placeholder="paste mint…" value="${esc(R.mint||"")}" oninput="S.research.mint=this.value"
        autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')doResearch()"></div>
    <div class="field"><span class="flabel">DEPTH</span><div class="seg">
      <button class="${R.depth==="quick"?"on":""}" onclick="S.research.depth='quick';render()">⚡ Quick</button>
      <button class="${R.depth==="full"?"on":""}" onclick="S.research.depth='full';render()">🔬 Full</button></div></div>
    <button class="btn" ${R.loading?"disabled":""} onclick="doResearch()">${R.loading?"Researching…":"🔬 Research token"}</button>
    ${errHTML()}
  </div>
  ${R.loading?researchSkel():rep?researchHTML(rep):`<div class="card"><div class="empty"><div class="big">🔬</div>
    <b>No report yet</b><p class="mut">Paste a token mint above for a full research dossier.</p></div></div>`}`;
}
function researchSkel(){
  return `<div class="card"><div class="skel" style="height:110px;margin-bottom:10px"></div>
    <div class="skel" style="height:80px;margin-bottom:10px"></div>
    <div class="skel" style="height:80px;margin-bottom:10px"></div>
    <div class="skel" style="height:120px"></div></div>`;
}
async function doResearch(mint){
  const m=String(mint!=null?mint:(S.research.mint||"")).trim();
  if(!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(m)){ S.error="Paste a valid token mint."; render(); return; }
  const ac=getAuth();
  if(!ac){ S.error="Reconnect via the OrbitX auth widget, then research."; render(); return; }
  S.research.mint=m; S.research.loading=true; S.research.report=null; S.error=""; render();
  try{
    const r=await Bridge.callTool("orbitx_agent_research",{mint:m,depth:S.research.depth,authCode:ac});
    if(r&&r.ok===false) throw new Error(r.error||r.message||"research failed");
    S.research.report=(r&&r.report)||null;
    if(!S.research.report) S.error="Research returned no report.";
  }catch(e){ setErr(e); }
  S.research.loading=false; render();
}
function verdictCls(v){
  v=String(v||"").toLowerCase();
  if(/buy|bull|strong|good/.test(v)) return "buy";
  if(/avoid|sell|bear|scam|danger|bad/.test(v)) return "avoid";
  return "wait";
}
function researchHTML(rep){
  const s=rep.safety||{}, pa=rep.priceAction||{};
  const vc=verdictCls(rep.verdict);
  const conf=Math.max(0,Math.min(100,Number(rep.confidence)||0));
  const flags=s.flags||[];
  const whales=(rep.whaleActivity||[]);
  const chgCell=(k,l)=>{ const v=Number(pa[k]);
    return `<div class="pcell"><div class="l">${l}</div><div class="v ${isNaN(v)?"":pctCls(v)}">${fmtPct(v)}</div></div>`; };
  return `
  <div class="verdict ${vc}">
    <div style="flex:1;min-width:0"><div class="word">${esc(String(rep.verdict||"—").toUpperCase())}</div>
      <div class="mut" style="margin-top:4px">${esc(rep.symbol||"")} · confidence ${conf}%</div>
      <div class="meter"><i style="width:${conf}%"></i></div></div>
    <button class="btn sm ghost" style="white-space:nowrap" onclick="shareReport()">⤴ Share</button>
  </div>
  <div class="card"><div class="sect" style="margin:0 0 10px">🛡 Safety audit<span class="sp"></span>
    <span class="badge ${Number(s.score)>=70?"good":Number(s.score)>=40?"warn":"bad"}">${esc(String(s.score??"—"))}/100</span></div>
    ${frow("Liquidity",fmtUSD(Number(s.liquidity??rep.liquidity)))}
    ${frow("Holders",fmt(s.holders))}
    ${frow("Dev %",s.devPct!=null?Number(s.devPct).toFixed(2)+"%":"—")}
    ${flags.length?`<div class="mut" style="margin:8px 0 4px;font-size:11px;letter-spacing:1px">FLAGS</div>
      <ul class="reasons">${flags.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`
      :`<div class="mut" style="margin-top:8px">No safety flags raised.</div>`}
  </div>
  <div class="card"><div class="sect" style="margin:0 0 10px">🐋 Whale activity<span class="sp"></span></div>
    ${whales.length?whales.slice(0,8).map(w=>{
      const dir=String(w.direction||"").toLowerCase();
      const emoji=(dir==="buy"||dir==="in")?"🟢":(dir==="sell"||dir==="out")?"🔴":"⚪";
      return `<div class="wrow"><div>${emoji} <b>${esc(String(w.direction||"?").toUpperCase())}</b>
        <span class="mut"> · ${fmtUSD(Number(w.usd))}</span></div>
        <div class="mut">${esc(w.time||"")}${w.url?` <a href="${esc(w.url)}" target="_blank" rel="noopener" style="color:var(--neon)">↗</a>`:""}</div></div>`;
    }).join("")
      :`<div class="mut">No whale flow reported.</div>`}
  </div>
  <div class="card"><div class="sect" style="margin:0 0 10px">📈 Price action<span class="sp"></span></div>
    <div class="pgrid">${chgCell("chg5m","5M")}${chgCell("chg1h","1H")}${chgCell("chg6h","6H")}${chgCell("chg24h","24H")}</div>
    ${frow("Vol 24h",fmtUSD(Number(pa.vol24h)))}
    ${frow("Price",fmtUSD(Number(rep.priceUsd)))}
    ${frow("Mcap",fmtUSD(Number(rep.mcap)))}
  </div>
  ${rep.reasons&&rep.reasons.length?`<div class="card"><div class="sect" style="margin:0 0 10px">💡 Reasons</div>
    <ul class="reasons">${rep.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`:""}
  <div class="mut" style="text-align:center;font-size:11px;margin:6px 0 10px">Research is intel, not financial advice.${rep.generatedAt?" Generated "+new Date(rep.generatedAt).toLocaleString():""}</div>
  <div class="card"><button class="btn sm ghost" style="width:100%" onclick="inspect('${esc(String(rep.mint||""))}')">🪙 Open token dossier</button></div>`;
}
function shareReport(){
  const rep=S.research.report; if(!rep) return;
  const s=rep.safety||{}, pa=rep.priceAction||{};
  const lines=[
    `🔬 OrbitX Research: ${rep.symbol||"?"}${rep.name?" ("+rep.name+")":""}`,
    `Verdict: ${String(rep.verdict||"—").toUpperCase()} (${Number(rep.confidence)||0}% confidence)`,
    `Price: ${fmtUSD(Number(rep.priceUsd))} · 24h ${fmtPct(Number(pa.chg24h))} · Mcap ${fmtUSD(Number(rep.mcap))}`,
    `Safety: ${s.score??"—"}/100 · Holders ${fmt(s.holders)} · Dev ${s.devPct!=null?Number(s.devPct).toFixed(2)+"%":"—"}`,
    (rep.reasons&&rep.reasons.length)?"Why: "+rep.reasons.slice(0,3).map(r=>String(r)).join(" | "):"",
    rep.url||""
  ].filter(Boolean);
  const txt=lines.join("\n");
  const ok=()=>toast("Report copied to clipboard");
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok,()=>{fallbackCopy(txt);ok();});
  else { fallbackCopy(txt); ok(); }
}
function fallbackCopy(t){ try{ const ta=document.createElement("textarea"); ta.value=t;
  ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
  ta.select(); document.execCommand("copy"); ta.remove(); }catch(e){} }

/* ---------- Boot ---------- */
renderExplore();
/* Standalone (no host bridge): auto-load trending so the widget shows real
   data immediately instead of an empty shell. Bridge mode keeps the
   toolOutput-driven flow untouched. */
(function(){
  const bridged = (window.openai&&typeof window.openai.callTool==="function")
    || (window.OrbitX&&typeof window.OrbitX.callTool==="function");
  const hasBootstrap = !!(window.openai && window.openai.toolOutput);
  if(!bridged && !hasBootstrap){
    S.screen="discover"; render(); loadDiscover();
  }
})();
</script>
