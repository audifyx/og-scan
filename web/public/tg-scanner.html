<!DOCTYPE html>
<!--
  OrbitX OG Scanner — Telegram Mini App (v2)
  =================================================
  Thin full-screen shell: it embeds the ACTUAL scanner — the same
  <TokenScanner /> the web app serves at /scanner/:mint — in a
  same-origin iframe. Nothing about the scanner is replicated here:
  same UI, same data, same routes, nothing to drift. The shell only
  adds:
    - a minimal mint input (paste a contract -> load /scanner/<mint>)
    - Telegram.WebApp expand() + theme handling for the shell chrome
    - mint from ?mint= or Telegram start_param (t.me/orbitxapirbot?startapp=<mint>)

  This page is a static file in web/public/, served at
  https://orbitx.world/tg-scanner.html before the SPA catch-all
  rewrite (same precedent as hunter.html / landing.html).

  Framing is allowed: web/vercel.json sets X-Frame-Options SAMEORIGIN
  on the catch-all, and the shell + iframe are the same origin
  (orbitx.world). The scanner inside is the public /scanner route —
  no Telegram session is needed to view it, and it works in a plain
  browser too. The bot's /scan command still uses POST /api/ogdex/tg-scan
  (tg-scan endpoint, OG-score engine) — this page does not call it.

  Read-only display. NO wallet connect, NO trading, NO buy/sell,
  NO payments, NO Stars. The scanner inside has its own share.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>OrbitX OG Scanner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /*
      Shell chrome only — the scanner itself is the React app inside
      the iframe and brings its own theme. Contrast rule (user-set,
      all OrbitX platforms, forever): never light-on-light or
      dark-on-dark. The shell takes Telegram's own bg/text pair when
      run inside Telegram, and defaults to the OrbitX dark theme.
    */
    :root {
      --bg: #000000;
      --text: #ffffff;
      --hint: #a8a8a8;
      --card: #111111;
      --card-border: #2a2a2a;
      --btn: #c9a227;          /* OrbitX gold */
      --btn-text: #000000;
      --gold: #d4af37;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---- Shell top bar: logo + mint input + Scan ---- */
    .bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 12px calc(10px + env(safe-area-inset-top, 0px));
      padding-top: calc(10px + env(safe-area-inset-top));
      background: var(--bg);
      border-bottom: 1px solid var(--card-border);
    }
    .brand { display: flex; align-items: center; gap: 8px; flex: none; }
    .brand img { width: 30px; height: 30px; border-radius: 7px; object-fit: cover; }
    .brand .title { font-size: 15px; font-weight: 800; letter-spacing: .02em; line-height: 1.1; white-space: nowrap; }
    .brand .title span { color: var(--gold); }
    .greeting { font-size: 12px; color: var(--hint); line-height: 1.1; }
    .mint-row { display: flex; gap: 8px; flex: 1 1 220px; min-width: 0; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--gold); }
    input[type="text"]::placeholder { color: var(--hint); opacity: .8; }
    button {
      flex: none;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 800;
      color: var(--btn-text);
      background: var(--btn);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }
    button:active { opacity: .85; }
    .error {
      display: none;
      flex: 1 1 100%;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      background: #7f1d1d;
      border: 1px solid #b91c1c;
      border-radius: 10px;
      padding: 8px 12px;
    }
    .error.show { display: block; }

    /* ---- Scanner iframe: takes all remaining height ---- */
    .frame-wrap { position: relative; flex: 1 1 auto; min-height: 0; background: #000000; }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000000;
    }
    .frame-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--hint);
      font-size: 14px;
      background: #000000;
      pointer-events: none;
    }
    .frame-loading.hide { display: none; }
    .spinner {
      width: 26px; height: 26px;
      border: 3px solid var(--card-border); border-top-color: var(--gold);
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <img src="/orbitx-icon-512.png" alt="OrbitX logo" width="30" height="30" />
      <div>
        <div class="title">ORBIT<span>X</span> OG SCANNER</div>
        <div class="greeting" id="greeting">Free forever — the full scanner</div>
      </div>
    </div>
    <div class="mint-row">
      <input id="contract" type="text" inputmode="text" autocomplete="off" autocapitalize="off"
        spellcheck="false" placeholder="Paste a Solana contract address" />
      <button id="scanBtn" type="button">Scan</button>
    </div>
    <div class="error" id="errorBox" role="alert"></div>
  </div>

  <div class="frame-wrap">
    <iframe id="scannerFrame" title="OrbitX OG Scanner" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
    <div class="frame-loading" id="frameLoading"><div class="spinner"></div>Loading the scanner&hellip;</div>
  </div>

<script>
"use strict";

/* Telegram WebApp object — absent outside Telegram. Never crash on it. */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

/* The real scanner route inside the iframe. No mint -> scanner home,
   which has its own input. */
const SCANNER_HOME = "/scanner";
function scannerUrl(mint) {
  return mint ? ("/scanner/" + encodeURIComponent(mint)) : SCANNER_HOME;
}

/* ------------------------------------------------------------------ */
/* Theme: match Telegram light/dark via themeParams (shell chrome only). */
/* ------------------------------------------------------------------ */
function applyTheme() {
  if (!tg) return; // defaults in :root are the OrbitX dark theme
  const p = tg.themeParams || {};
  const root = document.documentElement.style;
  // Take Telegram's own bg/text pair so contrast is always correct:
  // light Telegram bg ships with dark text, dark bg with light text.
  if (p.bg_color) root.setProperty("--bg", p.bg_color);
  if (p.text_color) root.setProperty("--text", p.text_color);
  if (p.hint_color) root.setProperty("--hint", p.hint_color);
  if (p.secondary_bg_color) root.setProperty("--card", p.secondary_bg_color);
  if (p.button_color) root.setProperty("--btn", p.button_color);
  if (p.button_text_color) root.setProperty("--btn-text", p.button_text_color);
  if (p.hint_color) root.setProperty("--card-border", p.hint_color);
  document.querySelector('meta[name="theme-color"]')
    .setAttribute("content", p.bg_color || "#000000");
}

/* ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function showError(msg) {
  const box = $("errorBox");
  box.textContent = msg;
  box.classList.add("show");
}
function clearError() { $("errorBox").classList.remove("show"); $("errorBox").textContent = ""; }

/* Solana mint: base58, 32–44 chars (no 0, O, I, l). */
const MINT_RE = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;
function isValidMint(a) { return MINT_RE.test((a || "").trim()); }

/* Mint sources, in priority order:
   1. ?mint= on the shell URL (direct link / debug)
   2. Telegram start_param — t.me/orbitxapirbot?startapp=<mint> */
function initialMint() {
  try {
    const q = new URLSearchParams(window.location.search).get("mint");
    if (q && isValidMint(q)) return q.trim();
  } catch (e) { /* ignore */ }
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
    const sp = String(tg.initDataUnsafe.start_param).trim();
    if (isValidMint(sp)) return sp;
  }
  return null;
}

let currentMint = null;
function loadScanner(mint) {
  currentMint = mint || null;
  if (currentMint) {
    $("contract").value = currentMint;
  }
  $("frameLoading").classList.remove("hide");
  $("scannerFrame").src = scannerUrl(currentMint);
}

/* ------------------------------------------------------------------ */
/* Scan from the shell input                                           */
/* ------------------------------------------------------------------ */
function doScan() {
  clearError();
  const contract = $("contract").value.trim();
  if (!contract) { showError("Paste a contract address first."); return; }
  if (!isValidMint(contract)) {
    showError("That doesn't look like a Solana contract address — it should be 32–44 letters and numbers, with no 0, O, I or l.");
    return;
  }
  loadScanner(contract);
  if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }
}

/* ------------------------------------------------------------------ */
/* Boot                                                                */
/* ------------------------------------------------------------------ */
function boot() {
  applyTheme();

  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    // Greeting is display-only — never used for auth.
    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (user && user.first_name) {
      $("greeting").innerHTML = "Hey, <b>" + esc(user.first_name) + "</b> — the full scanner";
    }
    if (tg.onEvent) {
      try { tg.onEvent("themeChanged", applyTheme); } catch (e) {}
    }
  }

  $("scannerFrame").addEventListener("load", function () {
    $("frameLoading").classList.add("hide");
  });
  $("scanBtn").addEventListener("click", doScan);
  $("contract").addEventListener("keydown", (e) => { if (e.key === "Enter") doScan(); });
  $("contract").addEventListener("input", clearError);

  loadScanner(initialMint());
}
document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
